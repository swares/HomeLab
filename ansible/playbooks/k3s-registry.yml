---
# Configure all k3s nodes to pull from the lab registry at registry.apps.lab.home.arpa.
# The registry uses a cert-manager lab-ca TLS cert (self-signed root); rather than
# distributing the CA to every host, we set insecure_skip_verify which is fine on a
# trusted LAN. Run this after the registry workload is healthy in ArgoCD.
#
# Also configures Docker on the xu3-1 build agent so images can be pushed.
#
# Usage: make k3s-registry

- name: Configure k3s nodes to trust lab registry
  hosts: k3s_server:k3s_agents
  become: true
  # One node at a time. The handler below restarts k3s, and three of these hosts are
  # control-plane servers sharing an embedded etcd quorum — restarting them together
  # (Ansible's default parallelism) loses quorum and takes the API server down.
  # Added 2026-08-09; this play had no serial and had never been run against the
  # full group.
  serial: 1
  vars:
    registry_host: registry.apps.lab.home.arpa
    k3s_config_dir: /etc/rancher/k3s

  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: "{{ k3s_config_dir }}"
        state: directory
        mode: "0755"

    - name: Write registries.yaml
      ansible.builtin.copy:
        dest: "{{ k3s_config_dir }}/registries.yaml"
        # 0644 to match what is deployed. The template said 0600, so a --check on
        # 2026-08-09 reported all five nodes as changed on the mode alone — and
        # since this copy notifies `restart k3s`, applying it would have rolled
        # every node in the cluster to tighten permissions on a file that holds no
        # credentials.
        #
        # If an `auth:` block is ever added here, change this to 0600 in the same
        # commit and accept the rolling restart then. Tightening permissions is
        # worth a restart when there is a secret to protect, and not before.
        mode: "0644"
        content: |
          # Ansible-managed — lab OCI registry (Zot, self-signed cert)
          mirrors:
            "{{ registry_host }}":
              endpoint:
                - "https://{{ registry_host }}"
          configs:
            "{{ registry_host }}":
              tls:
                insecure_skip_verify: true
      notify: restart k3s
      # REDUCED 2026-08-09 to match what is actually deployed. The previous template
      # additionally mirrored docker.io and ghcr.io through Zot, and added an auth
      # block referencing `zot_admin_password` — a variable defined nowhere in this
      # repo, so the play could only ever fail on a bare undefined-variable error.
      #
      # It had therefore never been run. The live file on h4-core, opi5pro-2, n150-1
      # and n150-2 is the simpler form above: registry mirror only, no auth. Only
      # opi5pro-1 lacks it entirely.
      #
      # Two reasons not to restore the richer version:
      #
      #   1. Cold-start dependency. Mirroring docker.io/ghcr.io routes every image
      #      pull on every node through Zot — which runs inside the cluster it
      #      serves. A cold cluster, a new node, or a node after image GC then needs
      #      Zot to start Zot.
      #   2. Nothing needs it. The only lab-registry image in use is
      #      registry.apps.lab.home.arpa/m5stack-adapter, and Zot serves it without
      #      authentication today.
      #
      # If Zot as a pull-through cache is wanted later, make it a deliberate change
      # with its own rollback story — not a side effect of running this playbook.

  handlers:
    - name: restart k3s
      ansible.builtin.systemd:
        # Server nodes run 'k3s', agent nodes run 'k3s-agent'
        name: "{{ 'k3s' if inventory_hostname in groups['k3s_server'] else 'k3s-agent' }}"
        state: restarted

- name: Configure Docker on build nodes to push to lab registry
  # xu3-1 removed 2026-08-09. It runs Ubuntu 16.04, whose Python is too old for
  # ansible-core: every module dies with a SyntaxError on an f-string inside
  # module_utils/basic.py, before any task logic runs. `ignore_unreachable` does not
  # help — the host is reachable, the module is what breaks. It is already excluded
  # from Ansible auto-updates (docs/HARDWARE.md). Configure it by hand or retire it;
  # pretending it is manageable only makes every run report a failure.
  hosts: h4-core
  become: true
  any_errors_fatal: false
  vars:
    registry_host: registry.apps.lab.home.arpa

  tasks:
    # h4-core runs docker-ce 29.7.1 from Docker's own repository, which depends on
    # containerd.io. Ubuntu's docker.io depends on containerd, and the two conflict:
    #
    #   containerd.io : Conflicts: containerd
    #
    # So this task could never succeed here — and had it succeeded, it would have
    # torn out a working Docker install. Install only where Docker is absent.
    - name: Detect an existing Docker daemon
      ansible.builtin.command: docker --version
      register: docker_present
      changed_when: false
      failed_when: false
      check_mode: false   # read-only probe; the `when` below needs a real rc

    - name: Ensure Docker is installed
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: docker_present.rc != 0

    - name: Read existing daemon.json (if present)
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: _daemon_json
      ignore_errors: true

    - name: Write daemon.json with insecure-registries
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "insecure-registries": ["{{ registry_host }}"]
          }
      notify: restart docker

    # CHECK-MODE ACCURACY, not just check-mode honesty — 2026-08-29, BACKLOG §3.11.
    #
    # `ansible.builtin.user` with `append: true` cannot reliably determine existing
    # supplementary group membership under --check, and reports `changed` even when
    # the user is already a member. Verified on h4-core the same day: this task
    # reported changed in a dry run while `getent group docker` returned
    #     docker:x:124:swares
    # — swares was already in the group. A false positive, not drift.
    #
    # That distinction matters more than it looks. The §3.11 drift check publishes
    # lab_ansible_drift from summed `changed` counts, so a task that is permanently
    # and wrongly `changed` puts a non-zero FLOOR under the metric. An alert that can
    # never go green is an alert that gets ignored — which is exactly what
    # LabExternalHostDown did for three weeks against a decommissioned VM, and the
    # reason lab-alerts.yaml carries a note about it.
    #
    # So: read the group first, and only touch the user if the membership is really
    # missing. The getent is read-only and carries check_mode: false, because a guard
    # that skips under --check makes the task below unconditional again.
    - name: Read the docker group's current members
      ansible.builtin.getent:
        database: group
        key: docker
      check_mode: false

    - name: Add ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: >-
        ansible_user not in
        (ansible_facts.getent_group.get('docker', ['', '', ''])[2] | default('')).split(',')

  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
