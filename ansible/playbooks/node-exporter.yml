---
# Deploy prometheus-node-exporter on non-cluster Linux hosts.
#
# The k3s cluster is h4-core + n150-1/2 (servers) and opi5pro-1/2 (agents).
# ONLY those nodes get node_exporter via the kube-prometheus-stack DaemonSet.
# rpi5 (Vault), xu3-1 (build agent) and gitlab-1 (VM) are NOT cluster nodes —
# an earlier version of this header wrongly listed rpi5 and xu3-1 as cluster
# nodes, so they were left out of the `node_exporter` inventory group and had
# no exporter at all while Prometheus scraped them. Corrected 2026-07-26.
#
# Supported OS families:
#   Debian    — octopi-dns, rpi4b, rpi5, gitlab-1, opi-zero2w-3  (apt)
#   Archlinux — opi-zero2w-{1,2,4}                               (pacman)
#
# xu3-1 is handled by the second play below (upstream binary, not apt).
#
# Run:
#   ansible-playbook -i inventory/hosts.yml playbooks/node-exporter.yml
#
# ── Play 0: cluster nodes must NOT run a host node_exporter ──────────────────
#
# The header above has always SAID cluster nodes get the DaemonSet only. Nothing
# enforced it, and on 2026-08-27 the H4 was found running the Debian package
# anyway — almost certainly a MicroShift-era leftover that survived the k3s
# rebuild.
#
# The cost: `prometheus-node` (PID 986, started at boot) owned 0.0.0.0:9100, so
# the DaemonSet pod could never bind and had been in CrashLoopBackOff for
# **19 days** — 273 restarts, firing KubePodCrashLooping and
# KubeDaemonSetRolloutStuck the whole time. The pod's only log line that mattered:
#
#     listen tcp 0.0.0.0:9100: bind: address already in use
#
# This exact collision was ALREADY documented in inventory/hosts.yml, in the
# comment excluding gitlab-1 ("GitLab Omnibus ships its own node_exporter ...
# so the Debian package can't bind 0.0.0.0:9100 and its unit dies on start").
# Same conflict, opposite winner. Nobody connected the two for 19 days.
#
# Proven before removing, not assumed: with the host unit stopped and the pod
# deleted to clear its 5-minute backoff, the pod reached 1/1 Running in 25s and
# `curl localhost:9100/metrics | grep -c node_systemd_unit_state` returned **52**
# on the H4. The control on n150-1 returned **0**, which is CORRECT — the
# collector is scoped to backup-.+\.(service|timer) and those units exist only on
# odroid-nas. Without that control the 52 would have meant nothing.
#
# `state: absent` rather than `stopped`: stopping is not enough, because the unit
# starts at boot and wins the race against the pod every time.
- name: Ensure cluster nodes do not run a host node_exporter
  hosts: k3s_server:k3s_agents
  become: true

  tasks:
    - name: Remove the Debian node_exporter package from cluster nodes
      ansible.builtin.package:
        name: prometheus-node-exporter
        state: absent
      when: ansible_os_family == 'Debian'
      register: _removed

    # Verify by what is LISTENING, not by what the package manager reported.
    # An absent package and a free port are different claims; only the second
    # one lets the DaemonSet pod start.
    - name: Check what owns port 9100
      ansible.builtin.shell: |
        set -o pipefail
        ss -lntp 2>/dev/null | grep ':9100 ' || true
      args:
        executable: /bin/bash
      register: _port9100
      changed_when: false
      check_mode: false

    - name: Report the holder of port 9100
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} port 9100:
          {{ _port9100.stdout | default('(nothing listening — the DaemonSet pod will bind on its next start)') }}

    # The pod is expected to hold 9100 on a healthy cluster node. Anything whose
    # command is NOT the containerised exporter means a host process has taken it
    # again and the pod will crashloop silently for as long as nobody looks.
    - name: Warn if a host process still holds 9100
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: a non-DaemonSet process holds 9100 —
          {{ _port9100.stdout }}. The kube-prometheus-stack pod cannot bind and
          will CrashLoopBackOff. See BACKLOG.md and the gitlab-1 note in
          inventory/hosts.yml.
      when:
        - _port9100.stdout | default('') | length > 0
        - _port9100.stdout is search('prometheus-node')
        - not ansible_check_mode

- name: Install and enable node_exporter on non-cluster hosts
  hosts: node_exporter
  become: true

  pre_tasks:
    # Debian only: minimal images (e.g. Armbian) may lack python3-apt
    - name: Bootstrap python3-apt (Debian hosts, required by apt module)
      ansible.builtin.raw: dpkg -s python3-apt &>/dev/null || apt-get install -y python3-apt
      changed_when: false
      when: ansible_os_family == 'Debian'

  tasks:
    - name: Install prometheus-node-exporter (Debian)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'
      register: deb_install

    - name: Install prometheus-node-exporter (Arch)
      community.general.pacman:
        name: prometheus-node-exporter
        state: present
        update_cache: true
      when: ansible_os_family == 'Archlinux'
      register: arch_install

    # Arch package service unit runs as User=prometheus-node-exporter which
    # doesn't exist on minimal installs — create it as a locked system account.
    # Arch package service unit runs as User=node_exporter / Group=node_exporter
    # which don't exist on minimal installs — create group first, then user.
    - name: Create node_exporter group (Arch)
      ansible.builtin.group:
        name: node_exporter
        system: true
      when: ansible_os_family == 'Archlinux'

    - name: Create node_exporter system user (Arch)
      ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false
        comment: Prometheus node exporter
      when: ansible_os_family == 'Archlinux'

    - name: Collect service facts
      ansible.builtin.service_facts:

    # `state: started`, NOT `restarted`.
    #
    # This read `state: restarted` until 2026-08-27, which bounced node_exporter
    # on all five non-cluster hosts on EVERY run — three consecutive real runs
    # each reported `changed` on rpi5, rpi4b, opi-zero2w-2, opi-zero2w-3 and
    # octopi-dns, and a fourth would have too.
    #
    # Two costs, both quiet. Each run punches a scrape gap into five hosts'
    # metrics — short enough that LabExternalHostDown's `for: 3m` never fires, so
    # nobody sees it. And it makes `changed` meaningless: a playbook that always
    # reports a change cannot tell you whether it changed anything, which is
    # precisely the signal BACKLOG §3.11 wants from a scheduled `--check`.
    #
    # `started` is idempotent. If a future change needs a restart, notify a
    # handler from the task that made the change, so the restart is caused by
    # something rather than by the clock.
    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
      when: "'prometheus-node-exporter.service' in ansible_facts.services"

    - name: Allow node_exporter port through ufw (Debian, if active)
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        src: 192.168.1.0/24
        comment: Prometheus node_exporter
      when:
        - ansible_os_family == 'Debian'
        - "'ufw.service' in ansible_facts.services or 'ufw' in ansible_facts.services"
      ignore_errors: true

# ---------------------------------------------------------------------------
# Hosts whose package manager can't be driven by Ansible modules (see the
# node_exporter_binary group comment in inventory/hosts.yml). Installs the
# upstream static binary — same metric names as the DaemonSet, so the
# lab-health dashboard panels work identically.
# ---------------------------------------------------------------------------
- name: Install node_exporter from upstream binary
  hosts: node_exporter_binary
  become: true
  vars:
    node_exporter_version: "1.12.1"
    node_exporter_arch: linux-armv7
    # Pin this. Get it from:
    #   https://github.com/prometheus/node_exporter/releases/download/v{{ version }}/sha256sums.txt
    # Leave empty to skip verification (not recommended).
    node_exporter_checksum: ""

  tasks:
    - name: Create node_exporter system group
      ansible.builtin.group:
        name: node_exporter
        system: true

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        comment: Prometheus node exporter

    - name: Check installed version
      ansible.builtin.command: /usr/local/bin/node_exporter --version
      register: ne_current
      changed_when: false
      failed_when: false
      # Read-only probe; the download/install guard reads ne_current. Same fix as
      # promtail.yml — without it, --check re-downloads on already-current hosts.
      check_mode: false

    - name: Download and unpack upstream release
      when: node_exporter_version not in (ne_current.stderr | default('')) + (ne_current.stdout | default(''))
      block:
        # Downloaded on the CONTROL node, not the target. xu3-1's source-built
        # Python 3.11 was compiled without OpenSSL (no libssl-dev at build time),
        # so any HTTPS fetch there dies with "name 'ssl' is not defined".
        # Pushing the tarball over the existing SSH connection sidesteps it.
        - name: Download tarball to control node
          ansible.builtin.get_url:
            url: >-
              https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz
            dest: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
            checksum: "{{ ('sha256:' + node_exporter_checksum) if node_exporter_checksum else omit }}"
            mode: "0644"
          delegate_to: localhost
          become: false
          run_once: true

        - name: Push and unpack binary into /usr/local/bin
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
            dest: /usr/local/bin
            remote_src: false
            extra_opts:
              - --strip-components=1
              - node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter
            owner: root
            group: root
            mode: "0755"
          notify: Restart node_exporter

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible — playbooks/node-exporter.yml
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted
        daemon_reload: true
