---
# Deploy prometheus-node-exporter on non-cluster Linux hosts.
#
# The k3s cluster is h4-core + n150-1/2 (servers) and opi5pro-1/2 (agents).
# ONLY those nodes get node_exporter via the kube-prometheus-stack DaemonSet.
# rpi5 (Vault), xu3-1 (build agent) and gitlab-1 (VM) are NOT cluster nodes —
# an earlier version of this header wrongly listed rpi5 and xu3-1 as cluster
# nodes, so they were left out of the `node_exporter` inventory group and had
# no exporter at all while Prometheus scraped them. Corrected 2026-07-26.
#
# Supported OS families:
#   Debian    — octopi-dns, rpi4b, rpi5, opi-zero2w-3, opi-zero2w-4           (apt)
#   Archlinux — opi-zero2w-1, opi-zero2w-2                                    (pacman)
#
# CORRECTED 2026-09-05: this listed gitlab-1 as a Debian target. IT IS NOT IN EITHER
# GROUP, deliberately, and the reason has been recorded in inventory/hosts.yml the
# whole time — one file away from the header claiming otherwise:
#
#   GitLab Omnibus ships its own node_exporter already bound to 127.0.0.1:9100, so
#   the Debian package cannot bind 0.0.0.0:9100 and its unit dies on start. The
#   bundled one is exposed instead, via node_exporter['listen_address'] in
#   /etc/gitlab/gitlab.rb.
#
# So ADDING gitlab-1 TO node_exporter WOULD BREAK A WORKING SCRAPE — it installs a
# package whose unit cannot start, on a host Prometheus is already scraping
# successfully (up{instance="192.168.1.50"} = 1, confirmed 2026-09-04).
#
# Consequence, so nobody goes looking for it: gitlab-1 never receives the textfile
# collector added below, because its exporter is not managed here. The collector is on
# seven hosts by design, not eight by omission.
#
# This header has now been wrong about group membership twice — see the opi-zero2w-4
# correction immediately below. `ansible node_exporter --list-hosts` is the
# measurement; this comment is a summary of it and drifts from it.
#
# CORRECTED 2026-08-27. This listed opi-zero2w-4 as Archlinux. It is not: on the
# first run after that board came back online, it took the Debian path —
# `Bootstrap python3-apt` and `Install prometheus-node-exporter (Debian)` both
# ran on it, and the Arch tasks skipped. `ansible_os_family` is the measurement;
# the comment was the assumption. Whether the board was reimaged or was never
# Arch is not recoverable from here.
#
# docs/HARDWARE.md does NOT repeat this error — it annotates an OS only for
# Zero 2W #3 ("Armbian Trixie") and is silent about #4. Checked, because the
# first draft of this comment asserted otherwise without looking.
#
# xu3-1 is handled by the second play below (upstream binary, not apt).
#
# Run:
#   ansible-playbook -i inventory/hosts.yml playbooks/node-exporter.yml
#
# ── Play 0: cluster nodes must NOT run a host node_exporter ──────────────────
#
# The header above has always SAID cluster nodes get the DaemonSet only. Nothing
# enforced it, and on 2026-08-27 the H4 was found running the Debian package
# anyway — almost certainly a MicroShift-era leftover that survived the k3s
# rebuild.
#
# The cost: `prometheus-node` (PID 986, started at boot) owned 0.0.0.0:9100, so
# the DaemonSet pod could never bind and had been in CrashLoopBackOff for
# **19 days** — 273 restarts, firing KubePodCrashLooping and
# KubeDaemonSetRolloutStuck the whole time. The pod's only log line that mattered:
#
#     listen tcp 0.0.0.0:9100: bind: address already in use
#
# This exact collision was ALREADY documented in inventory/hosts.yml, in the
# comment excluding gitlab-1 ("GitLab Omnibus ships its own node_exporter ...
# so the Debian package can't bind 0.0.0.0:9100 and its unit dies on start").
# Same conflict, opposite winner. Nobody connected the two for 19 days.
#
# Proven before removing, not assumed: with the host unit stopped and the pod
# deleted to clear its 5-minute backoff, the pod reached 1/1 Running in 25s and
# `curl localhost:9100/metrics | grep -c node_systemd_unit_state` returned **52**
# on the H4. The control on n150-1 returned **0**, which is CORRECT — the
# collector is scoped to backup-.+\.(service|timer) and those units exist only on
# odroid-nas. Without that control the 52 would have meant nothing.
#
# `state: absent` rather than `stopped`: stopping is not enough, because the unit
# starts at boot and wins the race against the pod every time.
- name: Ensure cluster nodes do not run a host node_exporter
  hosts: k3s_server:k3s_agents
  become: true

  tasks:
    - name: Remove the Debian node_exporter package from cluster nodes
      ansible.builtin.package:
        name: prometheus-node-exporter
        state: absent
      when: ansible_os_family == 'Debian'
      register: _removed

    # Verify by what is LISTENING, not by what the package manager reported.
    # An absent package and a free port are different claims; only the second
    # one lets the DaemonSet pod start.
    - name: Check what owns port 9100
      ansible.builtin.shell: |
        set -o pipefail
        ss -lntp 2>/dev/null | grep ':9100 ' || true
      args:
        executable: /bin/bash
      register: _port9100
      changed_when: false
      check_mode: false

    - name: Report the holder of port 9100
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} port 9100:
          {{ _port9100.stdout | default('(nothing listening — the DaemonSet pod will bind on its next start)') }}

    # The pod is expected to hold 9100 on a healthy cluster node. Anything whose
    # command is NOT the containerised exporter means a host process has taken it
    # again and the pod will crashloop silently for as long as nobody looks.
    - name: Warn if a host process still holds 9100
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: a non-DaemonSet process holds 9100 —
          {{ _port9100.stdout }}. The kube-prometheus-stack pod cannot bind and
          will CrashLoopBackOff. See BACKLOG.md and the gitlab-1 note in
          inventory/hosts.yml.
      when:
        - _port9100.stdout | default('') | length > 0
        - _port9100.stdout is search('prometheus-node')
        - not ansible_check_mode

    # ---- Textfile collector directory (BACKLOG §3.11) -----------------------
    # Added 2026-08-29, ahead of enabling --collector.textfile.directory on the
    # node-exporter DaemonSet. This MUST exist before that flag is turned on: a
    # missing directory makes node_exporter log a read error on every scrape, on
    # every node, forever — noise that trains the eye to ignore the exporter's
    # logs, which is how §3.15's 19-day crashloop stayed unexamined.
    #
    # Ordering is therefore deliberate and one-way: apply this playbook FIRST,
    # then merge the gitops change. Argo reconciles within ~30s of merge, so the
    # reverse order guarantees a window of errors.
    #
    # OWNERSHIP CORRECTED 2026-08-30. The first version of this task was root:root
    # 0755, with the comment "nothing unprivileged needs to write here". That was
    # an assumption, it was untested, and designing the §3.11 drift check disproved
    # it the same evening: the check must run as {{ ansible_user }} — it needs that
    # user's SSH keys, ansible.cfg and .vault_pass — so it cannot publish a metric
    # into a root-only directory.
    #
    # root-owned, group-writable by the ansible user, world-readable:
    #   node_exporter reads as UID 65534 in the pod  -> needs r-x on the dir
    #   drift check writes as {{ ansible_user }}     -> needs w via group
    #   root-run units may also write                -> owner
    #
    # Recorded rather than quietly amended, because the comment asserting a
    # requirement nobody had checked is the same shape as the rest of §3.11.
    - name: Create the node_exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: "{{ ansible_user }}"
        mode: "0775"

    # Read-only, so it must run under --check as well — otherwise a dry run
    # reports success having confirmed nothing, which is the §3.11 fault this
    # whole line of work exists to remove.
    - name: Confirm the textfile directory exists and is readable
      ansible.builtin.stat:
        path: /var/lib/node_exporter/textfile_collector
      register: _tfdir
      check_mode: false

    - name: Assert the textfile directory is present
      ansible.builtin.assert:
        that:
          - _tfdir.stat.exists
          - _tfdir.stat.isdir
        success_msg: "{{ inventory_hostname }}: textfile collector dir ready"
        fail_msg: >-
          {{ inventory_hostname }}: /var/lib/node_exporter/textfile_collector is
          missing. Do NOT enable --collector.textfile.directory until this exists
          on every node — see BACKLOG §3.11.
        quiet: true
      when: not ansible_check_mode

- name: Install and enable node_exporter on non-cluster hosts
  hosts: node_exporter
  become: true

  pre_tasks:
    # Debian only: minimal images (e.g. Armbian) may lack python3-apt
    - name: Bootstrap python3-apt (Debian hosts, required by apt module)
      ansible.builtin.raw: dpkg -s python3-apt &>/dev/null || apt-get install -y python3-apt
      changed_when: false
      when: ansible_os_family == 'Debian'

  tasks:
    - name: Install prometheus-node-exporter (Debian)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'
      register: deb_install

    # update_cache split out and marked changed_when: false.
    #
    # community.general.pacman reports `changed` for the CACHE REFRESH itself,
    # not just for installing something. With update_cache on the install task,
    # opi-zero2w-1 and opi-zero2w-2 reported `changed` on runs where the package
    # was already present and nothing happened — the same useless-but-truthful
    # `changed` as the `state: restarted` defect fixed above on 2026-08-27.
    #
    # A refreshed package cache is not a change to the host's configuration, so
    # it should not colour the run's changed count. Keep the two separate and the
    # install task's `changed` means the package was actually installed.
    - name: Refresh the pacman cache (Arch)
      community.general.pacman:
        update_cache: true
      when: ansible_os_family == 'Archlinux'
      changed_when: false

    - name: Install prometheus-node-exporter (Arch)
      community.general.pacman:
        name: prometheus-node-exporter
        state: present
      when: ansible_os_family == 'Archlinux'
      register: arch_install

    # Arch package service unit runs as User=prometheus-node-exporter which
    # doesn't exist on minimal installs — create it as a locked system account.
    # Arch package service unit runs as User=node_exporter / Group=node_exporter
    # which don't exist on minimal installs — create group first, then user.
    - name: Create node_exporter group (Arch)
      ansible.builtin.group:
        name: node_exporter
        system: true
      when: ansible_os_family == 'Archlinux'

    - name: Create node_exporter system user (Arch)
      ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false
        comment: Prometheus node exporter
      when: ansible_os_family == 'Archlinux'

    # ---- textfile collector — BACKLOG §3.17 ---------------------------------
    # Lets scripts on these hosts publish metrics. First consumer is
    # playbooks/wifi-watchdog.yml on the Zero 2W pool, which writes
    # wifi_watchdog.prom and had nowhere for Prometheus to read it from: the file
    # existed on disk and no exporter was looking at the directory.
    #
    # DIRECTORY FIRST, FLAG SECOND, AND THE ORDER IS NOT NEGOTIABLE. A textfile
    # collector aimed at a missing directory logs a read error on EVERY scrape, on
    # every host. Permanent low-grade exporter noise is how §3.15's 19-day
    # crashloop went unexamined. Play 1 above does this for the cluster nodes.
    - name: Create the node_exporter textfile collector directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure the node_exporter drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # THE UNIT NAME IS UNIFORM ACROSS BOTH DISTROS; THE ARGUMENT PLUMBING IS NOT.
    # Measured 2026-09-04 on the Zero 2W pool: unit=prometheus-node-exporter on all
    # four, but /etc/default/prometheus-node-exporter exists only on the Debian
    # boards. Rather than branch on that — and be wrong again the next time a
    # package changes, as this file's own 2026-08-27 correction did about which
    # boards were Arch — take the ExecStart the unit ACTUALLY has and re-issue it
    # with the flag appended. Works on both, and on whatever comes next.
    - name: Read the current node_exporter ExecStart
      ansible.builtin.shell: |
        set -o pipefail
        systemctl show -p ExecStart --value prometheus-node-exporter 2>/dev/null \
          | sed -n 's/.*argv\[\]=\([^;]*\).*/\1/p' | head -1
      args:
        executable: /bin/bash
      register: ne_execstart
      changed_when: false
      failed_when: false
      check_mode: false

    # Guarded on the parse having produced something that looks like a command.
    # An empty or malformed capture written into `ExecStart=` would leave the unit
    # unstartable, and the failure would arrive at the next restart rather than
    # here — the worst possible distance between cause and symptom.
    - name: Enable the textfile collector via a systemd drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-textfile.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/node-exporter.yml) — BACKLOG §3.17.
          # ExecStart is reset and re-issued because systemd appends otherwise; the
          # base command below was READ FROM THE RUNNING UNIT rather than assumed,
          # so any $ARGS/EnvironmentFile indirection the package uses is preserved.
          [Service]
          ExecStart=
          ExecStart={{ ne_execstart.stdout | trim }} --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      register: textfile_dropin
      when:
        - ne_execstart.stdout is defined
        - (ne_execstart.stdout | trim | length) > 0
        - "'/' in ne_execstart.stdout"
        - "'collector.textfile.directory' not in ne_execstart.stdout"

    # Restart CAUSED BY the drop-in changing, not by the clock — the lesson recorded
    # below about `state: restarted` bouncing five hosts on every run.
    - name: Restart node_exporter to pick up the textfile collector
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        daemon_reload: true
        state: restarted
      when:
        - not ansible_check_mode
        - textfile_dropin is defined
        - textfile_dropin is changed

    - name: Verify the collector is actually enabled and serving
      ansible.builtin.shell: |
        set -o pipefail
        echo "flag=$(systemctl show -p ExecStart --value prometheus-node-exporter 2>/dev/null | grep -c 'collector.textfile.directory')"
        m=$(curl -s --max-time 5 http://localhost:9100/metrics 2>/dev/null)
        echo "node_textfile_series=$(printf '%s' "$m" | grep -c '^node_textfile')"
        echo "wifi_watchdog_series=$(printf '%s' "$m" | grep -c '^lab_wifi_watchdog')"
      args:
        executable: /bin/bash
      register: textfile_verify
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    # Asserts on the FLAG, not on a metric name. `node_textfile_scrape_error` is
    # the expected indicator but its exact spelling was not measured on these
    # exporter versions, and an assert on a metric that does not exist fails
    # identically to one on a collector that is not running. The flag in ExecStart
    # cannot be ambiguous. The series counts are reported so the real names can be
    # read off a working host and the check tightened later.
    - name: Confirm the textfile collector flag is live
      ansible.builtin.assert:
        that:
          - textfile_verify.stdout is search('flag=1')
        fail_msg: >-
          {{ inventory_hostname }}: textfile collector not enabled —
          {{ textfile_verify.stdout | default('no output') | trim }}.
          Check the drop-in at
          /etc/systemd/system/prometheus-node-exporter.service.d/10-textfile.conf
          and that the ExecStart it captured is a valid command.
        success_msg: >-
          {{ inventory_hostname }}: {{ textfile_verify.stdout_lines | default([]) | join(' | ') }}
      when:
        - not ansible_check_mode
        - textfile_verify.stdout is defined

    - name: Collect service facts
      ansible.builtin.service_facts:

    # `state: started`, NOT `restarted`.
    #
    # This read `state: restarted` until 2026-08-27, which bounced node_exporter
    # on all five non-cluster hosts on EVERY run — three consecutive real runs
    # each reported `changed` on rpi5, rpi4b, opi-zero2w-2, opi-zero2w-3 and
    # octopi-dns, and a fourth would have too.
    #
    # Two costs, both quiet. Each run punches a scrape gap into five hosts'
    # metrics — short enough that LabExternalHostDown's `for: 3m` never fires, so
    # nobody sees it. And it makes `changed` meaningless: a playbook that always
    # reports a change cannot tell you whether it changed anything, which is
    # precisely the signal BACKLOG §3.11 wants from a scheduled `--check`.
    #
    # `started` is idempotent. If a future change needs a restart, notify a
    # handler from the task that made the change, so the restart is caused by
    # something rather than by the clock.
    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
      when: "'prometheus-node-exporter.service' in ansible_facts.services"

    - name: Allow node_exporter port through ufw (Debian, if active)
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        src: 192.168.1.0/24
        comment: Prometheus node_exporter
      when:
        - ansible_os_family == 'Debian'
        - "'ufw.service' in ansible_facts.services or 'ufw' in ansible_facts.services"
      ignore_errors: true

# ---------------------------------------------------------------------------
# Hosts whose package manager can't be driven by Ansible modules (see the
# node_exporter_binary group comment in inventory/hosts.yml). Installs the
# upstream static binary — same metric names as the DaemonSet, so the
# lab-health dashboard panels work identically.
# ---------------------------------------------------------------------------
- name: Install node_exporter from upstream binary
  hosts: node_exporter_binary
  become: true
  vars:
    node_exporter_version: "1.12.1"
    node_exporter_arch: linux-armv7
    # Pin this. Get it from:
    #   https://github.com/prometheus/node_exporter/releases/download/v{{ version }}/sha256sums.txt
    # Leave empty to skip verification (not recommended).
    node_exporter_checksum: ""

  tasks:
    - name: Create node_exporter system group
      ansible.builtin.group:
        name: node_exporter
        system: true

    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        group: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        comment: Prometheus node exporter

    - name: Check installed version
      ansible.builtin.command: /usr/local/bin/node_exporter --version
      register: ne_current
      changed_when: false
      failed_when: false
      # Read-only probe; the download/install guard reads ne_current. Same fix as
      # promtail.yml — without it, --check re-downloads on already-current hosts.
      check_mode: false

    - name: Download and unpack upstream release
      when: node_exporter_version not in (ne_current.stderr | default('')) + (ne_current.stdout | default(''))
      block:
        # Downloaded on the CONTROL node, not the target. xu3-1's source-built
        # Python 3.11 was compiled without OpenSSL (no libssl-dev at build time),
        # so any HTTPS fetch there dies with "name 'ssl' is not defined".
        # Pushing the tarball over the existing SSH connection sidesteps it.
        - name: Download tarball to control node
          ansible.builtin.get_url:
            url: >-
              https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz
            dest: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
            checksum: "{{ ('sha256:' + node_exporter_checksum) if node_exporter_checksum else omit }}"
            mode: "0644"
          delegate_to: localhost
          become: false
          run_once: true

        - name: Push and unpack binary into /usr/local/bin
          ansible.builtin.unarchive:
            src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
            dest: /usr/local/bin
            remote_src: false
            extra_opts:
              - --strip-components=1
              - node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter
            owner: root
            group: root
            mode: "0755"
          notify: Restart node_exporter

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible — playbooks/node-exporter.yml
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted
        daemon_reload: true
