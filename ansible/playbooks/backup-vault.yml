---
# Daily Vault raft snapshot: rpi5 → H4 cold tier (/mnt/cold-8t/vault-snapshots/).
#
# Prerequisites (one-time, manual on rpi5):
#   vault policy write vault-snapshot (path sys/storage/raft/snapshot, read)
#   vault token create -orphan -display-name=vault-backup -policy=vault-snapshot \
#     -period=768h -field=token | sudo tee /etc/vault.d/backup-token >/dev/null
#   sudo chmod 600 /etc/vault.d/backup-token
#
# THE PREVIOUS VERSION OF THOSE THREE LINES CAUSED A FIFTEEN-DAY BACKUP OUTAGE.
# It read:
#
#   vault token create -display-name=vault-backup -period=87600h -policy=vault-snapshot
#   echo "<token>" | sudo tee /etc/vault.d/backup-token && sudo chmod 600 …
#
# Three defects, each sufficient on its own. See BACKLOG §1.14.
#
#   1. NO `-orphan`. The token was a CHILD of whatever token created it — an admin
#      token. Vault revokes children when the parent expires or is revoked, and
#      `docs/OPS.md` plus §1.11 record that `token-admin` is *deliberately* allowed
#      to lapse. So this backup was built to die on the admin token's ~30-day
#      cycle. Last good snapshot 2026-09-08; token-admin's 720h TTL from ~08-09
#      expired the same day.
#
#   2. `-period=87600h` WAS NEVER HONOURED. Vault caps period at the effective
#      max_ttl — 768h here — and warns on creation:
#        period of "87600h" exceeded the effective max_ttl of "768h"; period
#        value is capped accordingly
#      A comment promising ten years described a 32-day token. Ask for 768h so the
#      number in the repo is the number Vault uses.
#
#   3. NOTHING RENEWED IT. A periodic token lives one period at a time. The
#      snapshot script now runs `vault token renew -self` before each snapshot;
#      see the comment there.
#
# `-field=token | sudo tee … >/dev/null` is also deliberate: the earlier recipe
# printed the token to the terminal, and on 2026-09-23 a live one was pasted into
# a transcript while diagnosing exactly this failure. That is §2.13's second
# occurrence. Never print a token you are about to write to a file.
#
- name: Configure Vault raft snapshot backups
  hosts: vault
  become: true
  vars:
    vault_addr: "http://127.0.0.1:8200"
    vault_backup_token_file: /etc/vault.d/backup-token
    h4_host: "192.168.1.160"
    h4_user: "swares"
    snapshot_dest_path: "/mnt/cold-8t/vault-snapshots"
    snapshot_retain_days: 30
    ssh_key_path: /root/.ssh/vault-backup

  tasks:
    - name: Ensure snapshot destination directory exists on H4
      delegate_to: h4
      ansible.builtin.file:
        path: "{{ snapshot_dest_path }}"
        state: directory
        mode: "0750"
        owner: swares
        group: swares

    - name: Generate SSH keypair for vault-backup on rpi5
      ansible.builtin.shell:
        cmd: ssh-keygen -t ed25519 -f {{ ssh_key_path }} -N '' -C vault-backup@rpi5
        creates: "{{ ssh_key_path }}"

    - name: Read vault-backup public key
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: vault_backup_pubkey

    - name: Authorize vault-backup key on H4
      delegate_to: h4
      ansible.posix.authorized_key:
        user: "{{ h4_user }}"
        key: "{{ vault_backup_pubkey.content | b64decode | trim }}"
        comment: vault-backup@rpi5

    - name: Deploy vault snapshot script
      ansible.builtin.copy:
        dest: /usr/local/bin/vault-snapshot.sh
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail
          export VAULT_ADDR="{{ vault_addr }}"
          export VAULT_TOKEN="$(cat {{ vault_backup_token_file }})"

          # RENEW BEFORE USE — added 2026-09-23 after fifteen days with no snapshot.
          #
          # This token is PERIODIC, and a periodic token does not live forever: it
          # lives for one period and must be renewed inside it. Nothing renewed
          # this one. The header of this playbook said `-period=87600h` (ten
          # years), but Vault caps period at the effective max_ttl, which here is
          # **768h**, and says so on creation:
          #
          #   period of "87600h" exceeded the effective max_ttl of "768h";
          #   period value is capped accordingly
          #
          # So the documented ten-year token was a 32-day token all along, and the
          # job that depends on it never asked for more time. Renewing on every run
          # makes the period roll forward daily, which is the whole point of a
          # periodic token.
          #
          # NOT prefixed with `-` and not `|| true`: if the renew fails, the token
          # is already dead or dying and the snapshot is the thing that matters.
          # Failing here fails the unit, which trips LabBackupUnitFailed — the alert
          # that did fire for fifteen days while nobody was able to read it.
          vault token renew -self >/dev/null

          SNAP_DIR=/tmp/vault-snapshots
          mkdir -p "$SNAP_DIR"
          SNAP="$SNAP_DIR/vault-snap-$(date +%Y%m%d-%H%M%S).snap"
          vault operator raft snapshot save "$SNAP"
          rsync -az -e "ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=accept-new" \
            "$SNAP" "{{ h4_user }}@{{ h4_host }}:{{ snapshot_dest_path }}/"
          rm -f "$SNAP"
          ssh -i "{{ ssh_key_path }}" "{{ h4_user }}@{{ h4_host }}" \
            "find {{ snapshot_dest_path }} -name 'vault-snap-*.snap' -mtime +{{ snapshot_retain_days }} -delete"

    - name: Deploy backup-vault systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-vault.service
        mode: "0644"
        content: |
          [Unit]
          Description=HashiCorp Vault raft snapshot to H4 cold tier
          After=network.target vault.service
          Requires=vault.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/vault-snapshot.sh
          StandardOutput=journal
          StandardError=journal

    - name: Deploy backup-vault systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-vault.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily HashiCorp Vault raft snapshot

          [Timer]
          OnCalendar=*-*-* 02:30:00
          RandomizedDelaySec=300
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

      # CHECK-MODE CASCADE GUARD — 2026-09-02. This enables a unit whose file is
      # written earlier in this same play. Under --check that write is simulated, so
      # on a host that does not already have the unit systemd reports "Could not find
      # the requested service" and the play fails. It passes today only because the
      # unit already exists everywhere it runs — so this would surface on a REBUILD or
      # a new host, which is the worst time to discover it.
      #
      # Found by auditing for the pattern after introducing a fresh instance of it in
      # chrony-onoffline.timer. Five plays had it.
    - name: Enable and start vault backup timer
      ansible.builtin.systemd:
        name: backup-vault.timer
        enabled: true
        state: started
      when: not ansible_check_mode
