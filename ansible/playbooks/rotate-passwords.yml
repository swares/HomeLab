---
# Rotate the lab user (swares) password on all managed Linux hosts.
#
# Two-phase design:
#   Phase 1 — Bootstrap (HashiCorp Vault not yet up):
#     Requires lab_user_password_hash to be set in Ansible Vault:
#       cd ansible/
#       python3 -c "import crypt,getpass; print(crypt.crypt(getpass.getpass(), \
#         crypt.mksalt(crypt.METHOD_SHA512)))" | \
#         ansible-vault encrypt_string --vault-password-file .vault_pass \
#         --encrypt-vault-id default --stdin-name lab_user_password_hash \
#         >> inventory/group_vars/all/secrets.yml
#
#   Phase 2 — Post-Vault (HashiCorp Vault is up):
#     Fetches plaintext from secret/lab/hosts.swares_password, hashes it,
#     and applies. Requires VAULT_TOKEN env var on the control node.
#     Falls back to the Ansible Vault hash if Vault is UNREACHABLE.
#
#     Tightened 2026-09-19. "Unreachable" is the only fallback case. A reachable
#     Vault that REFUSES the read — expired token, missing policy — is now fatal,
#     because the fallback target is a cache refreshed by hand
#     (scripts/sync-vault-to-ansible-vault.sh) and may predate the current
#     password. Before this, an expired token rotated every Linux host to that
#     cache and announced it only in a debug line. Override deliberately with
#     -e allow_ansible_vault_fallback=true.
#
#     Whenever Vault IS readable, this play now also verifies that the cache still
#     matches it, since that cache is the break-glass credential in the offline
#     envelope. A stale envelope is not a problem until the day it is the only way
#     in, which is the worst day to find out. Override with
#     -e allow_stale_break_glass_cache=true.
#
# Run:
#   ansible-playbook -i inventory/hosts.yml playbooks/rotate-passwords.yml \
#     --vault-password-file .vault_pass
#
# Windows hosts are excluded — managed separately via WinRM.

- name: Resolve password source
  hosts: localhost
  gather_facts: false

  vars:
    # The Ansible Vault hash is a CACHE of Vault's plaintext, derived by
    # scripts/sync-vault-to-ansible-vault.sh, and it is the break-glass credential
    # in the offline envelope (scripts/print-offline-envelope.sh item 6/7,
    # docs/BREAK-GLASS.md). Falling back to it when Vault is UNREACHABLE is the
    # documented design — see the Phase 2 note at the top of this file.
    #
    # Falling back when Vault is REACHABLE and refuses the read is not. That is an
    # expired token or a missing policy, and silently substituting a cache of
    # unknown freshness is how the fleet ends up on a password nobody chose. This
    # flag makes that path something you ask for rather than something that happens
    # to you.
    allow_ansible_vault_fallback: false

    # A stale cache is not an outage today — it is an outage during the next one,
    # when the envelope is the only way in. Fatal by default so it is fixed while
    # someone is looking.
    allow_stale_break_glass_cache: false

  tasks:
    # `check_mode: false` on both read-only tasks below, added 2026-09-19, so that
    # --check resolves the password source for real instead of pretending to.
    #
    # Without it the chain collapsed: `uri` skips under --check, so
    # vault_health.status is undefined, so the fetch skips, so both asserts skip
    # and the fallback runs. A dry run exercised none of the logic it exists to
    # verify, and reported "Password source: Ansible Vault (fallback)" on a lab
    # where Vault was up — the dry run's answer was an artefact of the dry run.
    #
    # Safe because neither task writes: an HTTP GET on sys/health and a KV read.
    # The rotation itself lives in the SECOND play, whose `user` tasks still honour
    # check mode, so `--check` now resolves and verifies without touching a single
    # host's password. That is what makes it the right way to test this play.
    #
    # CLAUDE.md, again: a dry run that prints no verification has verified nothing.
    - name: Check if HashiCorp Vault is reachable
      ansible.builtin.uri:
        url: "http://192.168.1.128:8200/v1/sys/health"
        status_code: [200, 429, 472, 473, 501, 503]
        timeout: 5
      register: vault_health
      failed_when: false
      check_mode: false

    - name: Fetch password plaintext from HashiCorp Vault
      community.hashi_vault.vault_kv2_get:
        url: "http://192.168.1.128:8200"
        path: "lab/hosts"
        token: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_hosts
      when:
        - vault_health.status is defined
        - vault_health.status in [200, 429]
        - lookup('env', 'VAULT_TOKEN') != ''
      no_log: true
      check_mode: false   # read-only KV read; see the note on the health check above
      # `failed_when: false` is KEPT deliberately. Removing it does make an auth
      # failure fatal, but the failure then comes from a no_log task and prints
      # "censored due to no_log" — path-missing, permission-denied and expired
      # token all identical. Keeping it lets the assert below name the cause.
      failed_when: false

    # Note this cannot test `vault_hosts is failed`: `failed_when: false` forces
    # that False whatever happened. The signal that the read actually worked is
    # the presence of `.secret`, which is also what the hash task consumes.
    - name: A reachable Vault must not have refused the read
      ansible.builtin.assert:
        that:
          - >-
            vault_hosts is skipped
            or vault_hosts.secret is defined
            or allow_ansible_vault_fallback | bool
        fail_msg: >-
          Vault is reachable but reading secret/lab/hosts produced no secret —
          almost certainly an expired or revoked VAULT_TOKEN, or a policy without
          read on that path. NOT falling back to the Ansible Vault hash: it is a
          cache refreshed by hand (scripts/sync-vault-to-ansible-vault.sh) and may
          predate the current password, so using it here would rotate every Linux
          host to a password of unknown provenance and report success.
          Fix the token, or pass -e allow_ansible_vault_fallback=true to use the
          cache deliberately.
        quiet: true

    # Proves the break-glass cache still matches Vault, while Vault is up to ask.
    # The two are hashed with different salts and rounds — password_hash('sha512')
    # below salts randomly, sync-vault-to-ansible-vault.sh uses rounds=5000 — so
    # the hashes CANNOT be compared to each other. A hash can still be verified
    # against a plaintext, because the salt is carried inside it: re-hash the
    # plaintext using the stored hash's own salt and the result is identical iff
    # the password matches.
    #
    # `$6$SALT$HASH` splits to ['', '6', SALT, HASH] — four parts. passlib omits
    # `rounds=` when it equals the default 5000, which is what that script uses, so
    # four is the expected shape; a five-part hash means non-default rounds and the
    # salt index would differ, hence the length check rather than a blind [2].
    #
    # quiet + no no_log on purpose: a failing assert prints the EXPRESSION and the
    # fail_msg, never the variables' values, so this stays diagnosable without
    # leaking either the password or the hash.
    - name: The break-glass cache must still match Vault
      ansible.builtin.assert:
        that:
          - lab_user_password_hash.split('$') | length == 4
          - >-
            vault_hosts.secret.swares_password
            | password_hash('sha512', lab_user_password_hash.split('$')[2])
            == lab_user_password_hash
        fail_msg: >-
          lab_user_password_hash does NOT match secret/lab/hosts:swares_password.
          The offline break-glass envelope therefore carries a password that will
          not log you in — discovered here rather than during the outage it exists
          for. Refresh it with scripts/sync-vault-to-ansible-vault.sh and re-run,
          or pass -e allow_stale_break_glass_cache=true to proceed anyway.
        quiet: true
      when:
        - not allow_stale_break_glass_cache | bool
        - vault_hosts is not skipped
        - vault_hosts.secret is defined
        - vault_hosts.secret.swares_password is defined
        - lab_user_password_hash is defined

    - name: Hash password from HashiCorp Vault
      ansible.builtin.set_fact:
        resolved_password_hash: "{{ vault_hosts.secret.swares_password | password_hash('sha512') }}"
      when:
        - vault_hosts is not skipped
        - vault_hosts.secret is defined
        - vault_hosts.secret.swares_password is defined
      no_log: true

    - name: Fall back to Ansible Vault hash
      ansible.builtin.set_fact:
        resolved_password_hash: "{{ lab_user_password_hash }}"
      when: resolved_password_hash is not defined
      no_log: true

    - name: Confirm password source
      ansible.builtin.debug:
        msg: >-
          Password source:
          {{ 'HashiCorp Vault' if (vault_hosts is not skipped and vault_hosts.secret is defined)
             else 'Ansible Vault (fallback)' }}

- name: Rotate lab user password (Linux hosts)
  hosts: all:!x86_nodes:!embedded
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify resolved_password_hash is set
      ansible.builtin.assert:
        that: hostvars['localhost']['resolved_password_hash'] is defined
        fail_msg: >
          resolved_password_hash could not be resolved from HashiCorp Vault or Ansible Vault.
          Ensure either VAULT_TOKEN is set and Vault is reachable, or
          lab_user_password_hash is set in Ansible Vault secrets.yml.

  tasks:
    - name: Set password for {{ ansible_user }}
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        password: "{{ hostvars['localhost']['resolved_password_hash'] | trim }}"
        update_password: always
      no_log: true

    - name: Lock root account (disable direct root login)
      ansible.builtin.user:
        name: root
        password: "!"
        update_password: always
      no_log: true

    - name: Ensure SSH password authentication is disabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: restart sshd

    - name: Ensure PubkeyAuthentication is enabled
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        state: present
      notify: restart sshd

  handlers:
    - name: restart sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted
