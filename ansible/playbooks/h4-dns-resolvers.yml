---
# Give the H4 a deterministic, three-server resolver list.
#
# THIS PLAYBOOK DOES NOT APPLY THE CHANGE. It writes a netplan override and stops.
# Applying is a manual `netplan try` — see RUN below and BACKLOG.md §4.12.
#
# THE PROBLEM
#
# The H4 has two links, both +DefaultRoute, each with its own DHCP-supplied DNS list
# (resolvectl status, 2026-08-21):
#
#   Link 2 (enp1s0)  DNS: 192.168.1.148 192.168.1.116
#   Link 3 (enp2s0)  DNS: 192.168.1.152 192.168.1.184 192.168.1.148 192.168.1.116
#
# Four distinct servers across the union. The kubelet caps a pod's resolv.conf at three
# (a glibc limit) and reports:
#
#   DNSConfigForming: Nameserver limits were exceeded, some nameservers have been
#   omitted, the applied nameserver line is: 192.168.1.148 192.168.1.116 192.168.1.152
#
# Two of those three are the SAME MACHINE: .148 and .152 are both octopi, an RPi 3B,
# and docs/HARDWARE.md:22 marks .152 "(avoid)". So the H4 — the NAS, a k3s server, the
# node whose loss is least survivable — believes it has three-way DNS redundancy and
# has two-way. Losing octopi drops two of its three resolvers at once.
#
# THE FIX
#
# Stop taking DNS from DHCP on both links and declare the intended three explicitly:
#
#   192.168.1.148  octopi   Pi-hole primary
#   192.168.1.116  rpi4b    Pi-hole secondary
#   192.168.1.184  opi-zero2w-1  dnsmasq fallback
#
# Two Pi-holes then one plain dnsmasq, matching what README's fleet table implies.
# Exactly three, so nothing is truncated and the omission is no longer arbitrary.
#
# WHY A SEPARATE FILE AND NOT AN EDIT
#
# /etc/netplan/50-cloud-init.yaml is generated by cloud-init and can be regenerated,
# taking any hand edit with it. Netplan merges files in filename order and later wins
# for the same key, so a 99- file overrides it durably without fighting cloud-init.
#
# RUN
#   cd ansible                    # ansible.cfg only applies from here — see §4.1c
#   ansible-playbook -i inventory/hosts.yml playbooks/h4-dns-resolvers.yml --check --diff
#   ansible-playbook -i inventory/hosts.yml playbooks/h4-dns-resolvers.yml
#
# THEN, BY HAND ON THE H4:
#   sudo netplan try
#
# `netplan try` applies the config and REVERTS AUTOMATICALLY after 120 seconds unless
# you confirm at the prompt. `netplan apply` does not. On a box you are connected to
# over the network, changing resolvers with `apply` and getting it wrong means driving
# to it. Use `try`. If DNS breaks, press nothing and wait — it comes back.
#
# VERIFY BY CONTENT, NOT BY EXIT CODE:
#   resolvectl status | grep -A2 'Link.*enp'      -> three servers total, no .152
#   kubectl get events -A --field-selector reason=DNSConfigForming
#                                                 -> no NEW entries for odroid-nas
# The second check is only possible because events are now retained (BACKLOG §3.9).
#
# ROLLBACK
#   sudo rm /etc/netplan/99-lab-dns.yaml && sudo netplan try
- name: H4 — deterministic resolver list
  hosts: h4-core
  become: true

  vars:
    # Order matters: systemd-resolved prefers the first responsive server.
    # Two Pi-holes before the plain dnsmasq fallback, so failing over past the
    # primary does not silently drop ad/telemetry filtering.
    h4_nameservers:
      - 192.168.1.148    # octopi        — Pi-hole primary
      - 192.168.1.116    # rpi4b         — Pi-hole secondary
      - 192.168.1.184    # opi-zero2w-1  — dnsmasq fallback
    h4_search: lab.home.arpa

    # Both links must stop taking DNS from DHCP...
    h4_links:
      - enp1s0
      - enp2s0

    # ...but ONLY ONE may carry the resolver list.
    #
    # systemd-resolved aggregates per-link DNS into /run/systemd/resolve/resolv.conf
    # WITHOUT DEDUPLICATING ACROSS LINKS. Putting the same three servers on both links
    # produced six entries and resolved said so in the file itself:
    #
    #     nameserver 192.168.1.148
    #     nameserver 192.168.1.116
    #     nameserver 192.168.1.184
    #     # Too many DNS servers configured, the following entries may be ignored.
    #     nameserver 192.168.1.148
    #     nameserver 192.168.1.116
    #     nameserver 192.168.1.184
    #
    # The kubelet reads that file, counts six, keeps three and warns — which is why
    # DNSConfigForming kept firing on odroid-nas at 16:02 with the *correct* three in
    # its applied line. Right servers, wrong count.
    #
    # enp2s0 is the primary: it carries 192.168.1.160 and the kube-vip VIPs .200/.201.
    #
    # THIS VARIABLE NOW GOVERNS ROUTING AS WELL AS DNS, deliberately. The resolver link
    # and the preferred-route link must be the same link; two independent knobs would
    # eventually disagree, and the disagreement would be invisible.
    h4_dns_link: enp2s0

    # ---- route metric — BACKLOG §2.9, added 2026-09-06 -----------------------
    # Both interfaces are on the SAME /24 and both take DHCP, so both installed a
    # default route at metric 100:
    #
    #     default via 192.168.1.1 dev enp1s0 proto dhcp src 192.168.1.156 metric 100
    #     default via 192.168.1.1 dev enp2s0 proto dhcp src 192.168.1.160 metric 100
    #
    # Equal metric means the kernel picks one and nothing pins the choice. It had
    # picked enp1s0, so the H4 was sourcing LAN traffic from **192.168.1.156** — an
    # address referenced nowhere in this repo. Found in Vault audit logs (§2.6), where
    # the H4's own requests arrived from an address no document knew about.
    #
    # WHY THIS MATTERS BEYOND TIDINESS. §2.9's firewall allowlist would have been built
    # from the repo, which says the H4 is .160. It would have worked — until a reboot
    # flipped the source address and locked out the machine that runs every playbook,
    # including the one needed to undo the rule. A failure arriving hours or weeks
    # after the change, looking unrelated to it.
    #
    # A higher metric loses. 200 on the secondary leaves enp2s0's 100 winning, and does
    # NOT remove .156 or take the link down — it only decides which route is preferred.
    # Nothing is bound to .156 any more in any case: the unconfigured dnsmasq that held
    # it was disabled in §2.14, found during this same investigation.
    h4_secondary_route_metric: 200

  tasks:
    - name: Confirm the expected links exist before touching anything
      ansible.builtin.command: "ip -o link show {{ item }}"
      loop: "{{ h4_links }}"
      register: _links
      changed_when: false
      check_mode: false

    # `resolvectl dns` is one line per link and omits links with no servers, unlike
    # `resolvectl status`, which on this host prints 40 veth entries and buries the
    # two lines that matter.
    - name: Record the resolver list as it stands now
      ansible.builtin.command: resolvectl dns
      register: _resolv_before
      changed_when: false
      check_mode: false

    - name: Show the current resolver list
      ansible.builtin.debug:
        msg: "{{ _resolv_before.stdout_lines | reject('search', ':\\s*$') | list }}"

    # ---- Remove .152 at its source -------------------------------------------
    #
    # NETPLAN MERGES LISTS ACROSS FILES; IT DOES NOT REPLACE THEM. Proven on
    # 2026-08-21 with `netplan get ethernets.enp2s0`, which returned the UNION of
    # cloud-init's [.152, .184] and this playbook's [.148, .116, .184]:
    #
    #     addresses: [192.168.1.152, 192.168.1.184, 192.168.1.148, 192.168.1.116]
    #
    # So a 99- override can add servers but can never remove one. `.152` has to be
    # deleted from /etc/netplan/50-cloud-init.yaml itself, which cloud-init owns and
    # can regenerate — hence disabling cloud-init's network config first.
    #
    # enp1s0 took the override cleanly because its DNS genuinely came from DHCP and
    # `use-dns: false` suppressed it. enp2s0's was statically declared, so nothing
    # about DHCP applied to it. Two links, two different mechanisms, one wrong
    # assumption.
    #
    # HANDLE enp2s0 WITH CARE: it carries 192.168.1.160 AND the kube-vip VIPs
    # 192.168.1.200 (control plane) and 192.168.1.201 (Traefik). Losing it drops the
    # cluster API and every ingress simultaneously.
    - name: Stop cloud-init from regenerating the network config
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/h4-dns-resolvers.yml).
          # Without this, cloud-init rewrites /etc/netplan/50-cloud-init.yaml on boot
          # and restores the nameservers block removed below.
          network: {config: disabled}

    # ---- the pristine backup -------------------------------------------------
    # REWRITTEN 2026-08-30, BACKLOG §3.11. This task previously wrote to
    #
    #     dest: /etc/netplan/50-cloud-init.yaml.bak-{{ ansible_date_time.date }}
    #
    # and carried `force: false` with the comment "never clobber an existing backup".
    # The intent was right and the implementation guaranteed the opposite of
    # idempotency: the DESTINATION PATH CHANGES EVERY DAY, so there is never an
    # existing backup to protect, the task reports `changed` on every run forever, and
    # a play run daily would accumulate one file per day. It was the sole reason
    # lab_ansible_drift{playbook="h4-dns-resolvers"} sat permanently at 1 — the
    # resolver tasks below have been reporting `ok` throughout. The drift was a
    # calendar, not a DNS fault.
    #
    # THE SUBTLER BUG, which is why this is not simply a filename change:
    # this task runs AFTER earlier runs have already rewritten 50-cloud-init.yaml, so
    # every dated backup except the FIRST captures the already-modified file. Only the
    # earliest is a real backup. Measured on h4-core 2026-08-30:
    #
    #     50-cloud-init.yaml.bak-2026-08-21   164 bytes, mtime Jun 24 — HAS nameservers
    #     50-cloud-init.yaml                  568 bytes            — modified
    #
    # Switching to a fixed name naively would have captured the 568-byte modified file
    # as ".orig" and then `force: false` would have protected THAT forever, quietly
    # destroying the only pristine copy the lab has of this file.
    #
    # So the source is chosen at run time: promote the OLDEST existing dated backup if
    # one exists (that is the pristine one), otherwise — on a rebuilt host, where the
    # live file has not been touched yet — take the live file. `force: false` then
    # means this is written exactly once, ever.
    #
    # The legacy dated file is deliberately NOT deleted. It is 164 bytes, and removing
    # a backup to tidy up a metric is not a trade this lab makes.
    - name: Find any legacy dated netplan backups
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: "50-cloud-init.yaml.bak-*"
      register: legacy_netplan_backups
      check_mode: false

    - name: Report which file will be preserved as the pristine original
      ansible.builtin.debug:
        msg: >-
          {{
            'Promoting oldest existing backup: '
              ~ (legacy_netplan_backups.files | sort(attribute='mtime'))[0].path
            if legacy_netplan_backups.files | length > 0
            else 'No dated backup found — taking the live /etc/netplan/50-cloud-init.yaml
                  as the original. This is correct ONLY on a host this play has never
                  modified; if the resolver tasks below report ok on a fresh host,
                  investigate before trusting this backup.'
          }}

    - name: Preserve the pristine cloud-init netplan (written once, never clobbered)
      ansible.builtin.copy:
        src: >-
          {{ (legacy_netplan_backups.files | sort(attribute='mtime'))[0].path
             if legacy_netplan_backups.files | length > 0
             else '/etc/netplan/50-cloud-init.yaml' }}
        dest: /etc/netplan/50-cloud-init.yaml.orig
        remote_src: true
        force: false          # never clobber — and the dest no longer moves
        mode: "0600"

    - name: Drop the hard-coded nameservers from enp2s0
      ansible.builtin.copy:
        dest: /etc/netplan/50-cloud-init.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          # Originally generated by cloud-init; now managed by Ansible
          # (playbooks/h4-dns-resolvers.yml). Regeneration is disabled via
          # /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg.
          #
          # The enp2s0 `nameservers` block removed here read:
          #     addresses: [192.168.1.152, 192.168.1.184]
          # .152 is octopi's second interface — the same physical RPi 3B as .148, and
          # marked "(avoid)" in docs/HARDWARE.md:22. DNS now comes solely from
          # 99-lab-dns.yaml. See BACKLOG.md §4.12.
          network:
            version: 2
            ethernets:
              enp1s0:
                dhcp4: true
              enp2s0:
                dhcp4: true

    - name: Write the netplan override
      ansible.builtin.copy:
        dest: /etc/netplan/99-lab-dns.yaml
        owner: root
        group: root
        mode: "0600"          # netplan warns loudly about world-readable configs
        content: |
          # Managed by Ansible (playbooks/h4-dns-resolvers.yml).
          #
          # Overrides the DNS half of 50-cloud-init.yaml. Netplan merges by filename
          # order and later wins, so this survives cloud-init regenerating that file.
          #
          # use-dns: false stops each link taking nameservers from DHCP. Without it the
          # DHCP-supplied servers are added to these and the total exceeds the kubelet's
          # limit of three again — which is the whole bug (BACKLOG.md §4.12).
          network:
            version: 2
            ethernets:
          {% for link in h4_links %}
              {{ link }}:
                dhcp4: true
                dhcp4-overrides:
                  use-dns: false
          {% if link != h4_dns_link %}
                  # Both links are on the same /24 and both take DHCP, so both
                  # installed a default route at metric 100 and the kernel picked
                  # whichever it liked — which made the H4's source address for LAN
                  # traffic non-deterministic. A higher metric loses. This does not
                  # remove the address or down the link. BACKLOG §2.9.
                  route-metric: {{ h4_secondary_route_metric }}
          {% endif %}
          {% if link == h4_dns_link %}
                # Resolver list lives on this link only. Repeating it on the other
                # link doubles the entries in resolv.conf — resolved does not dedupe
                # across links. See the h4_dns_link comment in this playbook.
                nameservers:
                  addresses:
          {% for ns in h4_nameservers %}
                    - {{ ns }}
          {% endfor %}
                  search:
                    - {{ h4_search }}
          {% endif %}
          {% endfor %}
      register: _netplan_written

    - name: Validate the merged netplan config without applying it
      ansible.builtin.command: netplan generate
      changed_when: false
      when: _netplan_written is changed

    # Deliberately no `netplan apply` and no handler. Applying a resolver change to the
    # NAS core over SSH is an `ask` action per CLAUDE.md, and the safe form of it is
    # `netplan try`, which needs an interactive confirmation this playbook cannot give.
    #
    # The two messages below are separate because a single one cannot be true in both
    # modes. An earlier version said "Override written and netplan generate accepted
    # it" unconditionally — under --check nothing was written and generate had been
    # skipped, so the dry run asserted a success that had not happened. Same bug as
    # BACKLOG §3.9's playbook, written after fixing it there.
    - name: DRY RUN — say plainly that nothing happened
      ansible.builtin.debug:
        msg: >-
          DRY RUN. No file was written and `netplan generate` did not run — Ansible
          skips command tasks under --check. The diff above is what WOULD be written.
          Re-run without --check to write it.
      when: ansible_check_mode

    - name: Stop here and hand over
      ansible.builtin.debug:
        msg: >-
          Override written to /etc/netplan/99-lab-dns.yaml and `netplan generate`
          accepted it. NOTHING HAS BEEN APPLIED to the running config. Now, on the H4:
          sudo netplan try  — it reverts by itself after 120s unless you confirm.
          Then verify: `resolvectl dns` shows three servers and no .152, and
          `kubectl get events -A --field-selector reason=DNSConfigForming` stops
          producing new entries for odroid-nas.
      when: not ansible_check_mode
