---
# Configure Vault's Kubernetes auth method so ESO stops using a static token.
#
# This is STEP 2 of 3. See gitops/workloads/external-secrets/vault-auth-sa.yaml for the
# full sequence and the reasoning. Short version: ESO's Vault token expires ~2026-09-08
# and fails silently (BACKLOG.md §5). Kubernetes auth removes the expiry rather than
# extending it.
#
# WHAT THIS DOES
#   - Reads the token-reviewer JWT and the cluster CA from the k8s Secret created in
#     step 1.
#   - Writes auth/kubernetes/config on the rpi5 Vault so it can call TokenReview.
#   - Creates the `eso` role, bound to the external-secrets ServiceAccount in the
#     external-secrets namespace, with the existing `eso` policy.
#
# WHAT IT DOES NOT DO
#   It does not switch ESO over. That is step 3, a one-line change to the
#   ClusterSecretStore in gitops/workloads/immich/external-secret.yaml. Until then ESO
#   keeps using the static token and this configuration sits unused — which is
#   deliberate, so the two halves can be verified separately.
#
# RUN
#   cd ansible                    # ansible.cfg only applies from here — §4.1c
#   VAULT_TOKEN=<token> ansible-playbook -i inventory/hosts.yml playbooks/vault-eso-k8s-auth.yml --check
#   (need a token? docs/OPS.md -> "Get a Vault admin token")
#   ansible-playbook -i inventory/hosts.yml playbooks/vault-eso-k8s-auth.yml
#
# VERIFY (step 2 alone, before touching ESO):
#   vault read auth/kubernetes/config
#   vault write auth/kubernetes/login role=eso jwt="$(kubectl create token external-secrets -n external-secrets)"
# A token in the response means Vault can validate cluster identities. If that works,
# step 3 is safe; if it does not, ESO is untouched and nothing is broken.
#
# ROLLBACK
#   Step 3 is the risky one and reverts with `git revert`. This playbook's effects are
#   inert while the ClusterSecretStore still uses tokenSecretRef.
- name: Vault — Kubernetes auth for external-secrets
  hosts: vault
  become: false
  gather_facts: false

  vars:
    # kube-vip control-plane VIP. NOT a node IP: the whole point of the VIP is that it
    # survives losing any one server, and Vault must follow it. See CLAUDE.md.
    k8s_api: "https://192.168.1.200:6443"
    eso_namespace: external-secrets
    eso_service_account: external-secrets
    reviewer_secret: vault-token-reviewer-token
    vault_policy: eso

  # `vault write` needs both an address and a token. VAULT_ADDR because the CLI otherwise
  # defaults to https://127.0.0.1:8200 and this Vault serves plaintext HTTP (BACKLOG §2.6);
  # VAULT_TOKEN because writing auth methods is a privileged operation. Same preflight
  # pattern as backup-offsite.yml, which fails clearly rather than producing a confusing
  # 403 halfway through.
  environment:
    VAULT_ADDR: "{{ vault_addr | default('http://127.0.0.1:8200') }}"
    VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"

  tasks:
    - name: Preflight — VAULT_TOKEN must be set
      ansible.builtin.assert:
        that: lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          VAULT_TOKEN is empty. Pass a current token:
          VAULT_TOKEN=<token> ansible-playbook -i inventory/hosts.yml
          playbooks/vault-eso-k8s-auth.yml
          Need one? docs/OPS.md -> "Get a Vault admin token". token-admin is
          allowed to lapse — nothing automated uses it, so an expired one is expected,
          not an incident.
      run_once: true

    # ONE read, as JSON, with argv — not two jsonpath queries.
    #
    # The first version used `-o jsonpath={.data['ca\.crt']}`. The key genuinely contains a
    # dot, so it needs bracket-and-quote syntax — but those quotes have to survive a YAML
    # folded scalar AND the shell before kubectl sees them, and on 2026-08-23 they did not:
    #     error parsing jsonpath {.data[ca\.crt]}, invalid array index ca\.crt
    # argv bypasses shell parsing entirely, and Jinja handles data['ca.crt'] without any
    # escaping at all. Fewer layers, fewer places for quoting to be eaten.
    - name: Read the token-reviewer Secret
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ eso_namespace }}"
          - get
          - secret
          - "{{ reviewer_secret }}"
          - -o
          - json
      delegate_to: h4-core
      register: _reviewer_raw
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Refuse to continue if the Secret is missing
      ansible.builtin.assert:
        that: _reviewer_raw.rc == 0
        fail_msg: >-
          Cannot read secret/{{ reviewer_secret }} in {{ eso_namespace }}. Apply step 1
          (gitops/workloads/external-secrets/vault-auth-sa.yaml) and wait for Argo to sync.
          kubectl said: {{ _reviewer_raw.stderr | default('(no stderr)') }}

    - name: Extract the reviewer JWT and the cluster CA
      ansible.builtin.set_fact:
        _reviewer_jwt: "{{ (_reviewer_raw.stdout | from_json).data.token | b64decode }}"
        _cluster_ca: "{{ (_reviewer_raw.stdout | from_json).data['ca.crt'] | b64decode }}"
      no_log: true          # the JWT is a credential; do not put it in the play log

    # Fail early and clearly rather than writing an empty config into Vault. An empty
    # token here produces a Vault config that looks fine and rejects every login.
    - name: Refuse to continue without both values
      ansible.builtin.assert:
        that:
          - _reviewer_jwt | length > 0
          - _cluster_ca | length > 0
        fail_msg: >-
          The token-reviewer Secret exists but token or ca.crt is empty. Kubernetes
          populates these asynchronously after the Secret is created — if step 1 only just
          synced, wait a moment and re-run.

    - name: Configure the Kubernetes auth method
      ansible.builtin.shell:
        cmd: >-
          vault write auth/kubernetes/config
          kubernetes_host='{{ k8s_api }}'
          kubernetes_ca_cert='{{ _cluster_ca }}'
          token_reviewer_jwt='{{ _reviewer_jwt }}'
      no_log: true          # the reviewer JWT must not reach the log
      changed_when: true
      when: not ansible_check_mode

    - name: Bind the eso role to the external-secrets ServiceAccount
      ansible.builtin.shell:
        cmd: >-
          vault write auth/kubernetes/role/eso
          bound_service_account_names='{{ eso_service_account }}'
          bound_service_account_namespaces='{{ eso_namespace }}'
          policies='{{ vault_policy }}'
          ttl=1h
      changed_when: true
      when: not ansible_check_mode

    # Prove Vault can actually validate a cluster identity. This is the difference
    # between "the writes returned 0" and "authentication works" — see CLAUDE.md,
    # "Check the artifact the consumer reads".
    - name: Verify a real login succeeds
      ansible.builtin.shell:
        cmd: >-
          vault write -field=token auth/kubernetes/login role=eso
          jwt="$(kubectl create token {{ eso_service_account }} -n {{ eso_namespace }})"
      delegate_to: h4-core
      # Delegated to the H4, so the play-level environment (rpi5's loopback address) is
      # wrong here — this must reach Vault over the network. A login needs no token; that
      # is the point of the test.
      environment:
        VAULT_ADDR: "http://192.168.1.128:8200"
        VAULT_TOKEN: ""
      register: _login_test
      changed_when: false
      check_mode: false
      failed_when: false
      when: not ansible_check_mode

    - name: Report the result
      ansible.builtin.debug:
        msg: >-
          {{ 'Kubernetes auth WORKS — a login returned a token. Step 3 (switching the
          ClusterSecretStore) is safe.' if (_login_test.rc | default(1)) == 0
          else 'Kubernetes auth is NOT working: ' ~ (_login_test.stderr | default('n/a'))
          ~ ' — do NOT proceed to step 3. ESO is still on the static token and unaffected.' }}
      when: not ansible_check_mode

    - name: DRY RUN — say plainly that nothing happened
      ansible.builtin.debug:
        msg: >-
          DRY RUN. Nothing was written to Vault. Re-run without --check to configure
          the auth method; ESO is unaffected either way until step 3.
      when: ansible_check_mode
