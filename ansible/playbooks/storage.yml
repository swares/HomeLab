---
# Storage layer for the H4 core. Corrected model (confirmed complement):
#
#   eMMC 256 GB        -> host OS (frees the NVMe entirely)
#   NVMe 4 TB          -> HOT: etcd, k8s PVs, live NAS data (lv_nas). NOT mirrored (single disk).
#   8 TB RAID 1 (md1)  -> COLD primary: restic repo + etcd snapshots + the Immich library.
#   ~5.45 TB RAID 1    -> COLD secondary: restic copy (critical set) + archive (rebuilt 2x6TB).
#
# Both cold tiers are mdadm RAID 1 mirrors, so each survives a single-disk failure in place
# (rebuild, no restore). The NVMe hot tier is the remaining single point of failure for LIVE
# data — which is why it is backed up to the (mirrored) cold tiers, and ideally offsite.
#
# NOTE: this playbook MOUNTS pre-existing arrays and CONTAINS NO TASK THAT CAN FORMAT A COLD
# TIER. It does not create the RAID (mdadm --create is destructive and the arrays already
# exist), and as of 2026-08-21 it does not create filesystems on them either — if one is
# missing the play fails and says so. The 8 TB mirror may be DEGRADED until the UDMA-CRC/link
# issue is resolved — see RUNBOOK "UDMA CRC".
#
# Cold tiers are addressed by FILESYSTEM UUID (cold_primary_fs_uuid / cold_secondary_fs_uuid
# in inventory), never by /dev/mdX — those are assembly-order names the kernel can reassign.
# BACKLOG.md §1.4.
- name: Configure storage tiers on the H4 core
  hosts: microshift
  become: true
  vars:
    storage_alert_email: "{{ alert_email | default('root@localhost') }}"
  tasks:
    # ---- Monitoring: SMART + mdadm (catch a climbing CRC count or a dropped mirror member) ----
    - name: Install smartmontools + mdadm
      ansible.builtin.package:
        name: [smartmontools, mdadm]
        state: present

    - name: smartd — scan all disks, alert on SMART failure
      ansible.builtin.copy:
        dest: /etc/smartd.conf
        mode: "0644"
        content: |
          # Ansible-managed. Watch attribute 199 (UDMA_CRC) + 5/197/198 (media).
          DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,45,55 -m {{ storage_alert_email }}
      notify: restart smartd

    - name: mdadm — email on a degraded/failed array
      ansible.builtin.lineinfile:
        path: /etc/mdadm/mdadm.conf
        regexp: '^MAILADDR'
        line: "MAILADDR {{ storage_alert_email }}"
        create: true
      notify: restart mdmonitor

    # ---- Cold tiers: identified by FILESYSTEM UUID, never by device name ----
    #
    # BACKLOG §1.4. `/dev/md0` and `/dev/md1` are assembly-order names, not identities.
    # mdadm numbers arrays as it finds them, so a reboot, a degraded member, a disk
    # replacement or an added controller can renumber them. The previous version of
    # this section formatted and mounted by `{{ cold_primary_device }}` — meaning the
    # 8 TB copy-of-record and the 5.45 TB copy were distinguished by a number that the
    # kernel is free to reassign.
    #
    # Two consequences, in ascending order of how bad they are:
    #   - Mounting the wrong array at the wrong path. Not destructive, but restic then
    #     writes the primary repo onto the secondary mirror and the retention policies
    #     are applied to the wrong data.
    #   - `community.general.filesystem` with force:false will not overwrite an
    #     existing filesystem, but it WILL create one on a blank device. A replacement
    #     disk that inherits a free mdX number is exactly such a device.
    #
    # So: no device names below this line. Filesystem UUIDs are properties of the
    # filesystem itself and survive every renumbering. CLAUDE.md's rule is "never
    # mkfs/wipefs the cold disks"; the way to honour that in code is to make it
    # impossible to name them by accident.
    #
    # ONE-TIME SETUP — capture the UUIDs into inventory:
    #     blkid -s UUID -o value /dev/md1   # -> cold_primary_fs_uuid
    #     blkid -s UUID -o value /dev/md0   # -> cold_secondary_fs_uuid
    - name: Require the cold filesystem UUIDs to be defined
      ansible.builtin.assert:
        that:
          - cold_primary_fs_uuid is defined
          - cold_secondary_fs_uuid is defined
        fail_msg: >-
          cold_primary_fs_uuid / cold_secondary_fs_uuid are not set in inventory.
          Capture them on the H4 with `blkid -s UUID -o value /dev/md1` and
          `/dev/md0`, add them under h4-core, then re-run. This playbook will not
          fall back to device names — see BACKLOG.md §1.4.

    # Read-only, and check_mode:false so a --check run reports the TRUE state rather
    # than skipping and letting the summary imply everything is fine (CLAUDE.md).
    - name: Resolve each cold filesystem UUID to the device currently holding it
      ansible.builtin.command: "blkid -U {{ item.uuid }}"
      register: _cold_devices
      changed_when: false
      check_mode: false
      failed_when: false
      loop:
        - { name: primary,   uuid: "{{ cold_primary_fs_uuid }}" }
        - { name: secondary, uuid: "{{ cold_secondary_fs_uuid }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Refuse to continue if either cold filesystem is missing
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: >-
          No filesystem with UUID {{ item.item.uuid }} ({{ item.item.name }} cold tier)
          is present on this host. That means the array is not assembled, or the disks
          are not attached — NOT that a filesystem needs creating. Do not "fix" this by
          formatting anything. Check `cat /proc/mdstat` and `mdadm --detail --scan`
          first. Creating a cold tier from scratch is a deliberate, separate act, not
          something this playbook does.
      loop: "{{ _cold_devices.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Show which device each cold tier currently occupies
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }} cold tier: UUID {{ item.item.uuid }}
          is currently {{ item.stdout | default('UNRESOLVED') }}
          (informational — the mount below uses the UUID, not this path)
      loop: "{{ _cold_devices.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Mount the cold mirrors by UUID
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "UUID={{ item.uuid }}"
        fstype: xfs
        opts: defaults,noatime
        state: mounted
      loop:
        - { path: "{{ cold_primary_mount }}",   uuid: "{{ cold_primary_fs_uuid }}" }
        - { path: "{{ cold_secondary_mount }}", uuid: "{{ cold_secondary_fs_uuid }}" }
      loop_control:
        label: "{{ item.path }}"

    - name: Create cold-tier subdirectories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ cold_primary_mount }}/restic"               # primary NAS/data backups
        - "{{ cold_primary_mount }}/microshift-backups"   # cluster/etcd snapshots
        - "{{ cold_secondary_mount }}/restic"             # second copy (restic copy)
        - "{{ cold_secondary_mount }}/archive"            # cold/bulk shares

    # ---- Hot tier: NVMe LVM via sparse file + loop device ----
    # NVMe has no free partition (p2 = old OS install). We use a sparse file on p2
    # as the LVM PV, attached as /dev/loop100. A systemd unit re-attaches it on boot
    # before lvm2-monitor.service so LVM and MicroShift start cleanly.
    - name: Install lvm2
      ansible.builtin.package:
        name: lvm2
        state: present

    - name: Create sparse file for LVM PV ({{ microshift_lvm_size }}, allocates on write)
      ansible.builtin.command: >
        truncate -s {{ microshift_lvm_size }} {{ microshift_lvm_file }}
      args:
        creates: "{{ microshift_lvm_file }}"

    - name: Install loop-device systemd unit
      ansible.builtin.template:
        src: ../templates/microshift-lvm-loop.service.j2
        dest: /etc/systemd/system/microshift-lvm-loop.service
        mode: "0644"
      notify: reload systemd

    - name: Enable and start loop-device service
      ansible.builtin.systemd:
        name: microshift-lvm-loop.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify loop device is attached
      ansible.builtin.command: losetup {{ microshift_loop_dev }}
      register: loop_check
      changed_when: false
      failed_when: loop_check.rc != 0
      # Read-only probe. Without this, command tasks skip under --check, so this
      # verification silently does nothing during a dry run — and the loop device
      # backs vg_microshift, i.e. every k8s PV.
      check_mode: false

    - name: Create the LVMS volume group on the loop device
      community.general.lvg:
        vg: "{{ microshift_vg }}"
        pvs: "{{ microshift_pv_device }}"

    - name: Create the live NAS logical volume
      community.general.lvol:
        vg: "{{ microshift_vg }}"
        lv: "{{ nas_lv }}"
        size: 1500G
        shrink: false

    - name: Filesystem on the NAS LV
      community.general.filesystem:
        fstype: xfs
        dev: "/dev/{{ microshift_vg }}/{{ nas_lv }}"
        force: false

    - name: Mount the live NAS share
      ansible.posix.mount:
        path: "{{ nas_mount }}"
        src: "/dev/{{ microshift_vg }}/{{ nas_lv }}"
        fstype: xfs
        opts: defaults,noatime
        state: mounted

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart smartd
      ansible.builtin.service:
        name: smartd
        state: restarted

    - name: restart mdmonitor
      ansible.builtin.service:
        name: mdmonitor
        state: restarted
