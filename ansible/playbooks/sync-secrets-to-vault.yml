---
# Sync lab secrets into HashiCorp Vault.
# Run after any credential rotation to keep Vault as the authoritative store.
# Requires: VAULT_TOKEN env var set, Vault reachable at 192.168.1.128:8200.
#
# Run:
#   VAULT_TOKEN=<token> ansible-playbook \
#     -i inventory/hosts.yml playbooks/sync-secrets-to-vault.yml \
#     --vault-password-file .vault_pass
#
#   To also sync the swares password:
#   VAULT_TOKEN=<token> ansible-playbook \
#     -i inventory/hosts.yml playbooks/sync-secrets-to-vault.yml \
#     --vault-password-file .vault_pass \
#     -e "swares_password=<plaintext>"

- name: Sync secrets to HashiCorp Vault
  hosts: localhost
  gather_facts: false

  vars:
    vault_url: "http://192.168.1.128:8200"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    swares_password: ""

    # Every path this play writes, with the capability each write needs. Checked
    # up front because the writes below are SEQUENTIAL and carry no_log: a token
    # authorised for some paths and not others fails partway and leaves Vault
    # half-updated, with the error censored and no record of which puts landed.
    #
    # PATHS ARE THE KV-v2 API FORM (`secret/data/lab/x`), NOT the CLI form
    # (`secret/lab/x`). The CLI rewrites the path for you; ACLs and
    # `vault token capabilities` do not. Probing the CLI form would silently
    # evaluate a path no policy is written against.
    #
    # Verified 2026-09-19 that this distinction is currently invisible: `admin`
    # carries `path "secret/*"` (ansible/files/vault-policies/admin.hcl:21), a glob
    # matching BOTH forms, so both return identical capabilities today. That makes
    # the form impossible to validate by experiment with an admin token — and it is
    # exactly why the correct form has to be chosen deliberately here rather than
    # discovered later by a narrower token failing in production.
    vault_target_secrets:
      - path: restic
        needs: [create, update]
      - path: immich
        needs: [create, update]
      - path: authelia
        needs: [create, update]
      # `kv patch` at the end of this play needs `patch` as well as create/update.
      - path: hosts
        needs: [create, update, patch]
      - path: argocd
        needs: [create, update]

  environment:
    VAULT_ADDR: "{{ vault_url }}"
    VAULT_TOKEN: "{{ vault_token }}"

  pre_tasks:
    - name: Verify VAULT_TOKEN is set
      ansible.builtin.assert:
        that: vault_token != ''
        fail_msg: >-
          VAULT_TOKEN is empty. Pass a current token:
          VAULT_TOKEN=<token> ansible-playbook -i inventory/hosts.yml
          playbooks/sync-secrets-to-vault.yml
          Need one? docs/OPS.md -> "Get a Vault admin token". token-admin is
          allowed to lapse — nothing automated uses it, so an expired one is expected,
          not an incident.

    - name: Check Vault is reachable
      ansible.builtin.uri:
        url: "{{ vault_url }}/v1/sys/health"
        status_code: [200, 429]
        timeout: 5

    # A non-empty token and a reachable Vault say nothing about whether this token
    # may WRITE these paths. `token capabilities` answers that without performing
    # any write, so it is safe under --check and costs one round trip per path.
    - name: Preflight — read the token's capabilities on every target path
      ansible.builtin.command:
        cmd: vault token capabilities secret/data/lab/{{ item.path }}
      register: vault_caps
      changed_when: false
      failed_when: false
      check_mode: false   # read-only; must run under --check or the assert is vacuous
      loop: "{{ vault_target_secrets }}"
      loop_control:
        label: "secret/data/lab/{{ item.path }}"

    - name: Preflight — the token must be able to write every target path
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - >-
            'root' in (item.stdout | regex_findall('[a-z]+'))
            or (item.item.needs
                | difference(item.stdout | regex_findall('[a-z]+'))
                | length == 0)
        fail_msg: >-
          Token cannot write secret/data/lab/{{ item.item.path }} —
          needs {{ item.item.needs | join(', ') }}, has
          '{{ item.stdout | default('') | trim }}' (rc={{ item.rc }}).
          Likely an expired or revoked VAULT_TOKEN, or a policy narrower than
          admin. Refusing to start: the writes in this play are sequential and
          no_log, so a partial run leaves Vault half-updated with the cause
          censored. Check with: vault token lookup
        quiet: true
      loop: "{{ vault_caps.results }}"
      loop_control:
        label: "secret/data/lab/{{ item.item.path }}"

  tasks:
    # ── restic password ────────────────────────────────────────────────────
    - name: Read restic password from H4
      ansible.builtin.slurp:
        src: /etc/restic/password
      register: restic_password_b64
      become: true

    - name: Sync restic password to Vault
      ansible.builtin.shell: |
        vault kv put secret/lab/restic \
          password={{ restic_password_b64.content | b64decode | trim | quote }}
      no_log: true
      changed_when: true

    # ── immich DB password ─────────────────────────────────────────────────
    - name: Read immich DB password from k8s
      ansible.builtin.command:
        cmd: kubectl get secret immich-secrets -n immich
          -o jsonpath='{.data.DB_PASSWORD}'
      register: immich_db_b64
      changed_when: false

    - name: Sync immich DB password to Vault
      ansible.builtin.shell: |
        vault kv put secret/lab/immich \
          DB_PASSWORD={{ immich_db_b64.stdout | b64decode | quote }}
      no_log: true
      changed_when: true

    # ── authelia secrets ───────────────────────────────────────────────────
    - name: Read authelia secrets from k8s
      ansible.builtin.command:
        cmd: kubectl get secret authelia-secrets -n authelia -o json
      register: authelia_raw
      changed_when: false

    - name: Parse authelia secrets
      when: authelia_raw is not skipped and authelia_raw.stdout is defined
      ansible.builtin.set_fact:
        ad: "{{ (authelia_raw.stdout | from_json).data }}"
      no_log: true

    - name: Sync authelia secrets to Vault
      ansible.builtin.shell: |
        vault kv put secret/lab/authelia \
          jwt_secret={{ ad.jwt_secret | b64decode | quote }} \
          session_secret={{ ad.session_secret | b64decode | quote }} \
          storage_encryption_key={{ ad.storage_encryption_key | b64decode | quote }} \
          oidc_hmac_secret={{ ad.oidc_hmac_secret | b64decode | quote }} \
          ldap_password={{ ad.ldap_password | b64decode | quote }} \
          immich_client_secret={{ ad.immich_client_secret | b64decode | quote }} \
          storage_pg_password={{ ad.storage_pg_password | b64decode | quote }}
      no_log: true
      changed_when: true

    # ── lldap secrets ──────────────────────────────────────────────────────
    # Removed 2026-08-02. These tasks slurped /opt/lldap/lldap_config.toml from
    # the ldap-1 VM (decommissioned 2026-07-18) and pushed the values into
    # secret/lab/lldap. delegate_to: ldap-1 made this playbook fail outright.
    # lldap now runs as a k3s Deployment and receives jwt_secret/admin_password
    # FROM Vault via the lldap-secrets ExternalSecret, so Vault is the source of
    # truth and there is nothing to sync back. Edit secret/lab/lldap directly.

    # ── swares host password ───────────────────────────────────────────────
    - name: Sync swares password to Vault
      ansible.builtin.shell: |
        vault kv put secret/lab/hosts \
          swares_password={{ swares_password | quote }}
      when: swares_password != ''
      no_log: true
      changed_when: true

    - name: Warn if swares_password not provided
      ansible.builtin.debug:
        msg: >-
          WARNING: swares_password not provided via --extra-vars.
          secret/lab/hosts was NOT updated. Pass -e swares_password=<plaintext>
          to sync it.
      when: swares_password == ''

    # ── kvm_hosts sudo (become) password ──────────────────────────────────
    # ansible_become_password is already Ansible-Vault-encrypted in
    # group_vars/kvm_hosts/secrets.yml; this backs it up to HashiCorp Vault.
    # Uses kv patch so it merges with existing keys at secret/lab/hosts.
    - name: Sync kvm_hosts become password to Vault
      ansible.builtin.shell: |
        vault kv patch secret/lab/hosts \
          kvm_become_password={{ hostvars['n150-1']['ansible_become_password'] | quote }}
      no_log: true
      changed_when: true

    # ── ArgoCD deploy key ─────────────────────────────────────────────────
    # Private key used by ArgoCD to pull from GitHub. Regeneration requires
    # re-adding the public key to the repo's deploy keys in GitHub settings.
    - name: Read ArgoCD deploy key
      ansible.builtin.slurp:
        src: "{{ lookup('env', 'HOME') }}/.ssh/argocd-deploy-key"
      register: argocd_key_b64
      ignore_errors: true   # non-fatal if key has been moved

    - name: Sync ArgoCD deploy key to Vault
      ansible.builtin.shell: |
        vault kv put secret/lab/argocd \
          deploy_key={{ argocd_key_b64.content | b64decode | quote }}
      when: argocd_key_b64 is not failed
      no_log: true
      changed_when: true

    - name: Warn if ArgoCD deploy key not found
      ansible.builtin.debug:
        msg: "WARNING: ~/.ssh/argocd-deploy-key not found — secret/lab/argocd was NOT updated."
      when: argocd_key_b64 is failed

    # ── summary ────────────────────────────────────────────────────────────
    # `secret/lab/lldap ✓` WAS PRINTED HERE FROM 2026-08-02 TO 2026-09-19 for work
    # that had been deleted. The lldap sync tasks were removed on 08-02 (see the
    # note above); this line was not, so every run since reported a successful sync
    # of a path the play no longer touches — 7 weeks of a green tick for nothing.
    #
    # Same defect as backup-offsite.yml's "no copy is scheduled", found the same
    # day: a hand-written summary drifting away from the tasks it claims to
    # describe. The lesson both times is that a literal ✓ asserts nothing. These
    # remaining ticks are honest only because a failing `vault kv put` aborts the
    # play — there is no `failed_when: false` on any of them, so reaching this task
    # at all proves those writes returned 0. If that ever changes, these must
    # become conditionals, not decoration.
    - name: Sync complete
      ansible.builtin.debug:
        msg: |
          Secrets synced to Vault:
            secret/lab/restic        ✓
            secret/lab/immich        ✓
            secret/lab/authelia      ✓
            secret/lab/hosts         {{ '✓' if swares_password != '' else '⚠ skipped (no plaintext provided)' }}
            secret/lab/hosts (patch) ✓  kvm_become_password
            secret/lab/argocd        {{ '✓' if argocd_key_b64 is not failed else '⚠ key not found' }}

          secret/lab/lldap is NOT written by this play. Vault is the source of
          truth for it — lldap reads it via the lldap-secrets ExternalSecret — so
          edit that path directly. Do not re-add it to this list.
