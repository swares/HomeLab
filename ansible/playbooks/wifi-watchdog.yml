---
# wifi-watchdog.yml — WiFi power-save enforcement and a reconnect watchdog for the
# Orange Pi Zero 2W pool.
#
# ---- WHAT THE DISCOVERY PASS ACTUALLY FOUND, 2026-09-04 ----
# Written after measuring all four boards rather than from the reported symptom,
# and the measurements changed the job:
#
#   1. POWER SAVE IS ALREADY OFF on all four (`iw dev wlan0 get power_save` -> off),
#      and NetworkManager already carries wifi.powersave = 2 on -3 and -4. So the
#      requested fix was a no-op. It is codified here anyway, because NOTHING
#      ENFORCED IT — NM re-applies powersave on every reconnect, so a value that is
#      correct today is not a value that stays correct. This play makes it durable;
#      it does not "fix" anything that was broken.
#
#   2. NO EVIDENCE OF WIFI DISCONNECTS. Seven days of journal across the pool:
#      0, 1, 0, 0 matches for CTRL-EVENT-DISCONNECTED / deauthenticat / beacon loss.
#      That negative is trustworthy: wpa_supplicant and NetworkManager DO log to the
#      journal here (CTRL-EVENT-* and `device (wlan0): state changed` were both
#      observed), so the check can speak. Note the kernel cannot: `journalctl -k` has
#      560-668 lines and ZERO mentions of wlan/unisoc/cfg80211/nl80211 — the
#      out-of-tree unisoc_wifi driver is silent at kernel level. Do not add a
#      kernel-log-based detector; it has nothing to read.
#
#   3. THE REBOOTS WERE MANUAL. `--list-boots` showed -2 restarting twice in five
#      days and -3 four times in 45 minutes; the operator confirmed both were hand
#      power-cycles. Worth recording because an automated reboot escalation is only
#      safe once spontaneous reboots are ruled out — a watchdog that reboots boards
#      which already reboot on their own amplifies a fault instead of fixing one.
#
#   4. NOT under-voltage, NOT OOM, NOT panics. A first pass counted 2 hits each of
#      "under-voltage", "out of memory", "kernel panic" and "hardware error" on every
#      board — identical counts, four unrelated causes, four different machines.
#      They were sudo's log of the DIAGNOSTIC COMMAND, whose grep pattern contained
#      all four phrases. `journalctl -k` (which cannot contain sudo lines) returns 0
#      for all of them. The measurement had been reading itself.
#
# SO THE VALUABLE HALF OF THIS PLAY IS THE TELEMETRY, NOT THE REBOOT. Nothing in the
# lab can currently see a WiFi drop on these boards. The watchdog is the instrument
# that establishes whether the reported problem is real and how often it happens.
# The 30-minute / 2-per-24h reboot policy is deliberately conservative enough that it
# should almost never fire while that question is being answered.
#
# ---- SYSTEMD TIMER, NOT CRON ----
# Asked for as cron. `cron`/`crond` are INACTIVE and `crontab` is absent on
# opi-zero2w-1 and -2 (Arch), while -3 and -4 (Debian) have cron running. Honouring
# cron means installing cronie on half the pool and managing two package names and
# two unit names, for something a timer does identically on all four with nothing
# installed. Same pattern as chrony-onoffline.timer. Trivially switchable if wanted.
#
# ---- ALSO FOUND, NOT FIXED HERE (both belong to other entries) ----
#   * HOSTNAME COLLISION. /etc/hostname vs the Ansible key:
#         .184  opi-zero2w-1 -> opizero2w-4        <- differs from .99 by one hyphen
#         .188  opi-zero2w-2 -> opizero2w-1
#         .217  opi-zero2w-3 -> orangepizero2w
#         .99   opi-zero2w-4 -> opi-zero2w-4
#     Metrics are unaffected (monitoring.yaml relabels `instance` from the scrape
#     address) but journal entries and anything Promtail/Alloy ships carry the
#     hostname, so logs from .184 land under a name belonging to another machine.
#     BACKLOG §4.14 — do not fix it in passing here; renaming hosts mid-play would
#     invalidate the metrics this play is installing.
#   * NO BATTERY-BACKED RTC, AND fake-hwclock ONLY ON -4. -1 booted stamped
#     2024-07-06, -2 stamped 2026-07-24, until NTP corrected them. BACKLOG §1.13's
#     "warm RTC" exposure, realised. Means TLS at boot sees certs as not-yet-valid.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/wifi-watchdog.yml --check
#   ansible-playbook -i inventory/hosts.yml playbooks/wifi-watchdog.yml

- name: WiFi power-save enforcement and reconnect watchdog (OPi Zero 2W pool)
  hosts: opi_zero2w
  become: true
  gather_facts: true

  vars:
    # `.get()` rather than `ansible_facts.default_ipv4.gateway | default(...)`.
    # Attribute access on an undefined value RAISES before the filter runs — that
    # exact mistake was made in chrony.yml on 2026-09-02 and would have failed on
    # every host. .get() on a defaulted empty dict cannot raise.
    wifi_watchdog_gateway: "{{ (ansible_facts.default_ipv4 | default({})).get('gateway') or lab_gateway }}"
    wifi_watchdog_reboot_after_seconds: 1800     # 30 min continuously down
    wifi_watchdog_max_reboots_24h: 2
    wifi_watchdog_min_uptime_seconds: 900        # never reboot within 15 min of boot
    wifi_watchdog_textfile_dir: /var/lib/node_exporter/textfile_collector
    wifi_watchdog_interval: 2min

  tasks:
    # ---- 0. measure before changing anything --------------------------------
    - name: Find the wireless interface and current power-save state
      ansible.builtin.shell: |
        set -o pipefail
        IF=""
        for d in /sys/class/net/*/wireless; do [ -e "$d" ] || continue; IF=$(basename "$(dirname "$d")"); break; done
        echo "iface=${IF:-NONE}"
        if [ -n "$IF" ] && command -v iw >/dev/null 2>&1; then
          echo "powersave=$(iw dev "$IF" get power_save 2>/dev/null | sed 's/.*: //')"
        else
          echo "powersave=unknown"
        fi
        echo "nm_present=$([ -d /etc/NetworkManager ] && echo yes || echo no)"
      args:
        executable: /bin/bash
      register: wifi_pre
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show the before state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} BEFORE: {{ wifi_pre.stdout_lines | default([]) | join(' | ') }} gateway={{ wifi_watchdog_gateway }}"

    - name: Refuse to continue without a wireless interface
      ansible.builtin.assert:
        that:
          - wifi_pre.stdout is defined
          - wifi_pre.stdout is not search('iface=NONE')
        fail_msg: >-
          {{ inventory_hostname }}: no wireless interface found. This play is for the
          WiFi-attached Zero 2W pool and will not install a watchdog with nothing to watch.

    - name: Ensure iw is installed
      ansible.builtin.package:
        name: iw
        state: present

    # ---- 1. make power save off DURABLE -------------------------------------
    # Two mechanisms because they cover different moments. The udev rule fires on
    # interface creation (boot, module reload, hotplug); the NetworkManager drop-in
    # stops NM re-enabling it on each reconnect. Neither alone is sufficient, and the
    # watchdog script re-asserts it every run as a third net.
    - name: Install udev rule disabling WiFi power save at interface creation
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/70-wifi-powersave-off.rules
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/wifi-watchdog.yml).
          # Power save on the unisoc_wifi driver is a suspect for latency and drops on
          # this board. Measured off on all four on 2026-09-04 — this makes it stay off
          # across reboots and module reloads rather than relying on it happening to be.
          ACTION=="add", SUBSYSTEM=="net", KERNEL=="wlan*", RUN+="/usr/bin/env iw dev %k set power_save off"
      notify: reload udev rules

    - name: Stop NetworkManager re-enabling power save on reconnect
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/00-wifi-powersave-off.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/wifi-watchdog.yml).
          # 2 = disable. NM re-applies its powersave setting on every activation, so a
          # value set once with `iw` does not survive a reconnect. -3 and -4 already
          # read 2 on 2026-09-04; this makes that true on all four and keeps it true.
          [connection]
          wifi.powersave = 2
      when: wifi_pre.stdout is search('nm_present=yes')
      notify: reload NetworkManager

    # ---- 2. somewhere for the metrics to land -------------------------------
    # ORDER MATTERS AND IS ONE-WAY. The directory must exist before node_exporter is
    # pointed at it: a textfile collector aimed at a missing directory logs a read
    # error on EVERY scrape, and permanent low-grade exporter noise is how §3.15's
    # 19-day crashloop went unexamined. Same ordering rule as
    # playbooks/node-exporter.yml on the cluster nodes.
    - name: Create the node_exporter textfile collector directory
      ansible.builtin.file:
        path: "{{ wifi_watchdog_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Enabling the flag is deliberately NOT done blind. node_exporter's unit name and
    # argument plumbing differ between the Debian package (prometheus-node-exporter,
    # /etc/default/...) and Arch. This probes and REPORTS rather than guessing at
    # ExecStart surgery on a running exporter; the flag is a separate, small follow-up
    # once the shape is known. The script writes the .prom file regardless — a file
    # nothing reads yet costs nothing and means no second visit to the script.
    - name: Determine how node_exporter is configured on this host
      ansible.builtin.shell: |
        set -o pipefail
        for u in prometheus-node-exporter node_exporter node-exporter; do
          st=$(systemctl is-active "$u" 2>/dev/null)
          [ "$st" = "active" ] && { echo "unit=$u"; break; }
        done
        echo "default_file=$([ -f /etc/default/prometheus-node-exporter ] && echo yes || echo no)"
        echo "textfile_flag=$(systemctl show -p ExecStart --value prometheus-node-exporter node_exporter 2>/dev/null | grep -c 'collector.textfile.directory')"
      args:
        executable: /bin/bash
      register: nodeexp
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report the node_exporter textfile situation
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ nodeexp.stdout_lines | default([]) | join(' | ') }}
          — directory created; if textfile_flag=0 the exporter is NOT yet reading it and
          the metrics exist on disk only. That is the follow-up, not a failure here.

    # ---- 3. the watchdog itself ---------------------------------------------
    - name: Install the watchdog script
      ansible.builtin.template:
        src: ../templates/wifi-watchdog.sh.j2
        dest: /usr/local/sbin/wifi-watchdog.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install the watchdog service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/wifi-watchdog.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/wifi-watchdog.yml) — see the play header.
          [Unit]
          Description=Check the WiFi link, reconnect, and reboot as a capped last resort
          Documentation=file:///usr/local/sbin/wifi-watchdog.sh
          # Deliberately NOT After=network-online.target: the whole point is to run
          # when the network is NOT up.
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/wifi-watchdog.sh
          # The script handles its own failure modes and always exits 0; a non-zero
          # exit here would only mean the script itself broke.
          TimeoutStartSec=120
      notify: reload systemd for wifi-watchdog

    - name: Install the watchdog timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/wifi-watchdog.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/wifi-watchdog.yml).
          # OnBootSec gives WiFi association a chance before the first judgement —
          # checking at t=0 would count a normal boot as an outage and start the
          # down-timer against it.
          [Unit]
          Description=Run the WiFi watchdog periodically
          [Timer]
          OnBootSec=3min
          OnUnitActiveSec={{ wifi_watchdog_interval }}
          AccuracySec=15s
          Unit=wifi-watchdog.service
          [Install]
          WantedBy=timers.target
      notify: reload systemd for wifi-watchdog

    - name: Flush handlers so systemd sees the units before we enable them
      ansible.builtin.meta: flush_handlers

    # Guarded on check mode: under --check the unit files above are reported as
    # `changed` without being written, so enabling would fail on a unit that does not
    # exist — the copy-then-enable cascade fixed across five playbooks on 2026-09-02.
    - name: Enable and start the watchdog timer
      ansible.builtin.systemd:
        name: wifi-watchdog.timer
        enabled: true
        state: started
      when: not ansible_check_mode

    # ---- 4. prove it does something -----------------------------------------
    - name: Run the watchdog once and capture its output
      ansible.builtin.command: /usr/local/sbin/wifi-watchdog.sh
      register: first_run
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Read back what the first run wrote
      ansible.builtin.shell: |
        set -o pipefail
        f={{ wifi_watchdog_textfile_dir }}/wifi_watchdog.prom
        if [ -f "$f" ]; then
          grep -E '^lab_wifi_watchdog_(up|associated|reconnect_total|reboots_24h) ' "$f" | tr '\n' ' '
          grep -E '^lab_wifi_watchdog_info' "$f"
        else
          echo "NO METRICS FILE WRITTEN"
        fi
      args:
        executable: /bin/bash
      register: metrics_after
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Confirm the watchdog ran and reported the link as up
      ansible.builtin.assert:
        that:
          - metrics_after.stdout is search('lab_wifi_watchdog_up 1')
        fail_msg: >-
          {{ inventory_hostname }}: the watchdog ran but did not report the link up —
          {{ metrics_after.stdout | default('no output') | trim }}.
          Either the gateway {{ wifi_watchdog_gateway }} is wrong for this host, or the
          link really is down. Check `journalctl -t wifi-watchdog -n 20`.
        success_msg: >-
          {{ inventory_hostname }}: {{ metrics_after.stdout | default('') | trim }}
      when:
        - not ansible_check_mode
        - metrics_after.stdout is defined

    - name: Show the timer is armed
      ansible.builtin.command: systemctl list-timers wifi-watchdog --no-pager
      register: timer_state
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ (timer_state.stdout_lines | default([]))[1] | default('timer state unknown') }}
      when: not ansible_check_mode

  handlers:
    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true
      failed_when: false

    - name: reload NetworkManager
      # reload, NOT restart: restarting NM on a WiFi-only host drops the link this
      # play is reached over. Reload re-reads conf.d without touching the connection.
      ansible.builtin.command: nmcli general reload
      changed_when: true
      failed_when: false

    - name: reload systemd for wifi-watchdog
      ansible.builtin.systemd:
        daemon_reload: true
