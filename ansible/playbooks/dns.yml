---
# DNS for the lab.
# Primary (dns-1, octopi, Raspbian Buster): dnsmasq — lab zone + upstream forwarding
# Secondary (dns-2, opi-zero2w-1, Arch ARM): dnsmasq — same config, redundancy
#
# Pi-hole path preserved for future use once octopi is upgraded to Bookworm.
# dns_engine auto-selects to 'dnsmasq' for non-apt hosts; override per-host in inventory.
- name: DNS — lab resolver
  hosts: dns
  become: true
  vars:
    vault_addr: "http://192.168.1.128:8200"
    # BACKLOG §2.1 — this used to be:
    #   pihole_web_password_hash: ""   # double-sha256; source from Vault
    # set to empty, never overridden anywhere in the repo, so it always rendered
    # empty and both Pi-hole hosts deployed with no admin authentication.
    #
    # The variable's whole contract was also wrong, which is why "just source it
    # from Vault" would not have fixed this. Double-sha256 is Pi-hole *v5*'s
    # scheme (WEBPASSWORD in setupVars.conf). v6 stores a BALLOON-SHA256 hash at
    # webserver.api.pwhash, and webserver.api.password — the key the template was
    # writing — is the *plaintext* setup field. Filling the old variable in would
    # have set the admin password to the literal text of a v5 hash, and looked fixed.
    #
    # The hash is now read from Vault at render time. Generate it on a Pi-hole host
    # with `pihole setpassword <password>` and copy the resulting pwhash value out
    # of /etc/pihole/pihole.toml into Vault — the plaintext never needs to be stored.

  pre_tasks:
    # Auto-select engine based on OS package manager if not set in inventory
    - name: Set dns_engine from OS family if not already set
      ansible.builtin.set_fact:
        dns_engine: "{{ 'dnsmasq' if ansible_pkg_mgr in ['pacman', 'portage', 'zypper'] else 'pihole' }}"
      when: dns_engine is not defined

    # ---- Pi-hole admin credential (BACKLOG §2.1) -----------------------------
    # Only demanded when a Pi-hole host is actually in this run, so a dnsmasq-only
    # run (--limit dns-2, dns-4) still works with no Vault token. Evaluated after
    # the set_fact above, so every host's dns_engine is settled by now.
    - name: Determine whether any host in this run uses Pi-hole
      ansible.builtin.set_fact:
        pihole_in_run: >-
          {{ ansible_play_hosts
             | map('extract', hostvars, 'dns_engine')
             | select('defined')
             | select('equalto', 'pihole')
             | list | count > 0 }}
      run_once: true

    # The Vault read below carries no_log, which hides the *error* as well as the
    # secret — an expired token otherwise surfaces only as "censored due to
    # no_log". These checks print no secret values and give a one-line diagnosis.
    # Same shape as backup-offsite.yml, deliberately.
    - name: Preflight — VAULT_TOKEN must be set to configure Pi-hole
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          VAULT_TOKEN is empty and this run includes a Pi-hole host. Pass a current
          token: VAULT_TOKEN=<token> ansible-playbook -i inventory/hosts.yml
          playbooks/dns.yml
          Need one? docs/OPS.md -> "Get a Vault admin token".
        quiet: true
      when: pihole_in_run | bool
      run_once: true

    # The resolvers have no vault CLI; h4-core does. Read-only, so check_mode:
    # false — otherwise --check skips it and every assertion below is vacuous.
    - name: Read Pi-hole admin password hash from Vault
      ansible.builtin.shell:
        cmd: vault kv get -format=json secret/lab/pihole
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_pihole_raw
      delegate_to: h4-core
      run_once: true
      no_log: true
      changed_when: false
      check_mode: false
      when: pihole_in_run | bool

    - name: Set the Pi-hole pwhash fact
      ansible.builtin.set_fact:
        pihole_web_pwhash: "{{ (vault_pihole_raw.stdout | from_json).data.data['web-pwhash'] }}"
      no_log: true
      run_once: true
      when: pihole_in_run | bool

    # An empty or malformed hash renders an unauthenticated admin UI, which is the
    # exact condition §2.1 records. Checking the shape rather than merely "is
    # defined" is the point: the previous variable was always defined and always
    # empty. The prefix is FTL's own algorithm marker, so it cannot be produced by
    # a v5 hash, a plaintext password, or an empty string.
    - name: Assert the Pi-hole hash is a v6 BALLOON-SHA256 hash, not empty or v5
      ansible.builtin.assert:
        that:
          - pihole_web_pwhash is defined
          - pihole_web_pwhash | length > 0
          - pihole_web_pwhash.startswith('$BALLOON-SHA256$')
        fail_msg: >-
          secret/lab/pihole web-pwhash is missing, empty, or not a v6 hash.
          Generate it on a Pi-hole host with `pihole setpassword <password>`, then
          copy webserver.api.pwhash out of /etc/pihole/pihole.toml into Vault.
          Refusing to render a Pi-hole config with no admin authentication.
        success_msg: "Pi-hole admin hash present and well-formed"
        quiet: true
      when: pihole_in_run | bool
      run_once: true

    # ---- Fix broken apt sources on EOL Raspbian/Debian Buster ----
    # Use distribution_release (not distribution name) — Ansible may report 'Debian' for Raspbian
    - name: (buster) remove dead raspbian.raspberrypi.org source from sources.list
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: 'raspbian\.raspberrypi\.org'
        state: absent
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution_release == 'buster'

    - name: (buster) point Debian packages at archive.debian.org (trusted — keys not in old keyring)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/debian-buster-archive.list
        content: |
          # Buster is EOL — use Debian archive mirror
          # [trusted=yes] required: old Raspbian keyring lacks the Debian archive signing keys
          deb [trusted=yes] http://archive.debian.org/debian buster main contrib non-free
          deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main contrib non-free
        mode: "0644"
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution_release == 'buster'

    - name: (buster) suppress valid-until errors for archived repo
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99ignore-valid-until
        content: |
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
        mode: "0644"
      when:
        - ansible_os_family == 'Debian'
        - ansible_distribution_release == 'buster'

    - name: apt update (apt-based hosts only)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      when: ansible_pkg_mgr == 'apt'

    # ---- Arch: ensure dnsmasq is installed via pacman ----
    - name: (arch) install dnsmasq
      community.general.pacman:
        name: dnsmasq
        state: present
        update_cache: true
      when: ansible_pkg_mgr == 'pacman'

    # ---- Free port 53: disable systemd-resolved stub listener if active ----
    - name: Check if systemd-resolved is active
      ansible.builtin.command: systemctl is-active systemd-resolved
      register: resolved_status
      changed_when: false
      failed_when: false
      # Read-only probe; the stub-listener disable below keys off this stdout.
      check_mode: false

    - name: Disable systemd-resolved stub listener (frees port 53 for dnsmasq)
      ansible.builtin.ini_file:
        path: /etc/systemd/resolved.conf
        section: Resolve
        option: DNSStubListener
        value: "no"
        mode: "0644"
      when: resolved_status.stdout == 'active'
      notify: restart systemd-resolved

    - name: (pihole) remove orphaned dnsmasq lab-zone drop-in (FTL reads /etc/dnsmasq.d)
      ansible.builtin.file:
        path: /etc/dnsmasq.d/10-lab-zone.conf
        state: absent
      when: dns_engine == 'pihole'
      notify: restart pihole

    - name: Flush handlers before starting dnsmasq (ensure port 53 is free)
      ansible.builtin.meta: flush_handlers

  tasks:
    # ================================================================
    # Pi-hole path (Debian Bullseye+ / Ubuntu / Raspberry Pi OS Bookworm)
    # ================================================================
    - name: (pihole) stop and disable standalone dnsmasq if running (conflicts with FTL on port 53)
      ansible.builtin.systemd:
        name: dnsmasq
        state: stopped
        enabled: false
      when: dns_engine == 'pihole'
      failed_when: false   # service may not be installed

    - name: (pihole) remove bare-dnsmasq lab zone drop-in (FTL also reads /etc/dnsmasq.d)
      ansible.builtin.file:
        path: /etc/dnsmasq.d/10-lab-zone.conf
        state: absent
      when: dns_engine == 'pihole'
      notify: restart pihole

    - name: (pihole) ensure group
      ansible.builtin.group:
        name: pihole
        state: present
      when: dns_engine == 'pihole'

    - name: (pihole) ensure user
      ansible.builtin.user:
        name: pihole
        group: pihole
        shell: /usr/sbin/nologin
        home: /var/lib/pihole
        system: true
      when: dns_engine == 'pihole'

    - name: (pihole) config dir
      ansible.builtin.file:
        path: /etc/pihole
        state: directory
        owner: pihole
        group: pihole
        # 0755, not 0775. A --check against rpi4b on 2026-08-28 reported this as
        # `changed`: the live directory is 0755 and the playbook wanted to add group
        # write. Nothing needs it — /etc/pihole is owned by pihole (uid 995), which is
        # the only account that writes there. The host was stricter than git, so git
        # was corrected rather than the host. Drift caught by a dry run is the cheap
        # kind; a real run would have widened it and reported success.
        mode: "0755"
      when: dns_engine == 'pihole'

    # BACKLOG §2.1, template-overwrite hazard — found 2026-08-28.
    #
    # This task's name says "on a fresh host" and it ran on EVERY run, rendering a
    # ~30-line template over whatever was there. On dns-3 (rpi4b, 192.168.1.116) the
    # live file is 70,528 bytes — written by FTL and the web UI since July, including
    # `webserver.api.app_pwhash` — because that host was added to the inventory on
    # 2026-07-27 and, as the inventory comment says, no playbook ever touched it.
    #
    # A run would not have changed a password. It would have wiped the configuration
    # of a live resolver, at whatever hour someone happened to run dns.yml.
    #
    # `force: false` makes the task's name true: seed a fresh host, never overwrite an
    # existing file. The accepted cost is the §4.8 failure mode — a file that never
    # self-corrects — which is why the check below exists. Silently diverging is not
    # better than overwriting; it is the same fault one step later (§3.11). So the
    # play reports the divergence instead of either ignoring or "fixing" it.
    - name: (pihole) seed pihole.toml on a fresh host only (never overwrite a live one)
      ansible.builtin.template:
        src: ../templates/pihole.toml.j2
        dest: /etc/pihole/pihole.toml
        owner: pihole
        group: pihole
        mode: "0644"
        force: false
      when: dns_engine == 'pihole'
      notify: restart pihole

    # Read the artifact FTL actually loads, not the template we would have written.
    # Two facts, because these are the two that have caused outages here:
    #   wildcard — §6.1 / §4.11: `*.apps` pointing at 192.168.1.160 instead of the
    #              ingress VIP took down every service URL in the lab. Finding .160
    #              on the wildcard is the fault, not the fix.
    #   pwhash   — §2.1: an empty value is an unauthenticated admin UI on the lab's
    #              load-bearing resolver.
    # check_mode: false because it is read-only and must run under --check, or the
    # assertion below reports success having inspected nothing.
    - name: (pihole) read the live config's load-bearing facts
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          f=/etc/pihole/pihole.toml
          echo "wildcard=$(grep -c 'address=/apps\.{{ lab_domain }}/{{ ingress_vip }}' "$f" || true)"
          echo "stale160=$(grep -c 'address=/apps\.{{ lab_domain }}/192\.168\.1\.160' "$f" || true)"
          echo "pwhash=$(sed -n 's/^[[:space:]]*pwhash = "\([^"]*\)".*/\1/p' "$f" | tr -d '\n' | wc -c)"
      register: pihole_live_facts
      changed_when: false
      check_mode: false
      when: dns_engine == 'pihole'

    - name: (pihole) assert the live config still says what it must
      ansible.builtin.assert:
        that:
          - "'wildcard=1' in pihole_live_facts.stdout"
          - "'stale160=0' in pihole_live_facts.stdout"
          - "'pwhash=0' not in pihole_live_facts.stdout"
        fail_msg: >-
          {{ inventory_hostname }}'s live /etc/pihole/pihole.toml has drifted from what
          this playbook guarantees: {{ pihole_live_facts.stdout_lines | join(', ') }}.
          wildcard=0 or stale160=1 means *.apps.{{ lab_domain }} is not answering
          {{ ingress_vip }} — see BACKLOG §6.1, the single A record whose loss took down
          every service URL in the lab. pwhash=0 means the admin UI has no password
          (§2.1). This file is no longer templated, so fix it on the host with
          `pihole-FTL --config <key> <value>` and re-run — do NOT delete the file to
          force a re-render, which would discard the rest of the live configuration.
        success_msg: >-
          {{ inventory_hostname }}: wildcard -> {{ ingress_vip }}, admin password set
        quiet: true
      when: dns_engine == 'pihole'

    - name: (pihole) unattended install (idempotent — skipped once FTL exists)
      ansible.builtin.shell:
        cmd: "curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended"
        creates: /etc/systemd/system/pihole-FTL.service
      when: dns_engine == 'pihole'
      register: pihole_install

    - name: (pihole) refresh gravity (blocklists)
      ansible.builtin.command: pihole -g
      when: dns_engine == 'pihole'
      changed_when: false

    - name: (pihole) stage client-scoping SQL
      ansible.builtin.template:
        src: ../templates/pihole-clients.sql.j2
        dest: /etc/pihole/lab-clients.sql
        owner: pihole
        group: pihole
        # 0640, not 0644. Same 2026-08-28 --check: the live file is 0640, and the diff
        # showed mode only, so the content already matched. This file enumerates the
        # lab's clients by name and address — not a secret, but there is no reason for
        # it to be world-readable, and the host had it right.
        mode: "0640"
      when: dns_engine == 'pihole'
      register: lab_clients_sql

    - name: (pihole) apply client scoping to gravity.db
      ansible.builtin.shell: 'pihole-FTL sqlite3 /etc/pihole/gravity.db ".read /etc/pihole/lab-clients.sql"'
      when:
        - dns_engine == 'pihole'
        - lab_clients_sql.changed or pihole_install.changed
      notify: restart pihole

    # ================================================================
    # Bare dnsmasq path (Arch, Raspbian Buster, any non-apt host)
    # ================================================================
    - name: (dnsmasq) install dnsmasq on apt-based hosts
      ansible.builtin.apt:
        name: dnsmasq
        state: present
      when:
        - dns_engine == 'dnsmasq'
        - ansible_pkg_mgr == 'apt'

    - name: (dnsmasq) ensure /etc/dnsmasq.d exists
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        mode: "0755"
      when: dns_engine == 'dnsmasq'

    - name: (dnsmasq/arch) enable conf-dir in dnsmasq.conf (commented out by default on Arch)
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^#?conf-dir=/etc/dnsmasq\.d'
        line: 'conf-dir=/etc/dnsmasq.d/,*.conf'
      when:
        - dns_engine == 'dnsmasq'
        - ansible_pkg_mgr == 'pacman'
      notify: restart dnsmasq

    - name: (dnsmasq) deploy lab zone drop-in
      ansible.builtin.template:
        src: ../templates/lab-zone.conf.j2
        dest: /etc/dnsmasq.d/10-lab-zone.conf
        mode: "0644"
      when: dns_engine == 'dnsmasq'
      notify: restart dnsmasq

    - name: (dnsmasq) enable and start dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        enabled: true
        state: started
      when: dns_engine == 'dnsmasq'

  handlers:
    - name: restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted

    - name: restart pihole
      ansible.builtin.service:
        name: pihole-FTL
        state: restarted

    - name: restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
