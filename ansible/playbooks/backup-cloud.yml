---
# Daily cloud backup of critical cluster state to Cloudflare R2 (free tier, 10 GB).
#
# What gets backed up (all small, total well under 2 GB):
#   - k3s etcd snapshots           (/mnt/cold-8t/k3s-etcd-snapshots)
#   - lldap database snapshots     (/mnt/cold-8t/lldap-snapshots)
#   - Vault raft snapshots         (/mnt/cold-8t/vault-snapshots, if present)
#   - Postgres dumps               (Authelia, Immich, Semaphore — via kubectl exec)
#   - OpenTofu state               (tofu-state bucket in MinIO — aws s3 cp via S3 API)
#
# Prerequisites:
#   1. Create R2 bucket named 'homelab-backup' in the Cloudflare dashboard.
#   2. Create an R2 API token with Object Read & Write on that bucket.
#   3. Store credentials in Vault (one-time, already done):
#        vault kv put secret/lab/cloudflare-r2 \
#          account-id=<CF_ACCOUNT_ID> \
#          access-key-id=<R2_KEY_ID> \
#          secret-access-key=<R2_SECRET> \
#          restic-password=<GENERATED_PASSWORD>
#
# Running this playbook requires a Vault token with read on secret/lab/cloudflare-r2.
# Pass via Semaphore environment variable VAULT_TOKEN, or:
#   VAULT_TOKEN=hvs.xxx ansible-playbook ansible/playbooks/backup-cloud.yml

- name: Configure cloud backup of critical cluster state to Cloudflare R2
  hosts: microshift
  become: true
  vars:
    vault_addr: "http://192.168.1.128:8200"
    cloud_env_file: /etc/restic/cloud.env
    cloud_password_file: /etc/restic/cloud-password
    backup_script: /usr/local/bin/backup-cloud.sh

  tasks:
    - name: Ensure awscli is installed (needed for MinIO tofu-state copy)
      ansible.builtin.apt:
        name: awscli
        state: present
        update_cache: false

    - name: Ensure /etc/restic exists
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        mode: "0700"
        owner: root
        group: root

    # ---- Preflight -----------------------------------------------------------
    # Added 2026-07-25. The Vault reads below carry `no_log: true`, which hides the
    # *error* as well as the secret — so an expired token surfaces only as
    # "censored due to no_log", with no indication of the cause. These three checks
    # print no secret values and turn that into a one-line diagnosis.
    - name: Preflight — VAULT_TOKEN must be set
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          VAULT_TOKEN is empty. Pass a current token:
          VAULT_TOKEN=<token> ansible-playbook -i ansible/inventory/hosts.yml
          ansible/playbooks/backup-cloud.yml
          — if running via Semaphore, check the environment on the task template;
          tokens expire and the stored one may be stale.
        quiet: true

    - name: Preflight — probe Vault reachability and seal status
      ansible.builtin.command:
        cmd: vault status
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
      register: vault_status_probe
      changed_when: false
      failed_when: false
      check_mode: false   # read-only; must run under --check or the assert below is vacuous
      # Deliberately NOT no_log — `vault status` prints no secrets, and censoring
      # this is precisely what made the expired-token failure undiagnosable.

    - name: Preflight — Vault must be reachable and unsealed
      ansible.builtin.assert:
        that:
          - vault_status_probe.rc is defined
          - vault_status_probe.rc == 0
        fail_msg: >-
          Vault at {{ vault_addr }} is not usable — `vault status` returned
          rc={{ vault_status_probe.rc }} (1 = unreachable or CLI error, 2 = sealed).
          If sealed, check vault-unseal.service on rpi5.
          {{ vault_status_probe.stderr | default('') }}
        quiet: true

    - name: Preflight — token must be able to read the R2 secret
      ansible.builtin.shell:
        cmd: vault kv get -field=account-id secret/lab/cloudflare-r2 >/dev/null
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_read_probe
      changed_when: false
      failed_when: false
      check_mode: false   # read-only; must run under --check
      # stdout is redirected to /dev/null, so only error text can be captured here.

    - name: Preflight — report token or permission problems clearly
      ansible.builtin.assert:
        that:
          - vault_read_probe.rc is defined
          - vault_read_probe.rc == 0
        fail_msg: >-
          Could not read secret/lab/cloudflare-r2 (rc={{ vault_read_probe.rc }}).
          Likely an expired/revoked VAULT_TOKEN, a policy without read on that path,
          or the secret not existing. Check with:
          vault token lookup && vault kv list secret/lab
          {{ vault_read_probe.stderr | default('') }}
        quiet: true

    - name: Read R2 credentials from Vault
      ansible.builtin.shell:
        cmd: vault kv get -format=json secret/lab/cloudflare-r2
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_r2_raw
      no_log: true
      changed_when: false
      check_mode: false

    - name: Parse R2 credentials
      ansible.builtin.set_fact:
        r2: "{{ (vault_r2_raw.stdout | from_json).data.data }}"
      no_log: true

    - name: Read MinIO credentials from Vault
      ansible.builtin.shell:
        cmd: vault kv get -format=json secret/lab/minio
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_minio_raw
      no_log: true
      changed_when: false
      check_mode: false

    - name: Parse MinIO credentials
      ansible.builtin.set_fact:
        minio: "{{ (vault_minio_raw.stdout | from_json).data.data }}"
      no_log: true

    - name: Write cloud restic env file
      ansible.builtin.copy:
        dest: "{{ cloud_env_file }}"
        mode: "0600"
        owner: root
        group: root
        content: |
          RESTIC_REPOSITORY=s3:https://{{ r2['account-id'] }}.r2.cloudflarestorage.com/homelab-backup
          AWS_ACCESS_KEY_ID={{ r2['access-key-id'] }}
          AWS_SECRET_ACCESS_KEY={{ r2['secret-access-key'] }}
          RESTIC_PASSWORD_FILE={{ cloud_password_file }}
          MINIO_ROOT_USER={{ minio['root-user'] }}
          MINIO_ROOT_PASSWORD={{ minio['root-password'] }}
      no_log: true

    - name: Write cloud restic password file
      ansible.builtin.copy:
        dest: "{{ cloud_password_file }}"
        mode: "0600"
        owner: root
        group: root
        content: "{{ r2['restic-password'] }}"
      no_log: true

    - name: Install backup-cloud script
      ansible.builtin.copy:
        dest: "{{ backup_script }}"
        mode: "0750"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Daily cloud backup of critical cluster state to Cloudflare R2.
          #
          # ORDERING IS DELIBERATE — read before rearranging.
          #
          # On 2026-07-25 a wedged crash reporter on n150-2 made one pod
          # unreachable. Because this script ran `set -e` with the kubectl-dependent
          # dumps FIRST, a single `kubectl cp` failure aborted the entire run — so
          # the etcd snapshots and the k3s server token, which are plain file copies
          # with no cluster dependency at all and are the most critical items here,
          # never made it offsite. One flaky node cost a full day of cluster-state
          # backups for a reason unrelated to cluster state.
          #
          # Now: dependency-free items are staged FIRST, every cluster-dependent dump
          # is individually non-fatal, the restic backup ALWAYS runs, and the script
          # exits non-zero at the end if anything was missed. A bad node costs you one
          # component and an alert instead of everything.
          #
          # Note the absence of `set -e` — failures are accumulated, not fatal.
          set -uo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # Stable staging path (NOT mktemp, and NOT named TMPDIR — it is passed to
          # restic as a source, so its name lands in the snapshot's path list; a
          # varying name broke retention grouping, and shadowing TMPDIR would point
          # the conventional temp variable at a directory this script rm -rf's).
          STAGE=/var/tmp/backup-cloud-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          chmod 700 "$STAGE"
          trap 'rm -rf "$STAGE"' EXIT

          failures=0
          log()  { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }
          warn() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] WARN: $*" >&2; failures=$((failures + 1)); }

          # ---- Tier 1: no external dependencies. Never blocked by a sick node. ----

          log "Staging k3s server token..."
          if install -m 0600 /var/lib/rancher/k3s/server/token "$STAGE/k3s-server-token"; then
            log "  token staged"
          else
            warn "could not stage /var/lib/rancher/k3s/server/token — etcd snapshots in this backup will be UNRESTORABLE on new hardware"
          fi

          log "Checking etcd snapshots on the cold tier..."
          etcd_count=$(find /mnt/cold-8t/k3s-etcd-snapshots -maxdepth 1 -name 'etcd-snapshot-*' -size +1M 2>/dev/null | wc -l)
          if [ "$etcd_count" -gt 0 ]; then
            log "  $etcd_count snapshot(s) >1M present"
          else
            warn "no etcd snapshots >1M in /mnt/cold-8t/k3s-etcd-snapshots — check backup-etcd.service"
          fi

          # ---- Tier 2: needs the cluster. Each failure is isolated. ----

          dump_pg() {   # namespace  deployment  output-file
            local ns="$1" deploy="$2" out="$3"
            log "Dumping $ns postgres..."
            if kubectl exec -n "$ns" "deploy/$deploy" -- \
                 sh -c 'PGPASSWORD=$POSTGRES_PASSWORD pg_dump -U $POSTGRES_USER $POSTGRES_DB' \
                 | gzip > "$STAGE/$out"; then
              # A dump that is well-formed but EMPTY is more dangerous than a
              # missing one, because it looks fine: an empty pg_dump still gzips to
              # a ~20-byte valid archive that passes both a size test and `gzip -t`.
              # Same failure shape as the 4 KB etcd "snapshots" of July 2026, so
              # check the DECOMPRESSED size, not the file size.
              decompressed=$(gzip -dc "$STAGE/$out" 2>/dev/null | wc -c)
              if gzip -t "$STAGE/$out" 2>/dev/null && [ "$decompressed" -ge 100 ]; then
                log "  $out ok ($(stat -c %s "$STAGE/$out") bytes gz, ${decompressed} raw)"
              else
                rm -f "$STAGE/$out"
                warn "$ns dump was empty or corrupt (${decompressed} bytes decompressed) — discarded"
              fi
            else
              rm -f "$STAGE/$out"
              warn "$ns postgres dump failed"
            fi
          }

          dump_pg authelia  authelia-postgres  authelia.sql.gz
          dump_pg semaphore semaphore-postgres semaphore.sql.gz
          dump_pg immich    immich-postgres    immich.sql.gz

          log "Copying lldap SQLite database..."
          LLDAP_POD=$(kubectl get pod -n lldap -l app=lldap \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -z "$LLDAP_POD" ]; then
            warn "no lldap pod found — skipping"
          elif kubectl cp "lldap/${LLDAP_POD}:/data/users.db" "$STAGE/lldap.db"; then
            log "  lldap.db ok ($(stat -c %s "$STAGE/lldap.db" 2>/dev/null || echo 0) bytes)"
          else
            rm -f "$STAGE/lldap.db"
            warn "lldap copy failed — is its node reachable? (kubectl cp needs apiserver->kubelet on :10250)"
          fi

          log "Copying OpenTofu state from MinIO..."
          mkdir -p "$STAGE/tofu-state"
          if AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
             AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
             aws s3 cp s3://tofu-state/ "$STAGE/tofu-state/" \
               --endpoint-url https://minio.apps.lab.home.arpa \
               --recursive --no-verify-ssl --quiet; then
            log "  tofu-state ok"
          else
            warn "OpenTofu state copy from MinIO failed"
          fi

          # ---- Always back up whatever we managed to gather ----

          SOURCES=(
            /mnt/cold-8t/k3s-etcd-snapshots
            "$STAGE"
          )
          [[ -d /mnt/cold-8t/vault-snapshots ]] && SOURCES+=(/mnt/cold-8t/vault-snapshots)

          log "Running restic backup to R2..."
          if ! restic backup "${SOURCES[@]}" --tag cloud --host h4-core; then
            log "FATAL: restic backup to R2 failed"
            exit 1
          fi

          log "Pruning old cloud snapshots..."
          # --group-by host,tags (not the default host,paths): all cloud snapshots
          # share host+tag, so they form ONE retention series. Belt-and-braces
          # alongside the stable staging path above — if a source path ever varies
          # again, retention still works.
          if ! restic forget --prune --group-by host,tags \
               --keep-daily 7 --keep-weekly 4 --keep-monthly 3; then
            warn "retention pass failed — snapshots will accumulate"
          fi

          if [ "$failures" -gt 0 ]; then
            log "Cloud backup completed with $failures component failure(s) — the backup ran but is INCOMPLETE."
            log "hc-ping will be skipped, so healthchecks.io will alert. See warnings above."
            exit 1
          fi

          log "Cloud backup complete."

    - name: Install backup-cloud systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-cloud.service
        mode: "0644"
        content: |
          [Unit]
          Description=Daily cloud backup of critical cluster state to Cloudflare R2
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          EnvironmentFile={{ cloud_env_file }}
          # Init the remote repo on first run; -/ means failure is non-fatal
          ExecStartPre=-/usr/bin/restic init
          ExecStart={{ backup_script }}
          StandardOutput=journal
          StandardError=journal

    - name: Install backup-cloud systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-cloud.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily cloud backup of critical cluster state (03:00 UTC)

          [Timer]
          OnCalendar=*-*-* 03:00:00
          RandomizedDelaySec=300
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start cloud backup timer
      ansible.builtin.systemd:
        name: backup-cloud.timer
        enabled: true
        state: started
