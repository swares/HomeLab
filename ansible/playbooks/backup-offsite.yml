---
# Offsite (3-2-1) replication of the primary NAS restic repo to Cloudflare R2.
#
# WHY THIS IS A SEPARATE PLAYBOOK
#
# backup.yml configures the local backup tier and must stay runnable without a
# Vault token. This needs one (R2 credentials live in secret/lab/cloudflare-r2),
# so it is split out for the same reason backup-cloud.yml is.
#
# WHAT WAS WRONG BEFORE
#
# backup.yml rendered a backup-offsite unit whose repository variable,
# `offsite_restic_repo`, was defined nowhere in the repo. The unit's inline
# ExecStart handled that by printing "no offsite repo configured; skipping" and
# exiting 0. It therefore ran nightly, copied nothing, and reported success —
# including in `systemctl list-timers` — from the day it was written until
# 2026-08-07. The 203 GiB of NAS data had two copies, both inside one chassis.
#
# SETUP (one time, before the first run)
#
#   1. Create an R2 bucket named `homelab-nas` in the Cloudflare dashboard.
#      Deliberately NOT the `homelab-backup` bucket used by backup-cloud.yml:
#      that one holds small, fast-moving cluster state on a 7d/4w/3m policy,
#      this one holds a large slow archive. Separate buckets keep their
#      lifecycle rules, sizes and blast radius independent.
#   2. Reuse the existing R2 API token if it has read+write on the new bucket;
#      otherwise mint one and update secret/lab/cloudflare-r2.
#   3. Seed the first copy manually — see the note at the bottom of this file.
#
# COST: R2 is $0.015/GB/month beyond the free 10 GB, so ~$3/month at 203 GiB,
# with zero egress fees. Egress being free is the point: a restore must not be
# gated on a bill.
- name: Configure offsite replication of the NAS repo to Cloudflare R2
  hosts: microshift
  become: true
  vars:
    vault_addr: "http://192.168.1.128:8200"

    restic_repo: "{{ cold_primary_mount }}/restic"
    restic_password_file: /etc/restic/password
    offsite_env_file: /etc/restic/offsite.env
    offsite_password_file: /etc/restic/offsite-password
    offsite_r2_bucket: homelab-nas

    # Retention on the offsite copy. Shallower than cold-sec's 14/8/12 — this is
    # the disaster copy, not the long-history archive, and every retained
    # snapshot is billed monthly.
    offsite_keep_daily: 7
    offsite_keep_weekly: 4
    offsite_keep_monthly: 6

    # --- Retention for the lldap dump (BACKLOG §1.12) ------------------------
    # `restic copy` here is unfiltered, so R2 receives BOTH groups from the
    # primary — and the forget below was unscoped, applying the offsite NAS policy
    # to the identity database as well. Third instance of the same defect; the
    # primary and cold-sec are the other two.
    #
    # Depth genuinely costs money here, unlike on the cold disks. It is still the
    # right call at this size: the dump is ~17.5 KiB and dedups against its own
    # near-identical predecessors, so 24 monthly restore points is a rounding error
    # on an R2 bill. Kept identical to the other two repos so there is one lldap
    # retention policy to reason about rather than three.
    lldap_keep_daily: 30
    lldap_keep_weekly: 12
    lldap_keep_monthly: 24

    # Cross-repo coupling — see the fuller note in backup.yml. These must match
    # `--tag lldap --host lldap-k8s` in gitops/workloads/lldap/backup-cronjob.yaml,
    # or lldap snapshots match no forget rule here and are kept forever.
    lldap_snapshot_tag: lldap
    lldap_snapshot_host: lldap-k8s
    nas_snapshot_tag: nas

    # KiB/s, 0 = unlimited. 2500 KiB/s ~= 20 Mbit/s. Set to leave headroom on the
    # uplink; the nightly incremental is small, but the initial seed is not.
    offsite_limit_upload_kib: 2500

    # FALSE IS THE INTENDED STEADY STATE, not a not-yet-seeded placeholder.
    # Corrected 2026-09-19 — the old comment here said "left false until the first
    # copy has been seeded by hand", which stopped being the reason on 2026-08-21.
    #
    # The offsite copy is triggered by `OnSuccess=backup-offsite.service` in
    # backup-nas.service, inside one systemd transaction, at 01:30. The 02:30 timer
    # is a fallback from before that chain existed, and BACKLOG §1.9's follow-up is
    # to remove it. backup.yml:232 already stopped enabling it for that reason.
    #
    # The chain is strictly better: it waits for the primary repo lock however long
    # the nightly takes. The timer cannot — it fires at 02:30 regardless, and a
    # backup-nas run still holding the lock (a large Immich import, per
    # backup-nas.service.j2) fails it with `repository is already locked`. That
    # alerts for a copy which already succeeded an hour earlier.
    #
    # Measured 2026-09-19: the journal shows backup-offsite.service at 01:30:34,
    # 01:30:36 and 01:30:36 on Sep 17, 18 and 19, and NOTHING at 02:30 in 30 days.
    # The chain has been the mechanism for weeks. Set this true only to seed, or
    # while deliberately testing the fallback.
    offsite_timer_enabled: false

  tasks:
    - name: Ensure /etc/restic exists
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        mode: "0700"
        owner: root
        group: root

    # ---- Preflight -----------------------------------------------------------
    # The Vault reads below carry no_log, which hides the *error* as well as the
    # secret — an expired token otherwise surfaces only as "censored due to
    # no_log". These checks print no secret values and give a one-line diagnosis.
    - name: Preflight — VAULT_TOKEN must be set
      ansible.builtin.assert:
        that:
          - lookup('env', 'VAULT_TOKEN') | length > 0
        fail_msg: >-
          VAULT_TOKEN is empty. Pass a current token:
          VAULT_TOKEN=<token> ansible-playbook -i ansible/inventory/hosts.yml
          ansible/playbooks/backup-offsite.yml
          Need one? docs/OPS.md -> "Get a Vault admin token". token-admin is
          allowed to lapse — nothing automated uses it, so an expired one is expected,
          not an incident.
        quiet: true

    - name: Preflight — probe Vault reachability and seal status
      ansible.builtin.command:
        cmd: vault status
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
      register: vault_status_probe
      changed_when: false
      failed_when: false
      check_mode: false   # read-only; must run under --check or the assert is vacuous

    - name: Preflight — Vault must be reachable and unsealed
      ansible.builtin.assert:
        that:
          - vault_status_probe.rc == 0
        fail_msg: >-
          Vault at {{ vault_addr }} is unreachable or sealed.
          {{ vault_status_probe.stderr | default('') }}
        quiet: true

    - name: Preflight — the primary repo must exist before replicating it
      ansible.builtin.stat:
        path: "{{ restic_repo }}/config"
      register: primary_repo
      check_mode: false

    - name: Preflight — fail clearly if the primary repo is absent
      ansible.builtin.assert:
        that:
          - primary_repo.stat.exists
        fail_msg: >-
          No restic repository at {{ restic_repo }}. Run backup.yml first —
          there is nothing to replicate offsite.
        quiet: true

    # ---- Credentials ---------------------------------------------------------
    - name: Read R2 credentials from Vault
      ansible.builtin.shell:
        cmd: vault kv get -format=json secret/lab/cloudflare-r2
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_r2_raw
      no_log: true
      changed_when: false
      check_mode: false

    - name: Parse R2 credentials
      ansible.builtin.set_fact:
        r2: "{{ (vault_r2_raw.stdout | from_json).data.data }}"
      no_log: true

    # The offsite repo reuses the R2 restic password rather than introducing a
    # fourth crown-jewel secret. Same provider, same access keys, same trust
    # boundary — a compromise of one already implies the other. Note that this
    # password is NOT stored in R2, and must exist offline: losing it makes the
    # offsite copy unreadable exactly when it is the only copy left.
    - name: Write offsite restic password file
      ansible.builtin.copy:
        dest: "{{ offsite_password_file }}"
        mode: "0600"
        owner: root
        group: root
        content: "{{ r2['restic-password'] }}"
      no_log: true

    - name: Write offsite restic env file
      ansible.builtin.copy:
        dest: "{{ offsite_env_file }}"
        mode: "0600"
        owner: root
        group: root
        content: |
          RESTIC_REPOSITORY_OFFSITE=s3:https://{{ r2['account-id'] }}.r2.cloudflarestorage.com/{{ offsite_r2_bucket }}
          AWS_ACCESS_KEY_ID={{ r2['access-key-id'] }}
          AWS_SECRET_ACCESS_KEY={{ r2['secret-access-key'] }}
      no_log: true

    # ---- Unit ----------------------------------------------------------------
    - name: Install offsite copy script
      ansible.builtin.template:
        src: ../templates/backup-offsite.sh.j2
        dest: /usr/local/sbin/backup-offsite.sh
        owner: root
        group: root
        mode: "0750"

    - name: Render offsite copy service + timer
      ansible.builtin.template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - backup-offsite.service
        - backup-offsite.timer

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable the offsite timer
      ansible.builtin.systemd:
        name: backup-offsite.timer
        enabled: "{{ offsite_timer_enabled }}"
        state: "{{ 'started' if offsite_timer_enabled else 'stopped' }}"

    # ---- Measure the two things the report used to assume ---------------------
    #
    # ADDED 2026-09-19, and the reason is worth keeping. The report below used to
    # be chosen by `offsite_timer_enabled` — a play default — while its task names
    # and text spoke about SEEDING and about whether any copy was scheduled. Those
    # are three different questions, and the variable answers none of them.
    #
    # So a run with the default printed, verbatim:
    #
    #     "Offsite configured. The timer is DISABLED, so no copy is scheduled."
    #     "The first copy uploads the whole repository ... took ~3 days"
    #
    # against an R2 repository holding 61 snapshots and 203.666 GiB, which had been
    # copied to nineteen hours earlier by the OnSuccess chain. The message was read
    # as evidence the offsite leg was frozen, and an hour went into a nonexistent
    # outage — after which the timer was enabled "to fix it", reintroducing the
    # 02:30 lock race that BACKLOG §1.9 exists to remove.
    #
    # The comment that used to sit here said this exact failure had been FIXED on
    # 2026-08-11 ("two messages, chosen by state"). It had been made conditional on
    # the wrong thing. That is the more instructive version of the bug: a correct
    # diagnosis, a plausible fix, and a predicate nobody re-derived from the system.
    #
    # CLAUDE.md: check the artifact the consumer reads. The consumer of "is the
    # offsite backup working" is the R2 repository and the trigger that writes to
    # it. Both are now read, not inferred.
    - name: Count snapshots in the offsite repository
      ansible.builtin.shell:
        cmd: |
          set -eu
          set -a; . {{ offsite_env_file | quote }}; set +a
          json=$(restic -r "$RESTIC_REPOSITORY_OFFSITE" \
                   --password-file {{ offsite_password_file | quote }} \
                   snapshots --json 2>/dev/null)
          set +e
          printf '%s' "$json" | grep -o '"short_id"' | wc -l
          exit 0
        executable: /bin/bash
      environment:
        RESTIC_CACHE_DIR: /var/cache/restic
      register: offsite_snapshot_probe
      changed_when: false
      failed_when: false
      check_mode: false   # read-only; must run under --check or the report is vacuous

    # `grep -o | wc -l`, never `grep -c`: `snapshots --json` emits the whole array
    # on ONE line, so grep -c answers "1" for any non-empty repo. That exact bug
    # made the first real offsite run report "1 snapshots" when 32 had been kept
    # (backup-offsite.sh.j2:156).
    #
    # stderr is discarded deliberately — it carries the R2 account id in the
    # repository URL. rc alone distinguishes "could not reach the repo" from "the
    # repo is empty", which is the distinction the report needs.

    - name: Read what triggers the offsite copy
      ansible.builtin.command:
        cmd: systemctl show backup-nas.service --property=OnSuccess --value
      register: backup_nas_onsuccess
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Establish offsite facts from the measurements
      ansible.builtin.set_fact:
        offsite_reachable: "{{ offsite_snapshot_probe.rc == 0 }}"
        offsite_snapshot_count: "{{ offsite_snapshot_probe.stdout | default('0') | trim | int }}"
        offsite_chain_present: >-
          {{ 'backup-offsite.service' in (backup_nas_onsuccess.stdout | default('')) }}

    # The chain is load-bearing and silent when absent: backup-nas.service would
    # still succeed nightly, hc-ping would still fire, and the offsite copy would
    # simply stop happening. backup-nas.service.j2:29 says to verify OnSuccess
    # before trusting the chain; nothing did until now.
    #
    # Not fatal when the timer is enabled — then the timer is the trigger and the
    # chain is redundant. Fatal when NEITHER exists, because that is an offsite
    # backup with nothing to start it.
    - name: Something must actually trigger the offsite copy
      ansible.builtin.assert:
        that:
          - offsite_chain_present | bool or offsite_timer_enabled | bool
        fail_msg: >-
          NOTHING TRIGGERS THE OFFSITE COPY. backup-nas.service carries
          OnSuccess='{{ backup_nas_onsuccess.stdout | default("") | trim }}'
          and backup-offsite.timer is disabled. Re-run backup.yml to restore the
          chain, or pass -e offsite_timer_enabled=true to fall back to the 02:30
          timer. See BACKLOG §1.9.
        success_msg: >-
          trigger: {{ 'OnSuccess chain from backup-nas.service (01:30)'
                      if offsite_chain_present | bool
                      else 'backup-offsite.timer (02:30)' }}
        quiet: true
      # DELIBERATELY NOT gated on `not ansible_check_mode`. It was, for one commit,
      # copied from backup.yml's restic-hold assert — where the gate is right, because
      # that play APPLIES the hold and under --check it has not happened yet.
      #
      # Nothing here is like that. `OnSuccess=` and the R2 repository are pre-existing
      # state this play only reads, via two tasks already carrying `check_mode: false`.
      # Gating the assert made `--check` — the mode CLAUDE.md says to run first — silent
      # on the single check this play exists to perform. That is the "a dry run that
      # prints no verification has verified nothing" rule, violated in the commit that
      # added the verification, hours after quoting the rule.
      #
      # The `offsite_timer_enabled` half of the condition reads the VARIABLE, not the
      # host, so it stays true under --check on a run that would enable the timer.

    # ---- Report what was measured, not what was configured --------------------
    - name: Report — offsite repository unreachable
      ansible.builtin.debug:
        msg:
          - "WARNING: could not list snapshots in the offsite repository."
          - "Configuration was applied, but this run could NOT confirm the copy exists."
          - "Check credentials and reachability:"
          - "  sudo systemctl start backup-offsite.service"
          - "  journalctl -u backup-offsite.service -n 40"
      when: not offsite_reachable | bool

    - name: Report — offsite repository reachable but empty
      ansible.builtin.debug:
        msg:
          - "Offsite configured. The repository is reachable and holds NO snapshots."
          - "It has never been seeded. Seed via the unit, not the script — the"
          - "script reads RESTIC_REPOSITORY_OFFSITE and the R2 keys from the"
          - "unit's EnvironmentFile."
          - "  sudo systemctl start --no-block backup-offsite.service"
          - "  journalctl -u backup-offsite.service -f"
          - "The first copy uploads the whole repository. The 2026-08 seed was"
          - "~204 GiB and took ~3 days at 2500 KiB/s."
          - ""
          - "BEFORE SEEDING: stop backup-nas.timer for the duration and raise"
          - "TimeoutStartSec. restic copy locks the SOURCE repo, so a multi-day"
          - "copy starves the nightly backup — it failed four nights running in"
          - "August 2026 for exactly this reason."
      when:
        - offsite_reachable | bool
        - offsite_snapshot_count | int == 0

    - name: Report — offsite copy is seeded and running
      ansible.builtin.debug:
        msg:
          - >-
            Offsite replication is live: {{ offsite_snapshot_count }} snapshots
            in the R2 repository.
          - >-
            Triggered by {{ 'OnSuccess=backup-offsite.service from
            backup-nas.service, ~01:30 nightly, in one systemd transaction'
            if offsite_chain_present | bool else 'backup-offsite.timer at 02:30' }}.
          - >-
            backup-offsite.timer is
            {{ 'ENABLED — a duplicate 02:30 run, and it races the primary repo
            lock (BACKLOG §1.9)' if offsite_timer_enabled | bool
            else 'disabled, which is the intended steady state' }}.
          - "TimeoutStartSec is bounded (4h) so a runaway copy fails and alerts"
          - "rather than silently starving backup-nas at 01:30."
          - ""
          - "Verify:  journalctl -u backup-offsite.service -n 20"
          - "Weekly integrity + recency check runs via backup-verify.service."
      when:
        - offsite_reachable | bool
        - offsite_snapshot_count | int > 0
