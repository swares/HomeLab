---
# Recreate cluster secrets from Ansible Vault after a cluster rebuild.
# Run this immediately after ArgoCD is back up and before starting workloads.
#
# Usage:
#   cd ansible/
#   ansible-playbook -i inventory/hosts.yml playbooks/k8s-secrets.yml \
#     --vault-password-file .vault_pass
#
# Prereqs:
#   - inventory/group_vars/all/secrets.yml must have immich_db_password populated
#   - kubectl must be configured on h4-core (ansible_connection: local)
- name: Recreate k8s secrets from Ansible Vault
  hosts: h4-core
  become: false
  gather_facts: false

  tasks:

    # ── Immich ────────────────────────────────────────────────────────────────
    - name: Create immich namespace (idempotent)
      ansible.builtin.command:
        cmd: kubectl create namespace immich --dry-run=client -o yaml
      register: immich_ns_yaml
      changed_when: false

    - name: Apply immich namespace
      ansible.builtin.shell:
        cmd: >
          kubectl create namespace immich
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true

    # immich-secrets is now owned by external-secrets (ExternalSecret pulls from Vault).
    # Manual creation here would conflict with the ExternalSecret field manager.
    # To seed/update the value: vault kv put secret/lab/immich DB_PASSWORD=<value>
    # - name: Create immich-secrets (DEPRECATED — managed by ExternalSecret)

    # ── Authelia ──────────────────────────────────────────────────────────────
    # Only patches the storage_pg_password key; all other authelia-secrets keys
    # (jwt_secret, session_secret, etc.) are managed separately / at bootstrap.
    - name: Create authelia namespace (idempotent)
      ansible.builtin.shell:
        cmd: >
          kubectl create namespace authelia
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true

    # GUARDED 2026-08-30 (BACKLOG §3.11). This task could NEVER run.
    #
    # `authelia_storage_pg_password` is commented out in
    # inventory/group_vars/all/secrets.yml ("add once generated"), so the template
    # below raised AnsibleUndefinedVariable before the module was ever invoked.
    # `failed_when: false` does not rescue a TEMPLATING error — it is evaluated
    # against a task result that never gets produced — and `no_log: true` censored
    # the message, so the failure arrived with no usable detail.
    #
    # That is the same defect as k3s-registry.yml's `zot_admin_password` (found
    # 2026-08-09): a play referencing a variable defined nowhere, therefore never
    # run, therefore never noticed. This one surfaced because §3.11's drift check
    # runs every playbook on a schedule rather than only when someone needs it.
    #
    # The `when` makes the absence explicit and survivable: after a cluster rebuild
    # this play now completes and TELLS you the secret is missing, instead of dying
    # on a censored error at the last task. Seed it with:
    #
    #   ansible-vault encrypt_string --encrypt-vault-id default \
    #     --stdin-name authelia_storage_pg_password
    #
    - name: WARN when the authelia storage password is not in the vault
      ansible.builtin.debug:
        msg: >-
          WARNING: authelia_storage_pg_password is not defined in
          inventory/group_vars/all/secrets.yml, so authelia-secrets will NOT be
          patched. Authelia will fail to reach its database until this is seeded.
      when: authelia_storage_pg_password is not defined

    - name: Patch storage_pg_password into authelia-secrets
      when: authelia_storage_pg_password is defined
      ansible.builtin.shell:
        cmd: >
          kubectl patch secret authelia-secrets -n authelia
          --type=json
          -p='[{"op":"add","path":"/data/storage_pg_password",
               "value":"{{ authelia_storage_pg_password | b64encode }}"}]'
      no_log: true
      changed_when: true
      failed_when: false   # no-op if secret doesn't exist yet (bootstrapped separately)
