---
# Two backup streams onto the cold tier (8TB primary + 6TB copy), via host systemd timers:
#   - daily 01:30: restic snapshot of live NAS data          (online, no downtime)
#   - daily 00:30: copy of k3s' own etcd snapshots to cold   (online, no downtime)
#
# Cluster *config* is already safe in git (Argo); these cover *data* and *state*.
#
# Note on the etcd stream: k3s takes embedded-etcd snapshots itself and keeps them
# on the NVMe. We do not snapshot — we replicate k3s' output onto the cold mirror
# and verify it. See ansible/templates/backup-etcd.sh.j2 for the full history of
# why this used to be a sqlite3 call and why it silently produced nothing.
- name: Configure backups to the cold tier
  hosts: microshift
  become: true
  vars:
    restic_repo: "{{ cold_primary_mount }}/restic"          # 8TB primary
    restic_password_file: /etc/restic/password   # vaulted; created out of band
    restic_copy_repo: "{{ cold_secondary_mount }}/restic"   # 6TB redundant copy
    # Offsite (3-2-1) is configured by backup-offsite.yml — see the note below.

    # --- k3s etcd snapshot replication ---
    k3s_snapshot_dir: /var/lib/rancher/k3s/server/db/snapshots  # k3s writes here (NVMe)
    etcd_snapshot_dest: "{{ cold_primary_mount }}/k3s-etcd-snapshots"
    etcd_snapshot_keep: 30            # ~15 days at k3s' 12h cadence; ~1 GB at 32 MB each
    etcd_snapshot_min_bytes: 1048576  # 1 MiB — a real snapshot is ~30 MB; 4 KB was the bug
    etcd_snapshot_max_age_seconds: 90000  # 25h, matching the LabBackupEtcdSilent alert

    # --- Retention for the cold-sec copy (M-new-1) ---
    # Deliberately DEEPER than the primary's 7/4/6: cold-sec is the long-history
    # archive, not a mirror. Until 2026-07-25 it was never pruned at all.
    copy_keep_daily: 14
    copy_keep_weekly: 8
    copy_keep_monthly: 12

    # --- Retention for the lldap dump (BACKLOG §1.12) ------------------------
    # Until 2026-08-28 the forget commands in all three repos were UNSCOPED, so
    # the NAS policy was applied to every group in the repository — including
    # lldap's. Nobody chose 7/4/6 for the identity database; it inherited them,
    # and the survivors (one per week beyond the daily window) were misread three
    # separate times as an intermittently failing backup job.
    #
    # These numbers are deliberate. The dump is ~17.5 KiB and changes little, so
    # restic dedup makes depth almost free — the storage economics that justify
    # 7/4/6 on 225 GiB of NAS data simply do not apply here. Two years of monthly
    # restore points for the directory every other service authenticates against
    # costs kilobytes.
    #
    # Same numbers in all three repos, for the same reason: there is no tiering
    # argument at this size.
    lldap_keep_daily: 30
    lldap_keep_weekly: 12
    lldap_keep_monthly: 24

    # The snapshot identity the lldap CronJob writes with. THIS IS A CROSS-REPO
    # COUPLING: gitops/workloads/lldap/backup-cronjob.yaml passes
    # `--tag lldap --host lldap-k8s`. If either changes there and not here, lldap
    # snapshots stop matching any forget rule and are then kept FOREVER — silently,
    # in the repository that is the copy-of-record for the cold tier. backup-verify
    # guards against exactly that; see its unknown-group check.
    lldap_snapshot_tag: lldap
    lldap_snapshot_host: lldap-k8s

    # The NAS side of the same split. Named rather than inlined so the two forget
    # invocations below are visibly symmetric.
    nas_snapshot_tag: nas

    # --- Weekly verification ---
    cloud_env_file: /etc/restic/cloud.env   # written by backup-cloud.yml
    # Written by backup-offsite.yml (separate playbook — it needs a Vault token).
    # Duplicated here so backup-verify.sh can be rendered without running that one.
    # If they ever diverge, backup-offsite.yml is authoritative.
    offsite_env_file: /etc/restic/offsite.env
    offsite_password_file: /etc/restic/offsite-password
    cloud_stage_dir: /var/tmp/backup-cloud-stage  # must match backup-cloud.yml's TMPDIR
    verify_max_snapshot_age_seconds: 172800 # 48h — weekly check, daily backups
  tasks:
    - name: Install restic
      ansible.builtin.package:
        name: restic
        state: present

    # BACKLOG §1.7 — restic was installed with a bare `state: present` and nothing
    # held it, so an unattended `apt upgrade` could move it under the backup path at
    # any time. Crossing 0.14 reverses `restic copy` argument semantics.
    #
    # The copy scripts already guard the version (backup-nas-copy.sh.j2:50-67 and
    # backup-offsite.sh.j2:64-78 parse it and refuse to guess), so the failure mode
    # is a dead backup rather than a reversed one. A dead backup is still the wrong
    # outcome for an upgrade nobody asked for, and it would surface at 01:30.
    #
    # Not pinned to a version string: the available version differs by distro and
    # arch across this fleet, and a pin naming a version the repo does not carry
    # fails the play on hosts that were previously fine. Hold what is installed;
    # move it deliberately.
    - name: Hold restic at the installed version
      ansible.builtin.dpkg_selections:
        name: restic
        selection: hold

    # These two are read-only and must run under --check as well. Ansible skips
    # `command` tasks in check mode, so without `check_mode: false` the report below
    # would assert success on a run that verified nothing — CLAUDE.md, written twice
    # in one day.
    - name: Read installed restic version
      ansible.builtin.command: restic version
      register: restic_installed_version
      changed_when: false
      check_mode: false

    - name: Read dpkg's recorded selection for restic
      ansible.builtin.command: dpkg-query -W -f='${db:Status-Abbrev}' restic
      register: restic_hold_state
      changed_when: false
      check_mode: false

    # Under --check the hold has not been applied yet, so this reports the state as
    # it actually is rather than failing the run. That output is the drift signal
    # §3.11 asks for: a host reporting NOT held is a host the play has never reached.
    - name: Report restic pin state (check mode reports what is, not what would be)
      ansible.builtin.debug:
        msg: >-
          {{ restic_installed_version.stdout_lines[0] | default('restic version unknown') }}
          — dpkg '{{ restic_hold_state.stdout | trim }}'
          ({{ 'held' if restic_hold_state.stdout is match('^h') else 'NOT held; this run would apply the hold' }})
      when: ansible_check_mode

    # The `h` prefix is dpkg's own record of the desired state. `dpkg_selections`
    # reporting `changed` only says the module ran; this says the hold stuck.
    - name: Confirm the hold is recorded in dpkg, not merely requested
      ansible.builtin.assert:
        that:
          - restic_hold_state.stdout is match('^h')
        success_msg: >-
          {{ restic_installed_version.stdout_lines[0] | default('restic') }} held
          (dpkg '{{ restic_hold_state.stdout | trim }}')
        fail_msg: >-
          restic is NOT held (dpkg '{{ restic_hold_state.stdout | default('unknown') | trim }}').
          An unattended apt upgrade can still move it under the backup path.
      when: not ansible_check_mode

    - name: Ensure restic password file dir
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        mode: "0700"

    # --- NAS data backup (restic, daily) ---
    - name: Render restic copy-to-secondary script
      ansible.builtin.template:
        src: ../templates/backup-nas-copy.sh.j2
        dest: /usr/local/sbin/backup-nas-copy.sh
        owner: root
        group: root
        mode: "0750"

    - name: Render restic backup service + timer
      ansible.builtin.template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - backup-nas.service
        - backup-nas.timer

    # --- k3s etcd snapshot replication (daily) ---
    - name: Render etcd snapshot copy script
      ansible.builtin.template:
        src: ../templates/backup-etcd.sh.j2
        dest: /usr/local/sbin/backup-etcd.sh
        owner: root
        group: root
        mode: "0750"

    - name: Render etcd backup service + timer
      ansible.builtin.template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - backup-etcd.service
        - backup-etcd.timer

    # --- Offsite copy (3-2-1) now lives in backup-offsite.yml ---------------
    # It was rendered here against `offsite_restic_repo`, a variable defined
    # nowhere in this repo. The unit's inline ExecStart treated "unset" as
    # "skip, exit 0", so it ran nightly, copied nothing, and reported success
    # from the day it was written until 2026-08-07. It now needs R2 credentials
    # from Vault, which backup.yml deliberately does not require, so it is a
    # separate playbook.

    # --- Weekly verification that the backups are real (not merely running) ---
    - name: Render backup verification script
      ansible.builtin.template:
        src: ../templates/backup-verify.sh.j2
        dest: /usr/local/sbin/backup-verify.sh
        owner: root
        group: root
        mode: "0750"

    - name: Render backup verification service + timer
      ansible.builtin.template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - backup-verify.service
        - backup-verify.timer

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable backup timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - backup-nas.timer
        - backup-etcd.timer
        - backup-offsite.timer
        - backup-verify.timer
