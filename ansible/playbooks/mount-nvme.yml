---
# mount-nvme.yml — Mount the NVMe on the OPi 5 Pro nodes.
#
# Idempotent: safe to re-run.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/mount-nvme.yml \
#     --vault-password-file .vault_pass
#
# THE OLLAMA RELOCATION TASKS WERE REMOVED 2026-08-30 (BACKLOG §3.11).
#
# They described a HOST-level Ollama install that no longer exists. Ollama now runs
# as a k3s workload (gitops/workloads/ai-backends/ollama.yaml, image
# ollama/ollama:0.32.1) and its models live in a local-volume PV on this same NVMe:
#
#     /mnt/nvme/pvc-c749f4b8-...-0e1cd4512570_ai-gateway_ollama-models
#
# Measured on opi5pro-1, 2026-08-30: no `ollama` user, `systemctl is-active ollama`
# returns inactive, and /mnt/nvme/ollama/models does not exist. The play was creating
# a directory owned by a user that does not exist and then symlinking to a path
# nothing writes.
#
# HOW IT WAS FOUND, because the mechanism matters more than the tasks:
# §3.11's drift check reported mount-nvme as CHECK FAILED. Under --check the
# `file: state=directory` task reports `changed` without creating anything, so the
# following `state: link` task failed on a missing src — a check-mode cascade, the
# same class as github-runner.yml's get_url -> unarchive. That failure was masking a
# reported `changed=3` / `changed=2` on the two nodes, which the drift metric was
# correctly refusing to count as drift.
#
# The NVMe mount below is real and load-bearing: nvme0n1p1 (476.9 GB, ext4) carries
# both /mnt/nvme and the kubelet's local-volume PVs. Only the Ollama half was dead.
#
# This play also owns the node's SWAP POLICY (added 2026-08-30) — because the
# swapfile in question physically lives on this filesystem and its fstab record sits
# beside the one managed here. Keeping it in this play also means the weekly §3.11
# drift check watches it immediately, with no change to drift_playbooks.

- name: Mount NVMe on the OPi 5 Pro nodes
  hosts: opi5pro-1,opi5pro-2
  become: true
  gather_facts: true
  # One node at a time. Both are k3s agents and both carry local-volume PVs on the
  # filesystem this play remounts. Ansible's default parallelism would touch the
  # storage under every AI workload in the lab simultaneously.
  serial: 1

  vars:
    nvme_device: /dev/nvme0n1p1
    nvme_mount: /mnt/nvme
    # Swap policy — see the block at the end of this play.
    nvme_swapfile: /mnt/nvme/swapfile
    zram_service: orangepi-zram-config.service
    zram_swap_priority: 5

  tasks:
    # MODE IS 0700, NOT 0755 — corrected 2026-08-30 (BACKLOG §3.11).
    #
    # This task runs against a path that is ALREADY MOUNTED, so `file:` stats the
    # root of the mounted ext4 filesystem, not the underlying mount point. Setting
    # 0755 here does not "create a directory with sane permissions"; it chmods live
    # storage.
    #
    # Measured on both nodes 2026-08-30: /mnt/nvme is 0700 root:root, and it contains
    # a Kubernetes local-volume PV directory that is 0777, plus an 8 GiB swapfile.
    # Going to 0755 would hand every local user the traverse bit into a world-writable
    # directory holding the Ollama model store. kubelet runs as root and needs nothing
    # widened. The hosts were right and the playbook was wrong.
    - name: Ensure mount point exists
      ansible.builtin.file:
        path: "{{ nvme_mount }}"
        state: directory
        mode: '0700'

    # ---- fstab identity -------------------------------------------------------
    # Resolved at run time because the two nodes have DIFFERENT filesystem UUIDs, so
    # no single value can be written into this file. blkid is read-only and carries
    # check_mode: false — a guard that skips under --check leaves the task below
    # building an fstab line from an undefined variable.
    - name: Read the NVMe filesystem UUID
      ansible.builtin.command: "blkid -s UUID -o value {{ nvme_device }}"
      register: nvme_uuid
      changed_when: false
      failed_when: false
      check_mode: false

    # Empty output is not a finding until you prove the check can speak (CLAUDE.md).
    # A blank stdout here would silently write `UUID=` into fstab — a line that can
    # never mount. Assert on the shape, not on the exit code alone.
    - name: Verify a real UUID came back before writing it to fstab
      ansible.builtin.assert:
        that:
          - nvme_uuid.rc == 0
          - nvme_uuid.stdout | trim | length == 36
        fail_msg: >-
          blkid returned no usable UUID for {{ nvme_device }} on {{ inventory_hostname }}
          (rc={{ nvme_uuid.rc }}, stdout={{ nvme_uuid.stdout | trim | default('<empty>', true) }}).
          NOTE the boolean arg: `default('<empty>')` alone substitutes only for UNDEFINED,
          and an empty string is defined — so this message would print `stdout=` in the
          one case it exists to describe.
          Refusing to write an fstab entry that cannot mount.
        success_msg: "{{ inventory_hostname }}: {{ nvme_device }} is UUID={{ nvme_uuid.stdout | trim }}"

    # OPTIONS ARE THE UNION OF WHAT THE TWO HOSTS ALREADY HAD — 2026-08-30, §3.11.
    #
    # The drift check reported this task changed on opi5pro-1 and ok on opi5pro-2.
    # Neither host was wrong; each was right about something the other was missing,
    # and the playbook was worse than both:
    #
    #   opi5pro-1   UUID=2c528788-… ext4 defaults,nofail  0 2
    #   opi5pro-2   /dev/nvme0n1p1  ext4 defaults,noatime 0 0
    #   playbook    /dev/nvme0n1p1  ext4 defaults,noatime 0 0   (was)
    #
    #   UUID    — survives device renaming/reordering. opi5pro-1 had it.
    #   nofail  — WITHOUT THIS, a dead or renamed NVMe drops a headless SBC into an
    #             emergency shell at boot, with no console attached to answer it.
    #             opi5pro-1 had it; applying the old playbook would have REMOVED it.
    #   noatime — fewer writes on flash, and this filesystem backs a model store that
    #             is read constantly. opi5pro-2 had it.
    #   passno 2 — fsck at boot on a filesystem holding Kubernetes PVs. opi5pro-1 had it.
    #
    # This is the third case this session where `lab_ansible_drift > 0` meant git was
    # wrong rather than the host (see also mqtt.yml, github-runner.yml). "Drift is
    # non-zero" is a prompt to look, never a licence to apply.
    #
    # APPLYING THIS DOES `mount -o remount` ON A LIVE FILESYSTEM. remount changes
    # options in place — it does not unmount, so kubelet's bind mounts into running
    # pods and opi5pro-2's active swapfile are undisturbed. That is still a real
    # operation on the storage under the AI workloads: run it deliberately, and the
    # `serial: 1` above means one node at a time.
    - name: Mount NVMe (persistent via fstab)
      ansible.posix.mount:
        path: "{{ nvme_mount }}"
        src: "UUID={{ nvme_uuid.stdout | trim }}"
        fstype: ext4
        opts: defaults,nofail,noatime
        passno: "2"
        dump: "0"
        state: mounted

    # =========================================================================
    # SWAP POLICY: zram only, never the NVMe. Added 2026-08-30, BACKLOG §3.11.
    #
    # These two nodes are provisioned for the same role and had OPPOSITE swap
    # configurations, measured 2026-08-30:
    #
    #   opi5pro-1   /dev/zram0          partition 7.8G     0B  PRIO  5
    #   opi5pro-2   /mnt/nvme/swapfile  file      8.0G  867.3M PRIO -2
    #
    # An identical 8 GiB swapfile dated Jun 29 00:14 exists on BOTH, and only
    # opi5pro-2 ever wired it into fstab. On opi5pro-1 it is dead space on the
    # partition serving the Ollama model PV.
    #
    # CAUSE IDENTIFIED 2026-08-30 (this comment first said "provisioning", which was a
    # guess): ansible/roles/zswap/ — an orphan role invoked by no playbook, deleted in
    # the same change that added this block. It created the swapfile with
    # `dd`+`mkswap`, added the fstab record via `posix.mount fstype=swap`, deployed
    # zswap-config.service, and ran `swapoff /dev/zram0` under `zswap_disable_zram`.
    # Its own defaults name these boards: "Set true on hosts that use zram for swap
    # (OPi 5 Pros)". Every symptom found here traces to one manual run of that role.
    #
    # WHY THE SWAPFILE LOSES ON EVERY AXIS:
    #   - It wears flash on the SAME PARTITION that serves the ollama-models
    #     local-volume PV, and contends with model reads for the same device.
    #   - vm.swappiness is 100 on both nodes. That is the Orange Pi image default and
    #     it is a sensible number FOR ZRAM, where paging is compression, not IO.
    #     Pointed at a file on flash it is simply aggressive flash writing. This is
    #     the whole mechanism behind 867 MB being paged out on a node reporting
    #     14 Gi available — there was no memory pressure at all.
    #   - Kubernetes' own default is NoSwap. Having NO swap is a perfectly good
    #     end state here; zram is the bonus, not the requirement.
    #
    # ORDERING IS DELIBERATE: fstab entry removed BEFORE swapoff, so an interrupted
    # run leaves a node that comes back WITHOUT the swapfile rather than with it.
    # =========================================================================

    - name: Read current swap devices
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read bytes currently paged out to the NVMe swapfile
      ansible.builtin.shell: >-
        set -o pipefail;
        swapon --show=NAME,USED --noheadings --bytes
        | awk '$1 == "{{ nvme_swapfile }}" { print $2 }'
      args:
        executable: /bin/bash
      register: nvme_swap_used
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read available memory
      ansible.builtin.command: awk '/^MemAvailable:/ { print $2 }' /proc/meminfo
      register: mem_available_kb
      changed_when: false
      check_mode: false

    # swapoff pages everything back into RAM. On a node without the headroom that
    # invites the OOM killer onto a k3s agent. opi5pro-2 has 14 Gi available against
    # 867 MB out, so this passes easily today — the guard exists so the play stays
    # safe to re-run on a node where that is no longer true.
    - name: Refuse to deactivate swap without the RAM to absorb it
      ansible.builtin.assert:
        that:
          - ((mem_available_kb.stdout | trim | int) * 1024) > ((nvme_swap_used.stdout | trim | default('0', true) | int) * 2)
        fail_msg: >-
          {{ inventory_hostname }}: {{ (nvme_swap_used.stdout | trim | default('0', true) | int / 1048576) | round(1) }} MiB
          is paged out to {{ nvme_swapfile }} but only
          {{ ((mem_available_kb.stdout | trim | int) / 1024) | round(1) }} MiB is available.
          Refusing to swapoff — free memory first.
        success_msg: >-
          {{ inventory_hostname }}: safe to swapoff
          ({{ (nvme_swap_used.stdout | trim | default('0', true) | int / 1048576) | round(1) }} MiB out,
          {{ ((mem_available_kb.stdout | trim | int) / 1024) | round(1) }} MiB available)
      when: nvme_swap_used.stdout | trim | length > 0

    # ---- zram activation ------------------------------------------------------
    # DIAGNOSED 2026-08-30. opi5pro-2's zram was NOT a failed service:
    #
    #   opi5pro-1   /dev/zram0  lzo-rle  7.8G  …  [SWAP]
    #   opi5pro-2   /dev/zram0  lzo-rle  7.8G  …          <- exists, never swapon'd
    #
    # The device is created, correctly sized, correctly formatted. Config files on
    # the two nodes are byte-identical (every value commented out) and so are the
    # units. Only the runtime state differs.
    #
    # ROOT CAUSE, and a trap for anyone editing fstab on these boards:
    # /usr/lib/orangepi/orangepi-zram-config runs `swapon` on zram0 DIRECTLY, so zram
    # swap is NOT represented in /etc/fstab. `swapoff -a && swapon -a` — the obvious
    # thing to run after adding a swapfile to fstab — therefore drops zram and brings
    # back only the fstab entry. That is almost certainly how these two nodes diverged
    # on 2026-06-29, and it will do it again. This play never uses `swapoff -a`; it
    # deactivates one named file.
    #
    # WHY NOT JUST `systemd: state: started` (which is what I reached for first):
    #   - The unit is Type=oneshot with RemainAfterExit=yes, and systemd already
    #     considers it ACTIVE on opi5pro-2. `state: started` is a silent no-op — it
    #     would report ok while changing nothing, which is the exact failure this
    #     block exists to repair.
    #   - `state: restarted` is WORSE: ExecStop tears down every zram device, and
    #     zram1 currently carries /var/log on both nodes. Restarting a "swap config"
    #     service would unmount the system log.
    # So activate the device directly, and leave the service alone.
    - name: Ensure the zram service is enabled at boot
      ansible.builtin.systemd:
        name: "{{ zram_service }}"
        enabled: true

    # Selects on the SWAP SIGNATURE, not on the device name. zram1 holds /var/log and
    # zram2 (where present) holds /tmp; calling swapon on either would be a real
    # mistake. `blkid -s TYPE` returning "swap" is the property that can only be true
    # of a device mkswap has been run against.
    - name: Find zram devices formatted as swap but not currently active
      ansible.builtin.shell: |
        set -o pipefail
        for d in /dev/zram*; do
          [ -b "$d" ] || continue
          [ "$(blkid -s TYPE -o value "$d" 2>/dev/null)" = "swap" ] || continue
          awk -v d="$d" 'NR > 1 && $1 == d { f = 1 } END { exit f ? 0 : 1 }' /proc/swaps && continue
          echo "$d"
        done
      args:
        executable: /bin/bash
      register: zram_idle
      changed_when: false
      failed_when: false
      check_mode: false

    # Priority 5 to match what the orangepi script sets on opi5pro-1, so the two nodes
    # agree on ordering as well as on presence. Higher priority wins, and there is
    # deliberately nothing left for it to lose to once the swapfile is gone.
    - name: Activate idle zram swap devices
      ansible.builtin.command: "swapon --priority {{ zram_swap_priority }} {{ item }}"
      loop: "{{ zram_idle.stdout_lines | default([]) }}"

    - name: Re-read swap devices after zram activation
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_after_zram
      changed_when: false
      failed_when: false
      check_mode: false

    # WARN rather than fail, following the chrony.yml precedent. A node with no swap
    # at all is an acceptable end state — Kubernetes' own default is NoSwap — so zram
    # not coming up must not block removing the swapfile, which is the more important
    # half. It must also not pass silently.
    - name: WARN when no zram swap device is active
      ansible.builtin.debug:
        msg: >-
          WARNING {{ inventory_hostname }}: no zram device is active as swap. This node
          will have NO swap once {{ nvme_swapfile }} is removed. That is safe, but it is
          not what the image intends — check `zramctl` and whether a `swapoff -a` ran.
      when: "'zram' not in (swap_after_zram.stdout | default(''))"

    # ---- remove the artefact of the old swapfile approach ---------------------
    # ADDED 2026-08-30, BACKLOG §3.16. `zswap-config.service` was found FAILED on
    # opi5pro-2 by the first fleet-wide `systemctl list-units --failed` sweep.
    #
    # Its origin is ansible/roles/zswap/ — an ORPHAN role invoked by no playbook,
    # deleted in the same change that added this. That role created the swapfile, put
    # it in fstab, deployed this unit, and — the part that explains everything —
    # ran `swapoff /dev/zram0` under `zswap_disable_zram`. That is the exact state
    # measured on opi5pro-2: zram0 created, correctly sized, mkswap'd, not active.
    #
    # The role also tried to disable `zram-generator` and `systemd-zram-setup@zram0`,
    # which are Fedora/Arch unit names. These boards use `orangepi-zram-config`, so
    # that half failed silently under `failed_when: false` — leaving the service
    # enabled to keep RE-CREATING the device that nothing then swapped on.
    #
    # zswap is a compressed cache in FRONT of a swap device. With zram as the only
    # swap here, zswap would be compressing already-compressed pages. There is
    # nothing for it to do, and the unit fails anyway because it writes to
    # /sys/module/zswap/parameters/ which these RK3588 kernels do not provide.
    #
    # Removal is idempotent: absent unit -> nothing to stop, nothing to delete.
    - name: Check whether the legacy zswap-config unit is present
      ansible.builtin.stat:
        path: /etc/systemd/system/zswap-config.service
      register: legacy_zswap_unit
      check_mode: false

    - name: Stop and disable the legacy zswap-config unit
      ansible.builtin.systemd:
        name: zswap-config.service
        state: stopped
        enabled: false
      failed_when: false
      when: legacy_zswap_unit.stat.exists

    - name: Remove the legacy zswap-config unit file
      ansible.builtin.file:
        path: /etc/systemd/system/zswap-config.service
        state: absent
      when: legacy_zswap_unit.stat.exists
      notify: reload systemd after removing zswap-config

    # lineinfile, NOT ansible.posix.mount. Swap records carry `none` in the
    # mount-point field, which is exactly what posix.mount matches on — pointing a
    # matcher at `none` inside the file that decides whether a headless node boots
    # is not a risk worth taking to save three lines.
    - name: Remove the NVMe swapfile from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*{{ nvme_swapfile | regex_escape }}\s+'
        state: absent
        backup: true

    - name: Deactivate the NVMe swapfile
      ansible.builtin.command: "swapoff {{ nvme_swapfile }}"
      when: nvme_swapfile in (swap_before.stdout | default(''))

    # Re-read rather than trusting the task above. Deleting a swapfile that is still
    # active does NOT free the space — the kernel keeps writing to an unlinked inode
    # — and it is the one genuinely destructive step in this play. It gets its own
    # evidence. check_mode: false so the guard is real under --check too, where the
    # swapoff above is skipped and this correctly leaves the file in place.
    - name: Re-read swap devices before deleting anything
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: swap_before_delete
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Delete the NVMe swapfile, only once proven inactive
      ansible.builtin.file:
        path: "{{ nvme_swapfile }}"
        state: absent
      when: nvme_swapfile not in (swap_before_delete.stdout | default(''))

    # Read the swap table ONE MORE TIME. The Report below previously used
    # swap_after_zram, which is captured BEFORE the swapoff and the delete — so on
    # 2026-08-30 the first real run closed with
    #     "swap = /mnt/nvme/swapfile\n/dev/zram0"
    # on a node where the swapfile had just been deactivated and deleted three tasks
    # earlier. A closing summary asserting a state that stopped being true mid-play is
    # the same defect as an Ansible summary that claims success under --check
    # (CLAUDE.md). Report what is true when the play ends, not what was true when it
    # was convenient to measure.
    - name: Read the final swap state
      ansible.builtin.command: swapon --show=NAME,SIZE,PRIO --noheadings
      register: swap_final
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: NVMe mounted at {{ nvme_mount }}
          (UUID={{ nvme_uuid.stdout | trim }}); swap = {{ swap_final.stdout | trim | default("none", true) | replace("\n", " / ") }}

  handlers:
    - name: reload systemd after removing zswap-config
      ansible.builtin.systemd:
        daemon_reload: true
