---
# shared-storage.yml — NFS shared storage for the lab.
#
# Play 0: Install nfs-common on all k3s nodes so they can mount NFS PVs
#         (required for the immich-library NFS PersistentVolume).
#
# Plays 1-4: NFS shared storage between n150-1 (server) and n150-2 (client).
#
# Enables virsh live migration for any VM whose disk is on the shared pool.
#
# Storage layout after this runs:
#   n150-1: /srv/libvirt-shared/  (local SSD, exported over NFS)
#   n150-2: /srv/libvirt-shared/  (NFS mount from n150-1, same path)
#   Both:   libvirt pool "libvirt-shared" → /srv/libvirt-shared/
#   Existing local pool "vms" → /var/lib/libvirt/images/ (unchanged)
#
# Live migration (after moving a VM disk to the shared pool):
#   # From n150-1 → n150-2
#   virsh migrate --live --persistent <vm> qemu+ssh://192.168.1.21/system
#   # From n150-2 → n150-1
#   virsh migrate --live --persistent <vm> qemu+ssh://192.168.1.42/system
#
# Move an existing VM to shared storage (example: gitlab-1):
#   sudo virsh shutdown gitlab-1
#   sudo mv /var/lib/libvirt/images/gitlab-1.qcow2 /srv/libvirt-shared/
#   sudo virsh edit gitlab-1   # update <source file=...> path
#   sudo virsh start gitlab-1
#
# Run:
#   ansible-playbook -i inventory/hosts.yml playbooks/shared-storage.yml \
#     --vault-password-file .vault_pass
#
# Check-mode safe: NFS mounts and virsh pool commands are skipped in check mode.


# ─────────────────────────────────────────────────────────────────────────────
# Play 0 — nfs-common on all k3s nodes
# Required for kubelet to mount NFS PersistentVolumes (e.g. immich-library).
# Handles both apt-based nodes (n150-x, odroid-nas) and pacman-based (opi5pro-x).
# ─────────────────────────────────────────────────────────────────────────────
- name: "nfs-common — install NFS client on all k3s nodes"
  hosts: k3s_server:k3s_agents
  become: true
  gather_facts: true
  tags: [nfs_clients]

  tasks:
    - name: (apt) install nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: false
      when: ansible_pkg_mgr == 'apt'

    - name: (pacman) install nfs-utils
      community.general.pacman:
        name: nfs-utils
        state: present
      when: ansible_pkg_mgr == 'pacman'


# ─────────────────────────────────────────────────────────────────────────────
# Play 1 — NFS server (n150-1)
# ─────────────────────────────────────────────────────────────────────────────
- name: "NFS server — n150-1 exports /srv/libvirt-shared"
  hosts: n150-1
  become: true
  gather_facts: true

  vars:
    shared_path: /srv/libvirt-shared
    nfs_export_subnet: 192.168.1.0/24

  tasks:
    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: false

    - name: Create shared directory
      ansible.builtin.file:
        path: "{{ shared_path }}"
        state: directory
        owner: root
        group: libvirt
        mode: "0775"

    - name: Export shared directory to lab subnet
      # no_root_squash: libvirtd runs as root and must own VM disk files.
      # sync: write-through ensures QEMU sees a consistent view after failover.
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ shared_path }} {{ nfs_export_subnet }}(rw,sync,no_subtree_check,no_root_squash)"
        create: true
        mode: "0644"
      notify: reload exports

    # ---- restart policy ------------------------------------------------------
    # ADDED 2026-08-30, BACKLOG §3.16. `nfs-server` on n150-1 ships with
    # `Restart=no` (measured fleet-wide the same day — every other managed service in
    # this lab is Restart=always or on-failure; nfs-server was the sole exception).
    #
    # One transient failure was therefore PERMANENT. On 2026-07-24 the unit exited
    # 1/FAILURE after running for 2d 23h and stayed down for 37 DAYS on a host with
    # 62 days of uptime. /srv/libvirt-shared was unmounted on n150-2 that entire time,
    # both libvirt pools were degraded, and live migration between the two KVM hosts —
    # the pair running gitlab-1 — was impossible. Nothing alerted, because
    # node_exporter's systemd collector is scoped to backup-.+ and the series for this
    # unit DOES NOT EXIST (§3.16). `enabled` stayed true throughout, which looks
    # reassuring in `systemctl list-unit-files` and says nothing about whether it runs.
    #
    # THE JOURNAL FOR THE FAILURE IS GONE — "journal has been rotated since unit was
    # started". Three timestamps and an exit code are the entire surviving record, so
    # the cause is unrecoverable and cannot be fixed. What CAN be fixed is the
    # permanence, which is this drop-in.
    #
    # SCOPED TO n150-1 DELIBERATELY. h4-core also runs nfs-server with Restart=no, and
    # that one is THE NAS: CLAUDE.md is explicit that the NAS services and the data
    # they serve are off-limits — never stop, restart, or reconfigure them. This play
    # targets n150-1 only, which is what keeps the two apart. Do not "fix" h4-core's
    # nfs-server by widening this play's hosts.
    #
    # THE TRADE, stated plainly: a persistently broken server will now flap until
    # StartLimitBurst stops it, rather than failing once and going quiet. That is the
    # better failure — it is louder, it produces a restart count a widened collector
    # can alert on, and 37 days of silent downtime is the alternative being traded
    # away. StartLimitIntervalSec/Burst are left at systemd defaults (5 starts in 10s)
    # so a genuinely broken unit still comes to rest instead of restarting forever.
    - name: Ensure the nfs-server drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/nfs-server.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Give nfs-server a restart policy so a transient fault self-heals
      ansible.builtin.copy:
        dest: /etc/systemd/system/nfs-server.service.d/10-restart.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (playbooks/shared-storage.yml) — BACKLOG §3.16.
          # Upstream nfs-server.service sets Restart=no, so one transient exit is
          # permanent. It cost 37 days of silent downtime on 2026-07-24.
          [Service]
          Restart=on-failure
          RestartSec=10s
      notify: reload systemd for nfs-server

    - name: Enable and start NFS server
      ansible.builtin.systemd:
        # Package is nfs-kernel-server; systemd unit name on Ubuntu 24.04 is nfs-server
        name: nfs-server
        enabled: true
        state: started

    # Handlers normally fire at the END of a play. On the run that CREATES the
    # drop-in, that is too late: the verification below would read the policy before
    # daemon-reload had run, systemd would still report Restart=no, and the assert
    # would fail on the very run that fixed the problem. Same reason drift-check.yml
    # flushes before enabling its timer.
    - name: Flush handlers so systemd reloads before we verify
      ansible.builtin.meta: flush_handlers

    # Verify the drop-in is what systemd ACTUALLY LOADED, not what we wrote to disk.
    # CLAUDE.md: check the artifact the consumer reads. A drop-in with a typo, a bad
    # section header, or a name not ending in .conf is silently ignored — the file
    # exists, the play reports changed, and the policy is still Restart=no. Asking
    # systemd is the only check that can distinguish those.
    - name: Read back the restart policy systemd resolved
      ansible.builtin.command: systemctl show -p Restart --value nfs-server
      register: nfs_restart_policy
      changed_when: false
      check_mode: false

    # NOT ASSERTED UNDER --check. In check mode the drop-in is simulated and never
    # written, so systemd correctly still reports Restart=no — asserting there would
    # fail every dry run and publish lab_ansible_check_failed{playbook="shared-storage"},
    # which is the check-mode cascade this repo has spent 2026-08-30 removing from four
    # other playbooks. The dry run reports the pending change instead.
    - name: DRY RUN — report the restart policy without asserting on it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: nfs-server currently reports
          Restart={{ nfs_restart_policy.stdout | trim | default('<unknown>', true) }}.
          {{ 'Already correct.' if (nfs_restart_policy.stdout | trim) == 'on-failure'
             else 'The drop-in above WOULD change this to on-failure on a real run.' }}
      when: ansible_check_mode

    - name: Confirm systemd is honouring the drop-in
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - nfs_restart_policy.stdout | trim == "on-failure"
        fail_msg: >-
          nfs-server on {{ inventory_hostname }} still reports
          Restart={{ nfs_restart_policy.stdout | trim | default('<empty>', true) }}
          after the drop-in was written. systemd is not loading
          /etc/systemd/system/nfs-server.service.d/10-restart.conf — check the filename
          ends in .conf and that `systemctl daemon-reload` ran.
        success_msg: >-
          {{ inventory_hostname }}: nfs-server Restart=on-failure confirmed by systemd
          (was Restart=no; 37-day outage 2026-07-24, §3.16)

    - name: Define libvirt-shared storage pool
      ansible.builtin.command: >
        virsh pool-define-as libvirt-shared dir --target {{ shared_path }}
      register: pool_define
      changed_when: pool_define.rc == 0
      failed_when: pool_define.rc != 0 and 'already exists' not in pool_define.stderr

    - name: Build storage pool
      ansible.builtin.command: virsh pool-build libvirt-shared
      failed_when: false
      changed_when: false

    - name: Start storage pool
      ansible.builtin.command: virsh pool-start libvirt-shared
      register: pool_start
      changed_when: pool_start.rc == 0
      failed_when: pool_start.rc != 0 and 'already active' not in pool_start.stderr

    - name: Autostart storage pool
      ansible.builtin.command: virsh pool-autostart libvirt-shared
      changed_when: false

    # check_mode: false — 2026-08-29, BACKLOG §3.11. `virsh pool-info` only reads,
    # but `command` is skipped under --check, so `pool_info` was unset and the
    # "Show pool status" debug errored on `.stdout`. This play could not complete a
    # dry run, which blocks the scheduled --check §3.11 asks for.
    - name: Verify pool is active
      ansible.builtin.command: virsh pool-info libvirt-shared
      register: pool_info
      changed_when: false
      check_mode: false

    - name: Show pool status
      ansible.builtin.debug:
        msg: "{{ pool_info.stdout_lines }}"

  handlers:
    - name: reload systemd for nfs-server
      ansible.builtin.systemd:
        daemon_reload: true

    - name: reload exports
      ansible.builtin.command: exportfs -ra


# ─────────────────────────────────────────────────────────────────────────────
# Play 2 — NFS client (n150-2)
# ─────────────────────────────────────────────────────────────────────────────
- name: "NFS client — n150-2 mounts /srv/libvirt-shared from n150-1"
  hosts: n150-2
  become: true
  gather_facts: true

  vars:
    shared_path: /srv/libvirt-shared
    nfs_server_ip: "{{ hostvars['n150-1']['ansible_host'] }}"

  tasks:
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: false

    - name: Create mount point
      ansible.builtin.file:
        path: "{{ shared_path }}"
        state: directory
        owner: root
        group: libvirt
        mode: "0775"

    - name: Mount NFS share and persist in fstab
      # hard: retry forever on NFS outage (vs soft which errors out mid-write)
      # _netdev: wait for network before mounting at boot
      # timeo/retrans: be patient with a LAN NFS server
      ansible.posix.mount:
        path: "{{ shared_path }}"
        src: "{{ nfs_server_ip }}:{{ shared_path }}"
        fstype: nfs4
        opts: "defaults,_netdev,hard,timeo=60,retrans=5,rsize=1048576,wsize=1048576"
        state: mounted

    - name: Confirm mount is accessible
      ansible.builtin.command: mountpoint -q {{ shared_path }}
      changed_when: false

    - name: Define libvirt-shared storage pool
      ansible.builtin.command: >
        virsh pool-define-as libvirt-shared dir --target {{ shared_path }}
      register: pool_define
      changed_when: pool_define.rc == 0
      failed_when: pool_define.rc != 0 and 'already exists' not in pool_define.stderr

    - name: Build storage pool
      ansible.builtin.command: virsh pool-build libvirt-shared
      failed_when: false
      changed_when: false

    - name: Start storage pool
      ansible.builtin.command: virsh pool-start libvirt-shared
      register: pool_start
      changed_when: pool_start.rc == 0
      failed_when: pool_start.rc != 0 and 'already active' not in pool_start.stderr

    - name: Autostart storage pool
      ansible.builtin.command: virsh pool-autostart libvirt-shared
      changed_when: false

    # check_mode: false — 2026-08-29, BACKLOG §3.11. `virsh pool-info` only reads,
    # but `command` is skipped under --check, so `pool_info` was unset and the
    # "Show pool status" debug errored on `.stdout`. This play could not complete a
    # dry run, which blocks the scheduled --check §3.11 asks for.
    - name: Verify pool is active
      ansible.builtin.command: virsh pool-info libvirt-shared
      register: pool_info
      changed_when: false
      check_mode: false

    - name: Show pool status
      ansible.builtin.debug:
        msg: "{{ pool_info.stdout_lines }}"


# ─────────────────────────────────────────────────────────────────────────────
# Play 3 — SSH key exchange (required for virsh migrate qemu+ssh://)
# ─────────────────────────────────────────────────────────────────────────────
- name: "SSH key exchange — passwordless virsh migrate between n150s"
  hosts: kvm_hosts
  become: false
  gather_facts: true

  tasks:
    - name: Generate ed25519 SSH key for {{ ansible_user }} (if absent)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        generate_ssh_key: true
        ssh_key_type: ed25519
        ssh_key_comment: "{{ ansible_user }}@{{ inventory_hostname }}-virsh-migrate"
      become: true
      register: ssh_keygen

    - name: Read public key
      ansible.builtin.slurp:
        src: "~{{ ansible_user }}/.ssh/id_ed25519.pub"
      register: local_pubkey

    - name: Authorize this host's key on every other KVM host
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars[item]['local_pubkey']['content'] | b64decode | trim }}"
        state: present
      loop: "{{ groups['kvm_hosts'] }}"
      when: item != inventory_hostname

    - name: Add every other KVM host to known_hosts (suppress StrictHostKeyChecking)
      # Explicit path: ansible_become:true in group vars causes this to run as root,
      # which would write to /root/.ssh/known_hosts — not swares's known_hosts.
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item]['ansible_host'] }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' + hostvars[item]['ansible_host'] + ' 2>/dev/null') }}"
        path: "/home/{{ ansible_user }}/.ssh/known_hosts"
        state: present
      loop: "{{ groups['kvm_hosts'] }}"
      when:
        - item != inventory_hostname
        - hostvars[item]['ansible_host'] is defined

# ─────────────────────────────────────────────────────────────────────────────
# Play 4 — Smoke test
# ─────────────────────────────────────────────────────────────────────────────
- name: "Smoke test — write/read across NFS from n150-2"
  hosts: n150-2
  become: true
  gather_facts: false

  tasks:
    # FIXED CONTENT, AND THE FILE IS NO LONGER DELETED — 2026-08-30, BACKLOG §3.11.
    #
    # This task was the entire reason `lab_ansible_drift{playbook="shared-storage"}`
    # sat permanently at 1, and it could never have been anything else: the content
    # carried `ansible_date_time.iso8601`, so it differed on every single run, AND
    # the play's last task deleted the file, so the next run always found it missing.
    # Either alone guarantees `changed` forever.
    #
    # Note for anyone re-deriving this: THIS PLAY SETS gather_facts: false, which
    # reads as though `ansible_date_time` would be undefined and the `| default('now')`
    # would render a constant. It does not. Facts persist across plays within a run,
    # and plays 1 and 3 both gather them for n150-2 (it is in k3s_server), so the
    # variable is defined by the time this play runs and the default never fired.
    #
    # A permanently non-zero gauge is an alert that can never go green, which is how
    # LabExternalHostDown spent three weeks being ignored against a decommissioned VM
    # (see the note in lab-alerts.yaml). The floor has to be zero for the alert above
    # it to mean anything.
    #
    # WORSE, AND THE REAL FIND: because the deletion ran at the end of every real run,
    # the "Read test file back" task below — which DOES execute under --check, it
    # carries check_mode: false — was reading a file that had just been removed. It
    # failed into `failed_when: false` on every dry run. The single task meant to
    # prove NFS round-trips actually work has been asserting nothing, quietly, for as
    # long as it has existed.
    #
    # A persistent fixed-content marker fixes both. The read now succeeds and means
    # something, and `copy` still verifies the file over NFS on every run (it
    # checksums the remote before deciding), so the share is genuinely exercised —
    # it just stops rewriting bytes that were already correct.
    - name: Write test file to shared storage from n150-2
      ansible.builtin.copy:
        dest: /srv/libvirt-shared/.migration-test
        content: "libvirt-shared NFS round-trip marker, written from n150-2 by shared-storage.yml\n"
        mode: "0644"

    # check_mode: false AND failed_when: false — 2026-08-29, revised 2026-08-30.
    # check_mode: false so the round-trip is genuinely exercised during a dry run
    # rather than reported on without being tested. failed_when: false because on a
    # host that has never had a real run the marker is absent, and an unreachable
    # share is the FINDING — "Show test result" should report it, not abort the play.
    #
    # Until 2026-08-30 this read was pointed at a file the play deleted at the end of
    # every real run, so it failed into failed_when: false every time and asserted
    # nothing. It only became a real check when the marker was made persistent.
    - name: Read test file back (confirms NFS round-trip)
      ansible.builtin.command: cat /srv/libvirt-shared/.migration-test
      register: test_read
      changed_when: false
      failed_when: false
      check_mode: false

    # Empty output is not a finding until you prove the check can speak (CLAUDE.md).
    # The previous message said "NFS round-trip OK:" and then printed nothing at all
    # when the read had failed — an unreachable share and a working one produced the
    # same reassuring prefix.
    - name: Show test result
      ansible.builtin.debug:
        msg: >-
          {{
            'NFS round-trip OK: ' ~ test_read.stdout | trim
            if (test_read.rc | default(1)) == 0 and (test_read.stdout | trim | length) > 0
            else 'NFS ROUND-TRIP FAILED — could not read the marker on
                  /srv/libvirt-shared from n150-2 (rc=' ~ (test_read.rc | default('?')) ~ ').
                  The share is not mounted, not readable, or has never had a real run.'
          }}

    # The "Remove test file" task was DELETED 2026-08-30. Removing it was what made
    # the read above meaningless and the drift gauge permanently 1. The marker is a
    # 78-byte dotfile on a shared pool measured in gigabytes; leaving it costs
    # nothing and is what makes this play idempotent.

    - name: Verify SSH from n150-2 to n150-1 (migration transport check)
      # ansible_become: true in kvm_hosts group vars overrides task-level become:false.
      # Workaround: explicitly become swares (sudo -u swares) so the command runs
      # with access to /home/swares/.ssh/id_ed25519, not root's empty key ring.
      ansible.builtin.command: >
        ssh -o BatchMode=yes -o ConnectTimeout=5
          {{ hostvars['n150-1']['ansible_host'] }}
          echo "SSH OK from n150-2 to n150-1"
      become: true
      become_user: "{{ ansible_user }}"
      register: ssh_test
      changed_when: false
      # check_mode: false — 2026-08-29, BACKLOG §3.11. A connectivity probe that
      # changes nothing, and the one task proving the live-migration transport
      # actually works. Skipped under --check it verified nothing and left
      # `ssh_test` unset, so the debug below errored. failed_when: false so a broken
      # transport is REPORTED by the summary rather than aborting the dry run —
      # a failed probe is the finding, not a reason to stop looking.
      failed_when: false
      check_mode: false

    - name: Show SSH test result
      ansible.builtin.debug:
        msg: "{{ ssh_test.stdout | default('(no output)') }} (rc={{ ssh_test.rc | default('?') }})"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "✅ NFS share mounted at /srv/libvirt-shared"
          - "✅ libvirt-shared pool active on both nodes"
          - "✅ SSH key exchange complete"
          - ""
          - "To migrate a VM, first move its disk to the shared pool:"
          - "  sudo virsh shutdown <vm>"
          - "  sudo mv /var/lib/libvirt/images/<vm>.qcow2 /srv/libvirt-shared/"
          - "  sudo virsh edit <vm>   # update <source file=...>"
          - "  sudo virsh start <vm>"
          - ""
          - "Then live-migrate:"
          - "  virsh migrate --live --persistent <vm> qemu+ssh://192.168.1.21/system"
          - "  virsh migrate --live --persistent <vm> qemu+ssh://192.168.1.42/system"
