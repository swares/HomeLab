[defaults]
roles_path = /home/swares/lab/homelab/homelab/ansible/roles
collections_path = /opt/ansible/collections:/home/swares/.ansible/collections:/usr/share/ansible/collections
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
# vault_password_file is gitignored — create ansible/.vault_pass locally before
# running playbooks. It holds the Ansible Vault password itself and is NOT
# derivable from HashiCorp Vault; scripts/sync-vault-to-ansible-vault.sh requires
# it to already exist. Losing it means group_vars/all/secrets.yml,
# kvm_hosts/secrets.yml and vault/vault.yml can never be decrypted again.
#
# Absolute, not relative. Ansible resolves a relative vault_password_file from the
# *working directory*, so running from the repo root instead of ansible/ produced
# "Attempting to decrypt but no vault secrets found" — which reads like a missing
# or corrupt vault rather than a wrong cwd. roles_path below is already absolute;
# this now matches. Both assume the H4 checkout at the path below.
vault_password_file = /home/swares/lab/homelab/homelab/ansible/.vault_pass

[privilege_escalation]
become = True
become_method = sudo

[galaxy]
server_list = release_galaxy

[galaxy_server.release_galaxy]
url = https://galaxy.ansible.com/

