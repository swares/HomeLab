---
# chrony.yml — Install and configure NTP sync on all Linux lab hosts.
#
# Why chrony over systemd-timesyncd:
#   - timesyncd is client-only; chrony can also serve time to the LAN.
#   - h4-core is always-on and makes a reliable local NTP server — cluster
#     nodes, RPis, and SBCs converge faster against a LAN peer than public pools.
#   - chrony handles large clock steps (reboots, drift) more aggressively with
#     `makestep`, which matters for LDAP cert validity and k8s token expiry.
#
# OS-family handling:
#   - Debian/Ubuntu: install chrony, mask timesyncd.
#   - Arch Linux (dns-2, opi-zero2w-1): chrony has a libnettle conflict with
#     dnsmasq — configure systemd-timesyncd directly instead.
#   - xu3-1 excluded: Python 2 / too old for ansible-core.
#
# What it does:
#   - h4-core: chrony + serve time to 192.168.1.0/24.
#   - All other Debian/Ubuntu hosts: chrony client, prefer h4-core LAN peer.
#   - Arch hosts: timesyncd configured with h4-core + public pools.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml chrony.yml --vault-password-file .vault_pass --check
#   ansible-playbook -i inventory/hosts.yml chrony.yml --vault-password-file .vault_pass
#   ansible-playbook -i inventory/hosts.yml chrony.yml --vault-password-file .vault_pass -l rpi5

# ── Play 1: Debian/Ubuntu hosts — chrony ─────────────────────────────────────
- name: Configure chrony on Debian/Ubuntu hosts
  hosts: all:!x86_nodes:!embedded:!xu3-1
  become: true

  vars:
    _h4_ip: "192.168.1.160"
    _is_h4: "{{ ansible_host == _h4_ip or ansible_connection == 'local' }}"

  tasks:
    - name: Skip Arch Linux hosts (handled in Play 2)
      ansible.builtin.meta: end_host
      when: ansible_os_family == 'Archlinux'

    - name: Install chrony
      ansible.builtin.package:
        name: chrony
        state: present

    - name: Mask systemd-timesyncd (conflicts with chrony on port 123)
      ansible.builtin.systemd:
        name: systemd-timesyncd
        masked: true
        state: stopped
      failed_when: false

    - name: Write chrony config — h4-core (server + client)
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        mode: "0644"
        content: |
          # Managed by Ansible (chrony.yml). h4-core — NTP server + client.
          pool 0.pool.ntp.org iburst
          pool 1.pool.ntp.org iburst
          pool 2.pool.ntp.org iburst
          pool 3.pool.ntp.org iburst

          # Serve time to the lab LAN so other hosts converge faster.
          allow 192.168.1.0/24

          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
      when: _is_h4 | bool
      notify: Restart chrony

    - name: Write chrony config — client (prefers h4-core LAN server)
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        mode: "0644"
        content: |
          # Managed by Ansible (chrony.yml). Client — prefers h4-core LAN server.
          server {{ _h4_ip }} iburst prefer
          pool 0.pool.ntp.org iburst
          pool 1.pool.ntp.org iburst
          pool 2.pool.ntp.org iburst
          pool 3.pool.ntp.org iburst

          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
      when: not (_is_h4 | bool)
      notify: Restart chrony

    # ── The return path ──────────────────────────────────────────────────────
    #
    # WHY THIS HOOK EXISTS. On 2026-08-26 at 06:11:38, n150-2 — an etcd voter —
    # stopped synchronising time and stayed that way for 18 hours.
    #
    #   06:10:49  apt-daily-upgrade.service starts (unattended-upgrades)
    #   06:11:37  systemd re-executes, pulled in by a package upgrade
    #   06:11:38  Stopping systemd-networkd.service
    #   06:11:38  chronyd: "Source <all 17> offline"
    #
    # chronyd marks a source OFFLINE when a transmit fails with ENETUNREACH,
    # which is what every source returned the instant networkd tore down the
    # addresses and routes. networkd came back one second later. **chrony did
    # not**, because it never retries a source it has marked offline — it waits
    # to be told, and on this host nobody could tell it:
    #
    #   - the chrony package ships its come-back-online hooks for ifupdown
    #     (/etc/network/if-up.d/chrony) and dhclient
    #     (/etc/dhcp/dhclient-exit-hooks.d/chrony)
    #   - NEITHER is installed here: `dpkg -l ifupdown` reports `un`, there is no
    #     /etc/network/interfaces, and isc-dhcp-client is absent
    #   - networkd-dispatcher IS installed and every hook directory was EMPTY
    #
    # So the offline path fired and the online path did not exist. The files in
    # /etc/network/if-*.d/ are dead remnants; do not "fix" this by editing them.
    #
    # `chronyc activity` reporting "0 sources online / 17 sources offline" is the
    # value that can only be produced by this fault — Reach 0 alone also looks
    # like a firewall, and ICMP to the internet worked throughout.
    #
    # onoffline, NOT online: it sets each source according to the CURRENT routing
    # table, so it is correct on a host that genuinely has no route as well as one
    # that just regained it.
    #
    # apt-daily-upgrade runs nightly on every Debian/Ubuntu host here, so this is
    # reproducible fleet-wide. n150-1 escaped by timing, not by configuration —
    # its chrony.conf is byte-identical (verified by diff on 2026-08-26).
    # The guard here matters, and got this wrong once. `ansible_service_mgr ==
    # 'systemd'` was the first attempt: it tests for systemd, not for
    # networkd-dispatcher, so on 2026-08-26 the copy failed on seven hosts with
    # "Destination directory /etc/networkd-dispatcher/routable.d does not exist"
    # — and because the task FAILED rather than skipped, those hosts never
    # reached the chrony start or the verification assert below. A wrong guard
    # does not just miss its own target, it truncates the rest of the play.
    #
    # Do not "fix" this by creating the directory: a hook in a directory no
    # dispatcher reads is worse than no hook, because it looks handled.
    - name: Check whether networkd-dispatcher is present
      ansible.builtin.stat:
        path: /etc/networkd-dispatcher/routable.d
      register: _nd_dir
      check_mode: false

    - name: Is systemd-networkd actually managing this host?
      ansible.builtin.command: systemctl is-active systemd-networkd
      register: _networkd
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install networkd-dispatcher hook to bring chrony back online
      ansible.builtin.copy:
        dest: /etc/networkd-dispatcher/routable.d/50-chrony
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible (chrony.yml). See that file for why this exists.
          # chronyd marks sources offline on ENETUNREACH and never retries them;
          # this is the only thing that brings them back after networkd restarts.
          [ -x /usr/bin/chronyc ] || exit 0
          /usr/bin/chronyc onoffline >/dev/null 2>&1 || true
      when: _nd_dir.stat.isdir | default(false)

    # BACKSTOP for hosts with no networkd-dispatcher. The hook above is the
    # primary mechanism and it is VERIFIED WORKING — on 2026-08-26, with the hook
    # installed on n150-2, `systemctl restart systemd-networkd` was followed by
    # `chronyc activity` reporting "17 sources online".
    #
    # READ THE TIMING BEFORE YOU CHANGE ANYTHING HERE. The same test at `sleep 5`
    # returned "0 sources online" and was briefly written up as proof that
    # networkd-dispatcher cannot see a networkd restart (a D-Bus re-subscription
    # theory — plausible, and wrong). At `sleep 20` it passes. The dispatcher
    # simply takes longer than five seconds to emit the routable event after a
    # restart. **Allow at least 20 seconds when testing this**, or you will
    # measure your own impatience and call it a fault.
    #
    # So why keep this unit at all: seven hosts in this inventory have no
    # /etc/networkd-dispatcher/routable.d (dns-1, dns-3, dns-4, octopi-dns,
    # opi-zero2w-3, rpi4b, rpi5). Where networkd IS driving the network and the
    # dispatcher is absent, nothing else brings chrony back. This unit binds to
    # networkd's lifecycle directly and needs no dispatcher.
    #
    # Both are idempotent; running both on a host that has both is harmless.
    #
    # The ExecStartPre sleep matters for the same reason the test did: `onoffline`
    # reconciles against the routing table, so running it before the links are
    # routable leaves the sources offline — the bug wearing a hat.
    - name: Install oneshot unit to re-enable chrony sources when networkd starts
      ansible.builtin.copy:
        dest: /etc/systemd/system/chrony-onoffline.service
        mode: "0644"
        content: |
          # Managed by Ansible (chrony.yml). See that file for why this exists.
          [Unit]
          Description=Re-enable chrony sources after systemd-networkd starts
          Documentation=file:///etc/ansible/chrony.yml
          After=systemd-networkd.service
          PartOf=systemd-networkd.service

          [Service]
          Type=oneshot
          # Let the links settle before reconciling against the routing table.
          ExecStartPre=/bin/sleep 10
          ExecStart=/usr/bin/chronyc onoffline
          RemainAfterExit=no

          [Install]
          WantedBy=systemd-networkd.service
      # NO LONGER GATED ON NETWORKD — 2026-09-02. The unit is now also driven by
      # chrony-onoffline.timer below, which is installed everywhere chrony runs. On a
      # host without systemd-networkd the [Install] WantedBy= section is simply inert;
      # the ExecStart is a single `chronyc onoffline` and is harmless anywhere.
      # Leaving the gate here would have meant the timer firing a unit that does not
      # exist on exactly the hosts that rely on the dispatcher hook — which is also
      # event-driven and has the same blind spot.

      # CHECK-MODE CASCADE GUARD — 2026-09-02. This enables a unit whose file is
      # written earlier in this same play. Under --check that write is simulated, so
      # on a host that does not already have the unit systemd reports "Could not find
      # the requested service" and the play fails. It passes today only because the
      # unit already exists everywhere it runs — so this would surface on a REBUILD or
      # a new host, which is the worst time to discover it.
      #
      # Found by auditing for the pattern after introducing a fresh instance of it in
      # chrony-onoffline.timer. Five plays had it.
    - name: Enable chrony-onoffline
      ansible.builtin.systemd:
        name: chrony-onoffline.service
        enabled: true
        daemon_reload: true
      # BOTH conditions, as a list. `not ansible_check_mode` is the check-mode
      # cascade guard: the unit file is written earlier in this play, so under
      # --check systemd has never heard of it and this fails on any host that does
      # not already have it — a rebuild, or a new node.
      #
      # The `_networkd` condition is the ORIGINAL and must not be lost: enabling
      # binds the unit to systemd-networkd's lifecycle, which only means anything
      # where networkd is running. On 2026-09-02 a scripted edit replaced this
      # condition instead of combining with it, and the file still parsed — a stray
      # `when:` thirty-five lines below became a DUPLICATE KEY on this task, and YAML
      # silently takes the last one. Reading the task showed the right condition
      # while the parser used the wrong one.
      when:
        - not ansible_check_mode
        - _networkd.stdout | default('') is search('^active')

    # ---- PERIODIC RECONCILIATION — added 2026-09-02, BACKLOG §1.13 ----
    #
    # BOTH recovery paths above are EVENT-DRIVEN, and that is the gap. The
    # routable.d hook fires on a dispatcher event; chrony-onoffline.service fires on
    # systemd-networkd's lifecycle. Neither fires if a source goes offline without a
    # local network event — and one did.
    #
    # MEASURED 2026-09-02 on opi-zero2w-3:
    #
    #     ^? h4-core.lab.home.arpa   Reach 0   LastRx 5d   last sample -19.2s
    #     chronyc activity: 16 sources online, 1 SOURCE OFFLINE
    #     ping 192.168.1.160: 0% loss, 1.7ms
    #     chronyc clients on h4-core: .217 not listed at all
    #
    # Five days with the LAN time server parked, on a host reporting itself
    # synchronised — because it had silently fallen back to time.cloudflare.com.
    # chrony-onoffline.service had last run Aug 27, correctly: nothing local had
    # happened since. The recovery existed and had no trigger.
    #
    # WHY A TIMER AND NOT A BURST. `chronyc burst` was tried first and LOOKED like it
    # worked — the source went to `^*` and produced a sample. It did not work:
    # `Reach` stayed 0 and `chronyc activity` still counted the source offline. Only
    # `chronyc onoffline` recovered it, taking Reach 0 -> 37 and activity to
    # 17 online / 0 offline. Verified by reproducing the fault deliberately
    # (`chronyc offline 192.168.1.160`) and clearing it.
    #
    # `onoffline` and not `online`: it reconciles against the routing table, so it is
    # correct on a host that genuinely has no route, rather than forcing a source
    # online that cannot be reached.
    #
    # Hourly. The failure it covers is silent and can persist for days, so the cost of
    # a missed hour is nothing and the cost of running it needlessly is one chronyc
    # invocation.
    - name: Install timer to reconcile chrony sources periodically
      ansible.builtin.copy:
        dest: /etc/systemd/system/chrony-onoffline.timer
        mode: "0644"
        content: |
          # Managed by Ansible (chrony.yml) — BACKLOG §1.13.
          # Backstop for sources that go offline with NO local network event, which
          # neither the dispatcher hook nor the networkd-bound oneshot can catch.
          [Unit]
          Description=Periodically reconcile chrony sources against the routing table

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          # Catch up after downtime rather than waiting a full interval.
          Persistent=true

          [Install]
          WantedBy=timers.target
      # No `when:` — play 1 does `meta: end_host` for Arch hosts, so anything
      # reaching this task has chrony installed. An earlier draft gated on
      # `_chrony_present.stat.exists | default(true)`, a register that does not
      # exist: `default()` does NOT rescue an undefined variable, because the
      # attribute access fails first. It would have failed on every host.

    # SKIPPED UNDER --check: CHECK-MODE CASCADE. The task above writes the unit file,
    # which under --check is simulated — so systemd has never heard of
    # chrony-onoffline.timer and this fails with "Could not find the requested
    # service". Same shape as github-runner.yml's get_url -> unarchive,
    # mount-nvme.yml's file -> link, and kvm-netplan-fix.yml's mkdir -> copy.
    #
    # It bites only on FIRST introduction of a unit, which is why the older
    # `Enable chrony-onoffline` task never showed it: that file already existed on
    # the hosts the task ran against. A new unit is exactly when this class appears,
    # and exactly when nobody is expecting it.
    - name: Enable the periodic reconciliation timer
      ansible.builtin.systemd:
        name: chrony-onoffline.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    # WHICH MECHANISM COVERS THIS HOST.
    #
    # Reworded 2026-08-26, immediately after its first real run. It previously
    # warned "chrony will be parked offline with nothing to bring it back" —
    # under a `when:` IDENTICAL to the oneshot unit's. So it fired on dns-4 and
    # opi-zero2w-3 in the same run that installed the backstop on both, alarming
    # about the one case that is covered. A warning that cries wolf is not
    # harmless: `lab-alerts.yaml` records LabExternalHostDown firing for three
    # weeks against a decommissioned VM and training the eye to ignore it.
    #
    # There is no exposed case left, which is why this is now informational:
    #   dispatcher dir present -> routable.d hook (primary, verified)
    #   networkd active        -> chrony-onoffline.service (backstop)
    #   neither                -> host is not on networkd; the chrony package's
    #                             own ifupdown/dhclient hooks apply
    #
    # THE THIRD BRANCH WAS AN ASSERTION, NOT A MEASUREMENT — corrected 2026-08-29.
    #
    # "package hooks apply" was printed for any host without networkd, without ever
    # looking for a package hook. That is the same claim §1.13 disproved on n150-2:
    # chrony ships its come-back-online hooks for ifupdown and dhclient, and on that
    # host `dpkg -l ifupdown` returned `un` and neither existed — which is why chrony
    # sat with 17 sources offline for 18 hours while `systemctl is-active` said
    # `active`. A host in that state would have been reported here as covered.
    #
    # Found on opi-zero2w-4, where the message happened to be TRUE — ifupdown is
    # installed and /etc/network/if-up.d/chrony exists. True by that host's package
    # set, not by anything this play checked. Same message, opposite reality, and no
    # way to tell them apart.
    #
    # So look for the hook instead of assuming it. Read-only, hence check_mode: false
    # — a coverage check that skips under --check reports coverage it did not verify,
    # which is the fault this block is being fixed for (BACKLOG §3.11).
    - name: Look for a chrony come-back-online hook shipped by the package
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/network/if-up.d/chrony                        # ifupdown
        - /etc/NetworkManager/dispatcher.d/20-chrony         # NetworkManager
        - /etc/NetworkManager/dispatcher.d/20-chrony-onoffline
        - /etc/dhcp/dhclient-exit-hooks.d/chrony             # dhclient
      register: _chrony_pkg_hooks
      changed_when: false
      check_mode: false

    # NOTE: this must be a single quoted expression, NOT a `>-` folded block. A
    # folded scalar renders the list to a STRING, so `| length` would count
    # characters — "[]" has length 2, so the "nothing covers this host" warning
    # below could never fire and the report would print an empty list as if it
    # were a hook. Caught before merge on 2026-08-29; the shape is worth knowing,
    # because it fails in the safe-looking direction.
    - name: Determine which package hooks actually exist on disk
      ansible.builtin.set_fact:
        _chrony_pkg_hook_paths: "{{ _chrony_pkg_hooks.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Report which chrony recovery mechanism covers this host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'routable.d hook' if (_nd_dir.stat.isdir | default(false)) else '' }}
          {{ 'chrony-onoffline.service' if (_networkd.stdout | default('') is search('^active')) else '' }}
          {{ ('package hook: ' ~ (_chrony_pkg_hook_paths | join(', ')))
             if (_chrony_pkg_hook_paths | length > 0) else '' }}

    # A host matching none of the three has no way back from an ENETUNREACH parking
    # event. That is §1.13 exactly, and it is the one state this block used to
    # describe as covered. Not fatal — the clock keeps its frequency estimate for a
    # long time and n150-2 survived 18 hours at 4.9 microseconds — so this warns
    # rather than fails, and LabClockUnsynced is the backstop that reaches the phone.
    - name: Warn if NOTHING would bring chrony back online after a network restart
      ansible.builtin.debug:
        msg: >-
          WARNING {{ inventory_hostname }}: no networkd-dispatcher hook, no
          chrony-onoffline.service, and no package hook on disk. After a network
          restart chrony will mark every source offline and nothing will bring them
          back — see BACKLOG §1.13. `chronyc activity` is the check; `systemctl
          is-active chrony` will say `active` throughout.
      when:
        - not (_nd_dir.stat.isdir | default(false))
        - not (_networkd.stdout | default('') is search('^active'))
        - _chrony_pkg_hook_paths | length == 0

    - name: Enable and start chrony
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
        daemon_reload: true   # required after fresh package install

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    # check_mode: false added 2026-08-29 (BACKLOG §3.11). Ansible skips `command`
    # tasks under --check, so this — the only task that confirms chrony actually
    # resynced — has never run in a dry run. Every --check of this playbook has
    # reported success having verified nothing, which is the sentence §3.11 uses.
    # `chronyc waitsync` only polls; it changes no state, so running it under
    # --check is safe and is the whole point of the task.
    - name: Wait for initial sync (up to 15 s)
      ansible.builtin.command: chronyc waitsync 3 0.1 0 5
      register: _wait
      changed_when: false
      failed_when: false
      check_mode: false

    # check_mode: false on the read-only verification commands below.
    #
    # Ansible SKIPS `command` tasks under --check, so without this the closing
    # debug happily prints a success summary for a run that verified nothing.
    # That mistake was made twice in one day on 2026-08-21 (promtail-remove and
    # h4-dns-resolvers), the second time immediately after fixing the first.
    # These are `chronyc` reads — they change nothing and are safe in check mode.
    - name: Report sync status
      ansible.builtin.command: chronyc tracking
      register: _tracking
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Count sources chrony currently considers online
      ansible.builtin.command: chronyc activity
      register: _activity
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show tracking output
      ansible.builtin.debug:
        msg: "{{ _tracking.stdout_lines }}"

    # A number the failure case cannot produce. "0 sources online" is exactly
    # what n150-2 reported for 18 hours while `systemctl is-active chrony` said
    # "active", ICMP worked, and the config was identical to a healthy host.
    # Assert on the count, not on the daemon being up.
    - name: Fail if chrony has no sources online
      ansible.builtin.assert:
        that:
          - _activity.stdout is search('sources online')
          - not (_activity.stdout is search('^0 sources online', multiline=True))
        fail_msg: >-
          chrony reports no sources online on {{ inventory_hostname }}:
          {{ _activity.stdout_lines | default([]) | join(' | ') }}
          Run `chronyc onoffline` and check
          /etc/networkd-dispatcher/routable.d/50-chrony exists.
        success_msg: "chrony has sources online: {{ _activity.stdout_lines | first | default('') }}"
      when: not ansible_check_mode

  handlers:
    - name: Restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted
        daemon_reload: true

# ── Play 2: Arch Linux hosts — configure systemd-timesyncd ───────────────────
# chrony installs nettle 4.0 which breaks dnsmasq on these hosts.
# timesyncd is already present as part of systemd; just configure it.
- name: Configure timesyncd on Arch Linux hosts
  hosts: all:!x86_nodes:!embedded:!xu3-1
  become: true

  vars:
    _h4_ip: "192.168.1.160"

  tasks:
    - name: Run only on Arch Linux
      ansible.builtin.meta: end_host
      when: ansible_os_family != 'Archlinux'

    - name: Configure timesyncd NTP servers
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf
        mode: "0644"
        content: |
          # Managed by Ansible (chrony.yml).
          [Time]
          NTP={{ _h4_ip }} 0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org
          FallbackNTP=3.pool.ntp.org
      notify: Restart timesyncd

    - name: Enable and start systemd-timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    # check_mode: false — same reason as Play 1, and this play demonstrated the
    # problem on 2026-08-26. A --check run of the version before this printed:
    #
    #     TASK [Show sync status]
    #     ok: [opi-zero2w-2] => { "msg": [] }
    #
    # `ok`, with nothing in it. The command was skipped under check mode, the
    # registered stdout_lines was empty, and the debug reported success having
    # verified nothing at all. This is the third occurrence of the same defect in
    # this repo (promtail-remove and h4-dns-resolvers, both 2026-08-21) and the
    # second time it was reintroduced in the same edit that fixed it elsewhere —
    # Play 1 above was corrected while this play was left as-is.
    #
    # timedatectl is a read. It is safe in check mode; that is the whole point.
    - name: Report sync status
      ansible.builtin.command: timedatectl timesync-status
      register: _status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show sync status
      ansible.builtin.debug:
        msg: "{{ _status.stdout_lines | default(['(no output — timesyncd may not be running)']) }}"

    # As in Play 1: assert on a value the failure case cannot produce. An empty
    # or absent status is the shape this play was previously reporting as success.
    - name: Fail if timesyncd is not synchronised
      ansible.builtin.assert:
        that:
          - _status.stdout is defined
          - _status.stdout | length > 0
        fail_msg: >-
          timedatectl timesync-status returned nothing on {{ inventory_hostname }};
          timesyncd is not running or not configured.
        success_msg: "timesyncd reported status on {{ inventory_hostname }}"
      when: not ansible_check_mode

  handlers:
    - name: Restart timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted
