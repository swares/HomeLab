---
# Home lab inventory — 192.168.1.0/24 (confirmed live IPs updated 2026-06-29)
#
# SECURITY: rotate all plaintext credentials from the original mindmap.
# Use SSH keys + Ansible Vault for secrets.
#
all:
  vars:
    ansible_user: swares
    lab_domain: lab.home.arpa
    lab_subnet: 192.168.1.0/24
    lab_gateway: 192.168.1.1

  children:
    # ---- Core: x86 NAS + k3s cluster ----
    microshift:          # group name kept for playbook compatibility; runs k3s now
      hosts:
        h4-core:
          ansible_host: 192.168.1.160    # Odroid-H4 Ultra, MAC 00:1E:06:45:99:E5, wired; k3s node name: odroid-nas
          # ansible_connection was 'local' when running Ansible from h4-core itself.
          # Semaphore runs in a pod on n150-1, so use SSH instead.
          node_ip: 192.168.1.160
          boot_device: /dev/mmcblk0
          microshift_lvm_file: /mnt/nvme0n1p2/microshift-lvm.img
          microshift_lvm_size: 2000G
          microshift_loop_dev: /dev/loop100
          microshift_pv_device: /dev/loop100
          microshift_vg: vg_microshift
          nas_lv: lv_nas
          nas_mount: /srv/nas
          cold_primary_device: /dev/md1
          cold_primary_mount: /mnt/cold-8t
          cold_secondary_device: /dev/md0
          cold_secondary_mount: /mnt/cold-sec

    # ---- DNS: Pi-hole primary on octopi (RPi 3B #2, wired) + secondary on a Zero 2W ----
    dns:
      vars:
        # kube-vip service VIP for Traefik — floats between control-plane nodes.
        # Was 192.168.1.160 (the H4) until 2026-07-27: a single A record that every
        # *.apps name CNAMEs to, so losing that one host took down every service
        # URL in the lab — even though k3s servicelb had Traefik answering on all
        # five node IPs the whole time. The single point was this record, not the
        # cluster. See gitops/workloads/kube-vip/traefik-vip-service.yaml.
        #
        # Rollback: set back to any node IP. servicelb is deliberately left
        # enabled, so every node still serves 80/443 directly.
        ingress_vip: 192.168.1.201
        dns_upstream: ["1.1.1.1", "9.9.9.9"]
        dns_records:
          h4-core:      192.168.1.160
          api:          192.168.1.200    # kube-vip VIP — k3s control-plane HA endpoint
          ha:           192.168.1.116    # Home Assistant (RPi 4B) — direct host access
          rpi5:         192.168.1.128
          rpi4b:        192.168.1.116
          octopi:       192.168.1.148
          opi-zero2w-1: 192.168.1.184
          opi-zero2w-2: 192.168.1.188
          opi-zero2w-4: 192.168.1.99
          n150-1:       192.168.1.42
          n150-2:       192.168.1.21
          n150-3:       192.168.1.176
          xu3-1:        192.168.1.64
          opi5pro-1:    192.168.1.168
          opi5pro-2:    192.168.1.172
          hostmon:      192.168.1.82
          opi-zero2w-3: 192.168.1.217
          m5stack:      192.168.1.71
          cores3:       192.168.1.71    # alias — M5Stack Core S3 (ESP32-S3)
          gitlab-1:     192.168.1.50    # GitLab CE VM on n150-1
          gitlab:       192.168.1.50    # gitlab.lab.home.arpa CNAME-equivalent
        dns_unfiltered_clients:
          - { ip: 192.168.1.160, name: h4-core }
          - { ip: 192.168.1.128, name: rpi5 }
          - { ip: 192.168.1.184, name: opi-zero2w-1 }
          - { ip: 192.168.1.188, name: opi-zero2w-2 }
          - { ip: 192.168.1.99,  name: opi-zero2w-4 }
          - { ip: 192.168.1.176, name: n150-3 }
          - { ip: 192.168.1.168, name: opi5pro-1 }
          - { ip: 192.168.1.42,  name: n150-1 }
          - { ip: 192.168.1.21,  name: n150-2 }
          - { ip: 192.168.1.64,  name: xu3-1 }
      hosts:
        dns-1:
          ansible_host: 192.168.1.148    # octopi — RPi 3B #2, wired; Pi-hole v6 primary
          dns_role: primary
          dns_engine: pihole
        dns-2:
          ansible_host: 192.168.1.184    # opi-zero2w-1 — secondary DNS (dnsmasq fallback)
          dns_role: secondary
        dns-4:
          ansible_host: 192.168.1.217    # opi-zero2w-3 — Armbian Trixie, WiFi; secondary DNS (dnsmasq)
          dns_role: secondary
          dns_engine: dnsmasq

    # ---- OpenVINO Model Server — Intel iGPU hosts ----
    ovms:
      hosts:
        h4-core:
        n150-1:
          ansible_host: 192.168.1.42
        n150-2:
          ansible_host: 192.168.1.21

    # ---- AI escalation orchestrator (Tier 3) ----
    orchestrator:
      hosts:
        opi5pro-1:
          ansible_host: 192.168.1.168
          orchestrator_workdir: /srv/lab-workdir
          orchestrator_port: 8443

    # ---- k3s cluster ----
    k3s_server:
      hosts:
        h4-core:
        n150-1:
          ansible_host: 192.168.1.42
          node_ip: 192.168.1.42
        n150-2:
          ansible_host: 192.168.1.21
          node_ip: 192.168.1.21

    # Hosts pending promotion to k3s server (run k3s-ha-join.yml one at a time)
    k3s_new_servers:
      hosts:
        n150-1:
          ansible_host: 192.168.1.42
          node_ip: 192.168.1.42
        n150-2:
          ansible_host: 192.168.1.21
          node_ip: 192.168.1.21

    k3s_agents:
      hosts:
        opi5pro-1:
          ansible_host: 192.168.1.168    # arm64 inference agent
        opi5pro-2:
          ansible_host: 192.168.1.172    # arm64 inference agent

    # ---- KVM hypervisors (Ubuntu 24.04, SSH) ----
    kvm_hosts:
      vars:
        ansible_become: true
      hosts:
        n150-1:
          ansible_host: 192.168.1.42     # MAC 4A-6D-B5-BC-56-98, wired; hosts ldap-1 VM
        n150-2:
          ansible_host: 192.168.1.21     # MAC 16-3C-00-47-C0-6E, wired

    # ---- Windows HTPC ----
    x86_nodes:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_scheme: http
        ansible_port: 5985
        ansible_shell_type: powershell
        ansible_become: false
        ansible_user: ansible
      hosts:
        n150-3:
          ansible_host: 192.168.1.176    # HTPC (TV/living room), MAC 98-BD-80-5C-4C-D4

    # ---- Foundation service hosts ----
    vault:
      hosts:
        rpi5:
          ansible_host: 192.168.1.128

    # ---- Home Assistant (RPi 4B, Docker container) ----
    home_assistant:
      hosts:
        rpi4b:
          ansible_host: 192.168.1.116    # RPi 4B 8GB, wired; repurposed from DNS secondary

    mqtt:
      hosts:
        opi-zero2w-2:
          ansible_host: 192.168.1.188
          mqtt_bridge_peer: 192.168.1.99   # bridge to opi-zero2w-4
        opi-zero2w-4:
          ansible_host: 192.168.1.99
          mqtt_bridge_peer: 192.168.1.188  # bridge to opi-zero2w-2

    # ---- Orange Pi Zero 2W pool ----
    opi_zero2w:
      hosts:
        opi-zero2w-1:
          ansible_host: 192.168.1.184
        opi-zero2w-2:
          ansible_host: 192.168.1.188
        opi-zero2w-3:
          ansible_host: 192.168.1.217    # MAC 5C:B3:9F:3B:63:27, WiFi 2.4G
        opi-zero2w-4:
          ansible_host: 192.168.1.99

    # lldap group removed — lldap-1 VM decommissioned 2026-07-18;
    # lldap now runs as k3s Deployment in the lldap namespace.

    standalone_vms:
      hosts:
        # ldap-1 removed — VM decommissioned 2026-07-18; lldap migrated to k3s
        gitlab-1:
          ansible_host:    192.168.1.50
          kvm_host:        n150-1
          libvirt_vm_name: gitlab-1
          health_check_url: "https://192.168.1.50/-/health"

    # ---- GitLab CE (KVM VM on n150-1) ----
    gitlab_servers:
      hosts:
        gitlab-1:
          ansible_host: 192.168.1.50    # Ubuntu 22.04 VM; gitlab.lab.home.arpa

    # ---- node_exporter — non-cluster Linux hosts (cluster nodes get it via DaemonSet) ----
    # n150-1 and n150-2 removed: now k3s server nodes, covered by the DaemonSet.
    # The k3s cluster is ONLY h4-core + n150-1/2 (servers) and opi5pro-1/2 (agents).
    # rpi5 (Vault), xu3-1 (build agent) and gitlab-1 (VM) are NOT cluster nodes and
    # never received the DaemonSet — added 2026-07-26 after the lab-health dashboard
    # showed them as scrape targets with no exporter listening.
    node_exporter:
      hosts:
        octopi-dns:
          ansible_host: 192.168.1.148
        rpi4b:
          ansible_host: 192.168.1.116
        opi-zero2w-1:
          ansible_host: 192.168.1.184
        opi-zero2w-2:
          ansible_host: 192.168.1.188
        opi-zero2w-3:
          ansible_host: 192.168.1.217
        opi-zero2w-4:
          ansible_host: 192.168.1.99
        rpi5:
          ansible_host: 192.168.1.128
        # gitlab-1 deliberately NOT here. GitLab Omnibus ships its own
        # node_exporter already bound to 127.0.0.1:9100, so the Debian package
        # can't bind 0.0.0.0:9100 and its unit dies on start. Expose the bundled
        # one instead — in /etc/gitlab/gitlab.rb set
        #   node_exporter['listen_address'] = '0.0.0.0:9100'
        # then `gitlab-ctl reconfigure`. See docs/ for the scrape target list.

    # ---- node_exporter via upstream binary — hosts the apt module can't serve ----
    # xu3-1 is Ubuntu 16.04 armhf. The apt module re-execs itself under whichever
    # interpreter can import python3-apt (/usr/bin/python3 = 3.5), ignoring the
    # ansible_python_interpreter=3.11 set in host_vars — and ansible-core 2.17
    # source is not parseable by 3.5. Xenial's packaged exporter is also 0.12,
    # which predates the node_cpu_seconds_total metric naming the dashboards use.
    # Install the upstream static binary instead.
    node_exporter_binary:
      hosts:
        xu3-1:
          ansible_host: 192.168.1.64
          node_exporter_arch: linux-armv7

    # ---- Embedded / firmware devices (not Ansible-managed; inventory for DNS only) ----
    embedded:
      vars:
        ansible_connection: local   # placeholder — these are not SSH targets
      hosts:
        hostmon:
          ansible_host: 192.168.1.82    # Waveshare 4.3" ESP32-S3, MAC DC:DA:0C:48:AB:D0, wired
        m5stack:
          ansible_host: 192.168.1.71    # M5Stack LLM ESP32-S3, MAC 48:27:E2:79:0D:98, wired (station mode)

    # ---- Standalone Linux hosts ----
    standalone:
      hosts:
        rpi5:
          ansible_host: 192.168.1.128
        octopi-dns:
          ansible_host: 192.168.1.148
        opi-zero2w-2:
          ansible_host: 192.168.1.188
        xu3-1:
          ansible_host: 192.168.1.64
        # ldap-1 removed — VM decommissioned 2026-07-18
