# NetworkPolicies for the ai-gateway namespace.
# Restricts ingress to Traefik only; restricts egress to ollama pods and DNS.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ai-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow Traefik (kube-system) to reach litellm on port 4000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 4000
---
# Allow Prometheus to scrape litellm's /metrics on 4000.
#
# default-deny-all above covers every pod in this namespace, and the Traefik rule
# admits only kube-system — so the ServiceMonitor for litellm had nowhere to
# connect from. This was written up as H6 in docs/REVIEW-2026-07-24.md and was
# invisible for a further three days because the ServiceMonitor itself was being
# ignored by Prometheus (serviceMonitorSelectorNilUsesHelmValues), so the scrape
# never even registered as failing. Two independent faults hiding each other.
#
# Note k3s REJECTs rather than DROPs denied traffic, so this presented as
# "connection refused" rather than a timeout — which reads like a wrong port and
# sends you looking in the wrong place.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape-from-monitoring
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4000
---
# Allow litellm to reach ollama pods within the same namespace (port 11434).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-to-ollama
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ollama, ollama-2]
      ports:
        - port: 11434
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow ollama pods to receive requests from litellm.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-from-litellm
  namespace: ai-gateway
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ollama, ollama-2]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litellm
      ports:
        - port: 11434
---
# Allow litellm egress to external cloud AI APIs (Groq, Gemini) over HTTPS.
# No `to` selector = allow to any destination on port 443 (public internet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-cloud-egress
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# Allow m5stack-adapter egress to the M5Stack device (external HTTPS on port 443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-m5stack-adapter-egress
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app: m5stack-adapter
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
