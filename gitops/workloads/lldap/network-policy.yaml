# NetworkPolicies for the lldap namespace.
# Default-deny all, allow only LDAP from authelia and HTTP UI from Traefik.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lldap
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow LDAP (3890) from authelia namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ldap-from-authelia
  namespace: lldap
spec:
  podSelector:
    matchLabels:
      app: lldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authelia
          podSelector:
            matchLabels:
              app: authelia
      ports:
        - port: 3890
---
# Allow HTTP UI (17170) from Traefik for the lldap web interface.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-from-traefik
  namespace: lldap
spec:
  podSelector:
    matchLabels:
      app: lldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 17170
---
# Allow backup CronJob egress: DNS + SSH to odroid-nas for restic over SFTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress
  namespace: lldap
spec:
  podSelector:
    matchLabels:
      app: lldap-backup
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.1.160/32
      ports:
        - port: 22
          protocol: TCP
    # Added 2026-07-25: the backup now runs pg_dump against Postgres rather than
    # reading a SQLite file off a mounted PVC, so it needs to reach the database.
    - to:
        - podSelector:
            matchLabels:
              app: lldap-postgres
      ports:
        - port: 5432
          protocol: TCP
---
# Allow lldap egress: DNS, plus Postgres now that state lives there (2026-07-25).
# Without the 5432 rule the default-deny policy above silently blocks lldap from
# reaching its own database and the pod never becomes ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lldap-egress-dns
  namespace: lldap
spec:
  podSelector:
    matchLabels:
      app: lldap
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: lldap-postgres
      ports:
        - port: 5432
          protocol: TCP
---
# Postgres accepts connections only from lldap itself and from the backup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-lldap
  namespace: lldap
spec:
  podSelector:
    matchLabels:
      app: lldap-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lldap
        - podSelector:
            matchLabels:
              app: lldap-backup
      ports:
        - port: 5432
          protocol: TCP
