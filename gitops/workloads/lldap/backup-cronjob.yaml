apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-backup
  namespace: lldap
spec:
  # 02:30 daily. The host backup-nas timer writes the SAME restic repo at 01:30,
  # so in principle the two contend for the repo lock. Measured 2026-08-04:
  # backup-nas runs 01:30:00 -> 01:30:14 every night (incremental, plus the copy
  # to /mnt/cold-sec), so the windows do not actually overlap. Left at 02:30;
  # revisit if backup-nas ever grows past an hour.
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: lldap-backup
        spec:
          restartPolicy: OnFailure
          # No PVC mount any more — lldap's data lives in Postgres as of
          # 2026-07-25, so this dumps the database over the network instead of
          # reading a SQLite file. That also means this job is no longer pinned
          # by PV affinity and can run on any node.
          securityContext:
            runAsUser: 0

          # Split into two stock images rather than one image plus a runtime
          # install. The previous version ran `apk add --no-cache restic` inside
          # postgres:16-alpine on every run, which made each nightly backup
          # depend on dl-cdn.alpinelinux.org being reachable over TLS at 02:30.
          # On 2026-08-04 it was not:
          #
          #   WARNING: fetching .../aarch64/APKINDEX.tar.gz: TLS: unspecified error
          #   ERROR: unable to select packages:
          #     restic (no such package): required by: world[restic]
          #
          # restic was not missing — the package index fetch failed, so apk had
          # no catalogue. The job exited non-zero twice and hit backoffLimit 64
          # seconds in, and that night's snapshot was lost. Nothing is fetched at
          # runtime now.
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lldap-secrets
                      key: db_password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "Dumping lldap database..."
                  pg_dump -h lldap-postgres -U lldap -d lldap > /dump/lldap.sql

                  # A dump that is well-formed but EMPTY is more dangerous than a
                  # missing one, because it looks like a successful backup. This
                  # is the same failure shape as the 4 KB etcd "snapshots" and the
                  # empty pg_dumps found on 2026-07-25 — assert on content.
                  #
                  # Failing here means the restic container never runs, so a bad
                  # dump can no longer reach the repository.
                  size=$(wc -c < /dump/lldap.sql)
                  if [ "$size" -lt 1000 ]; then
                    echo "FAIL: dump is only ${size} bytes — refusing to back up an empty database" >&2
                    exit 1
                  fi
                  grep -q "CREATE TABLE" /dump/lldap.sql || {
                    echo "FAIL: dump contains no CREATE TABLE statements" >&2
                    exit 1
                  }
                  echo "  dump ok (${size} bytes)"
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi

          containers:
            # Verified 2026-08-04 on linux/arm64:
            #   restic 0.17.3 compiled with go1.23.3 on linux/arm64
            # Alpine-based, so /bin/sh exists and the default entrypoint can be
            # overridden. Pinned deliberately — an unpinned tag would reintroduce
            # exactly the kind of external dependency this change removes.
            - name: restic-backup
              image: restic/restic:0.17.3
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTIC_PASSWORD_FILE
                  value: /secrets/restic-password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  REPO="/restic-repo"

                  restic -r "$REPO" snapshots > /dev/null 2>&1 || restic -r "$REPO" init

                  restic -r "$REPO" backup /dump/lldap.sql \
                    --tag lldap \
                    --host lldap-k8s

                  echo "Backup complete. Recent lldap snapshots:"
                  # --latest, not --last. restic deprecated --last and it no
                  # longer takes a count, so `--last 5` parsed the 5 as a
                  # snapshot ID, prefix-matched 59a16050, and printed one
                  # unrelated snapshot while silently ignoring --tag:
                  #   Flag --last has been deprecated, use --latest 1
                  #   Ignoring "filters": explicit snapshot ids are given
                  restic -r "$REPO" snapshots --tag lldap --latest 5
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: backup-secrets
                  mountPath: /secrets
                  readOnly: true
                - name: restic-repo
                  mountPath: /restic-repo
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi

          volumes:
            # Hands the dump from the init container to the backup container.
            # Lives and dies with the pod; nothing persists here.
            - name: dump
              emptyDir: {}
            - name: backup-secrets
              secret:
                secretName: lldap-backup-secrets
            - name: restic-repo
              nfs:
                server: 192.168.1.160
                path: /mnt/cold-8t/restic
