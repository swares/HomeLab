apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authelia-pdb
  namespace: authelia
spec:
  # See gitops/workloads/lldap/pdb.yaml for the full reasoning. Short version:
  # authelia runs replicas: 1, and minAvailable: 1 on a single-replica workload
  # makes the pod permanently un-evictable — `kubectl drain` can never be granted
  # permission, so node maintenance fails instead of proceeding.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: authelia
