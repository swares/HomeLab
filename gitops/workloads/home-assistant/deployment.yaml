apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7.2
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
      initContainers:
        - name: seed-config
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/configuration.yaml ]; then
                cat > /config/configuration.yaml << 'EOF'
              # Home Assistant configuration
              # https://www.home-assistant.io/docs/configuration/

              default_config:

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.42.0.0/16   # k3s pod CIDR (Traefik)
                  - 127.0.0.1

              mqtt:
                sensor:
                  - name: "M5Stack Battery Voltage"
                    state_topic: "m5stack/pmic"
                    value_template: "{{ value_json.values.vbat }}"
                    unit_of_measurement: "V"
                    device_class: voltage
                  - name: "M5Stack Battery"
                    state_topic: "m5stack/pmic"
                    value_template: "{{ value_json.values['bat%'] }}"
                    unit_of_measurement: "%"
                    device_class: battery
                  - name: "M5Stack LLM Busy"
                    state_topic: "m5stack/llm"
                    value_template: "{{ value_json.values.busy }}"
                  - name: "M5Stack Claude Queries"
                    state_topic: "m5stack/claude"
                    value_template: "{{ value_json.values.queries }}"
                  - name: "M5Stack Claude Turns"
                    state_topic: "m5stack/claude"
                    value_template: "{{ value_json.values.turns }}"
                  - name: "M5Stack Uptime"
                    state_topic: "m5stack/route"
                    value_template: "{{ value_json.uptime }}"
                    unit_of_measurement: "s"
              EOF
                echo "Seeded /config/configuration.yaml"
              else
                echo "/config/configuration.yaml already exists, skipping"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
          # BACKLOG §4.10. This initContainer ran with NO resources block at all while
          # the main container above has limits — and `require-resource-limits` is in
          # **Enforce**, so this was a live workload sitting in a hole in an enforced
          # policy, not a hypothetical audit gap.
          #
          # The policy's pattern validates `spec.containers` only. Kubernetes treats
          # initContainers as a separate list, so they were never examined. Fixing the
          # policy without fixing this first would make Home Assistant fail admission
          # on its next pod recreation, which is why this lands as its own change:
          # kyverno-policies and home-assistant are separate Argo Applications with no
          # controllable sync order between them.
          #
          # Sized for what it does — a busybox `sh` that writes one file and exits.
          # Verified 2026-09-05 as the ONLY offender cluster-wide, by querying live
          # pods rather than the repo, since Helm-rendered pods have no manifest here:
          #   kubectl get pods -A -o json | jq '... .spec.initContainers[] ...'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
