apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip-ds
spec:
  selector:
    matchLabels:
      app: kube-vip-ds
  template:
    metadata:
      labels:
        app: kube-vip-ds
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          operator: Exists
      hostNetwork: true
      serviceAccountName: kube-vip
      containers:
        - name: kube-vip
          # Check https://github.com/kube-vip/kube-vip/releases for latest version
          image: ghcr.io/kube-vip/kube-vip:v1.2.3
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            # ARP mode — works on a flat L2 LAN (192.168.1.0/24)
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            # Empty interface = auto-detect from routing table (requires kube-vip ≥ v0.5.12)
            # Works across H4 (direct NIC) and n150s (br0 bridge) without per-node config
            - name: vip_interface
              value: ""
            - name: vip_cidr
              value: "32"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system

            # ── Service VIPs, scoped by loadBalancerClass ────────────────────
            # Was svc_enable: false, with the comment "k3s servicelb handles
            # LoadBalancer services". servicelb still does — this does not
            # replace it.
            #
            # lb_class_only restricts kube-vip to Services that explicitly carry
            # lb_class_name. k3s servicelb, conversely, ignores any Service with
            # a non-default loadBalancerClass. So the two never contend for the
            # same object and never fight over services/status. Traefik's own
            # Service is untouched and still answers on every node IP; the new
            # traefik-vip Service (see traefik-vip-service.yaml) is owned solely
            # by kube-vip.
            #
            # That is what makes this additive: no k3s flag change, no server
            # restart, no window where ingress has no address. Reverting is
            # setting svc_enable back to "false".
            - name: svc_enable
              value: "true"
            # Per-service leader election, so the service VIP can live on a
            # different node from the control-plane VIP rather than pinning both
            # to one host — which would defeat the point.
            - name: svc_election
              value: "true"
            - name: lb_class_only
              value: "true"
            - name: lb_class_name
              value: "kube-vip.io/kube-vip-class"
            # Leader election — only one node owns the VIP at a time
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
            - name: address
              value: "192.168.1.200"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_TIME
