---
# Scrape Immich server metrics.
#
# Port `metrics` (8081), NOT the main 2283. Immich serves no metrics at all
# unless IMMICH_TELEMETRY_INCLUDE is set (see immich/configmap.yaml), and then
# only on a dedicated port. Pointed at 2283 this scraped the web UI and
# Prometheus rejected the text/html response.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [immich]
  selector:
    matchLabels:
      app: immich-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s

# LiteLLM has no ServiceMonitor deliberately.
#
# Its Prometheus callback is an Enterprise feature: /metrics returns 404 without
# a licence, and from v1.85.0 the endpoint also requires API-key auth. This lab
# runs v1.93.0 unlicensed, so a ServiceMonitor here can only ever produce a
# permanently-down target.
#
# That matters beyond tidiness. docs/REVIEW-2026-07-24.md H27 describes an alert
# that was permanently critical and therefore ignored — "training you to ignore
# the one alert group that matters most". A target you have decided to accept as
# red does the same thing to every other red target. Absent and documented beats
# present and known-broken.
#
# The allow-metrics-scrape-from-monitoring NetworkPolicy in ai-gateway is left in
# place: it is correct if this is ever licensed, and permits nothing else.
---
# Scrape the ArgoCD application controller.
#
# Added 2026-07-27 after scripts/verify-lab.py found `argocd_app_info` had zero
# series: nothing had ever scraped ArgoCD, so LabArgoCDAppOutOfSync and
# LabArgoCDAppDegraded in lab-alerts.yaml could never fire. The rules had been
# in git for weeks looking entirely healthy.
#
# argocd_app_info — sync_status and health_status per Application — comes from
# the application controller on the `argocd-metrics` Service, port 8082. The
# server, repo-server and applicationset controllers expose their own metrics on
# separate Services; add them if you want request/latency data, but they do not
# carry app sync state.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
