---
# Lab-specific Prometheus alerting rules.
#
# What's NOT here (already covered by kube-prometheus-stack built-ins):
#   - Disk space:     NodeFilesystemAlmostOutOfSpace (warn@85%, crit@97%)
#                     NodeFilesystemSpaceFillingUp (predictive)
#   - RAID:           NodeRAIDDegraded, NodeRAIDDiskFailure
#   - Pod health:     KubePodCrashLooping, KubePodNotReady
#   - k3s node:       KubeNodeNotReady, KubeNodeUnreachable
#
# What IS here (gaps not covered by built-ins):
#   - External (non-cluster) host down
#   - Backup timer silence  [needs --collector.systemd on node_exporter — see NOTE below]
#   - VM in crashed state
#   - ArgoCD app out-of-sync / degraded
#
# NOTE — history of the systemd-based rules below (fixed 2026-08-02).
#
#   2026-07-26 concluded these rules "cannot work as written", on the theory
#   that node_exporter reads systemd via /run/systemd/private, which is
#   root-only and unmounted. That diagnosis was wrong.
#
#   The pod log on 2026-08-02 named the actual path:
#
#     couldn't get dbus connection: dial unix
#     /var/run/dbus/system_bus_socket: no such file or directory
#
#   It wants the D-Bus SYSTEM bus, not systemd's private socket. That socket is
#   mode srw-rw-rw- and systemd's policy permits unprivileged reads of unit
#   state, so neither root nor a writable rootfs is needed — the socket just has
#   to be mounted into the pod. gitops/apps/monitoring.yaml now does that via
#   extraHostVolumeMounts, and node_systemd_* metrics are available.
#
#   Note the collector is scoped by --collector.systemd.unit-include to
#   backup-nas and backup-etcd only. Any rule referencing a unit outside that
#   regex will still see no metric. Widen the regex before adding one.
#
#   Also: lldap-backup is a Kubernetes CronJob, not a systemd timer, so it
#   produces no node_systemd_* series at all. Alert on it via
#   kube_cronjob_status_last_successful_time from kube-state-metrics instead.
#
#   Backup silence IS covered — by healthchecks.io, configured in
#   ansible/playbooks/healthchecks.yml, which pings on each successful run and
#   alerts when a check goes quiet past its grace period. That is the real
#   dead-man's switch; treat these rules as aspirational until either the
#   DaemonSet gains the socket mount and root, or they are rewritten.
#
#   Do not add new rules against node_systemd_* metrics without first checking
#   node_scrape_collector_success{collector="systemd"}.
#
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-alerts
  namespace: monitoring
  labels:
    # Picked up by prometheus-operator (ruleNamespaceSelector: {} in prometheusSpec)
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:

    # -----------------------------------------------------------------------
    # External hosts (non-cluster static scrape targets)
    # -----------------------------------------------------------------------
    - name: lab.external-hosts
      rules:
        - alert: LabExternalHostDown
          expr: up{job="node-exporter-external"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "External host {{ $labels.instance }} is down"
            description: >
              node_exporter on {{ $labels.instance }} has been unreachable for
              more than 3 minutes.  Check power, network, and service status.

    # -----------------------------------------------------------------------
    # Backup timers — requires --collector.systemd on the H4 DaemonSet pod
    # -----------------------------------------------------------------------
    - name: lab.backups
      rules:
        - alert: LabBackupNasSilent
          # Fires when backup-nas.timer last ran more than 25 hours ago.
          # absent() fires if the metric doesn't exist (collector not enabled).
          expr: |
            (
              time() - node_systemd_timer_last_trigger_time_seconds{
                name="backup-nas.timer",
                instance=~"192\\.168\\.1\\.160.*"
              }
            ) > 90000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "backup-nas has not run in >25 hours"
            description: >
              The backup-nas.timer on the H4 last triggered more than 25 hours
              ago.  Check journalctl -u backup-nas.service on the H4.

        - alert: LabBackupEtcdSilent
          expr: |
            (
              time() - node_systemd_timer_last_trigger_time_seconds{
                name="backup-etcd.timer",
                instance=~"192\\.168\\.1\\.160.*"
              }
            ) > 90000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "backup-etcd has not run in >25 hours"
            description: >
              The backup-etcd.timer on the H4 last triggered more than 25 hours
              ago.  Check journalctl -u backup-etcd.service on the H4.

        - alert: LabBackupNasFailed
          # Catches a failed service exit even without the systemd collector,
          # as long as node_systemd_unit_state is available.
          expr: |
            node_systemd_unit_state{
              name="backup-nas.service",
              state="failed",
              instance=~"192\\.168\\.1\\.160.*"
            } == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "backup-nas.service is in failed state"
            description: >
              backup-nas.service on the H4 has exited with a failure.
              Run: journalctl -u backup-nas.service -n 50

    # -----------------------------------------------------------------------
    # Disk headroom check — ansible/playbooks/disk-check-timer.yml on the H4
    #
    # Complements NodeFilesystemAlmostOutOfSpace (built-in, warns at 85%) rather
    # than duplicating it: this fires at 85% too, but also reports how much
    # unallocated LVM space is available, which is usually the cheap fix. On
    # 2026-07-26 n150-1 filled its 50G root while 24G sat unallocated in the
    # same volume group, and the built-in alert could not have told you that.
    # -----------------------------------------------------------------------
    - name: lab.disk
      rules:
        - alert: LabNodeDiskLow
          # Deliberately NOT based on node_systemd_* — see the lab.backups note.
          # Mirrors the disk_fail_percent threshold in check-disk-space.yml so the
          # weekly playbook and this alert agree. The playbook adds the part
          # Prometheus cannot: how much unallocated LVM space is available.
          expr: |
            (
              1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            ) * 100 > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} root filesystem over 85%"
            description: >
              {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% on /.
              Check `vgs` on that host BEFORE trimming Prometheus retention or
              pruning images — on 2026-07-26 n150-1 filled a 50G root while 24G
              sat unallocated in the same volume group, and lvextend -r was the
              cheap fix. Detail:
              ansible-playbook -i inventory/hosts.yml playbooks/check-disk-space.yml
              -e disk_check_deep=true

    # -----------------------------------------------------------------------
    # KVM / libvirt VMs
    # -----------------------------------------------------------------------
    - name: lab.vms
      rules:
        - alert: LabVMCrashed
          # libvirt state codes: 6=crashed
          expr: libvirt_domain_state_code == 6
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "VM {{ $labels.domain }} has crashed"
            description: >
              The libvirt domain {{ $labels.domain }} on {{ $labels.instance }}
              is in crashed state (code 6).  Inspect with:
              virsh list --all && virsh dominfo {{ $labels.domain }}

        - alert: LabVMUnexpectedShutoff
          # State 5=shut off.  Fires only for VMs that should always be running.
          # Adjust the domain filter to match your always-on VMs.
          #
          # Corrected 2026-07-25: this filtered on `ldap-1`, a VM decommissioned
          # on 2026-07-04 when lldap moved into k3s. The rule had therefore been
          # dead for three weeks — it could never fire, so an actual always-on VM
          # shutting down would have gone unnoticed. gitlab-1 is now the only
          # always-on VM in the lab (see README fleet table).
          expr: |
            libvirt_domain_state_code{domain=~"gitlab-1"} == 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "VM {{ $labels.domain }} is unexpectedly shut off"
            description: >
              {{ $labels.domain }} has been shut off for more than 5 minutes.
              If this was intentional, silence this alert.

    # -----------------------------------------------------------------------
    # ArgoCD sync health
    # -----------------------------------------------------------------------
    - name: lab.argocd
      rules:
        - alert: LabArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is out of sync"
            description: >
              {{ $labels.name }} has been in sync_status={{ $labels.sync_status }}
              for more than 15 minutes.  Check: argocd app get {{ $labels.name }}

        - alert: LabArgoCDAppDegraded
          expr: |
            argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is degraded"
            description: >
              {{ $labels.name }} health is {{ $labels.health_status }}.
              Check: argocd app get {{ $labels.name }}
