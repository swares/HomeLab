---
# Lab-specific Prometheus alerting rules.
#
# What's NOT here (already covered by kube-prometheus-stack built-ins):
#   - Disk space:     NodeFilesystemAlmostOutOfSpace (warn@85%, crit@97%)
#                     NodeFilesystemSpaceFillingUp (predictive)
#   - RAID:           NodeRAIDDegraded, NodeRAIDDiskFailure
#   - Pod health:     KubePodCrashLooping, KubePodNotReady
#   - k3s node:       KubeNodeNotReady, KubeNodeUnreachable
#
# What IS here (gaps not covered by built-ins):
#   - External (non-cluster) host down
#   - Backup timer silence  [needs --collector.systemd on node_exporter — see NOTE below]
#   - VM in crashed state
#   - ArgoCD app out-of-sync / degraded
#
# NOTE — history of the systemd-based rules below (fixed 2026-08-02).
#
#   2026-07-26 concluded these rules "cannot work as written", on the theory
#   that node_exporter reads systemd via /run/systemd/private, which is
#   root-only and unmounted. That diagnosis was wrong.
#
#   The pod log on 2026-08-02 named the actual path:
#
#     couldn't get dbus connection: dial unix
#     /var/run/dbus/system_bus_socket: no such file or directory
#
#   It wants the D-Bus SYSTEM bus, not systemd's private socket. That socket is
#   mode srw-rw-rw- and systemd's policy permits unprivileged reads of unit
#   state, so neither root nor a writable rootfs is needed — the socket just has
#   to be mounted into the pod. gitops/apps/monitoring.yaml does that via
#   extraHostVolumeMounts.
#
#   That alone fixed the two opi5pro nodes but not the three Ubuntu ones, which
#   then failed differently:
#
#     An AppArmor policy prevents this sender from sending this message to this
#     recipient; ... member="Hello" ... destination="org.freedesktop.DBus"
#
#   containerd applies its default AppArmor profile on Ubuntu, and dbus-daemon
#   mediates by peer profile. Orange Pi Jammy has no AppArmor, hence the split.
#   Fixed by setting appArmorProfile: Unconfined on the container — which
#   matters because backup-nas.timer and backup-etcd.timer exist only on
#   odroid-nas, one of the confined nodes, so the socket mount by itself
#   produced no useful metrics at all.
#
#   The collector was scoped by --collector.systemd.unit-include to backup-nas
#   and backup-etcd only. Widened 2026-08-07 to backup-.+\.(service|timer) so
#   backup-cloud, backup-verify and backup-offsite are visible too — they had
#   produced no series at all, so no rule could have covered them however it was
#   written. Any rule referencing a unit outside that regex still sees nothing;
#   widen the regex before adding one, and verify with:
#     curl -s http://<host>:9100/metrics | grep node_systemd_unit_state
#
#   Note the hosts differ. The H4 and the other cluster nodes run the DaemonSet
#   with the regex above; the rpi5 runs the Debian prometheus-node-exporter
#   package with ARGS="", whose systemd collector is enabled by default with
#   unit-include=".+" — every unit on that host is exposed without configuration.
#
#   Also: lldap-backup is a Kubernetes CronJob, not a systemd timer, so it
#   produces no node_systemd_* series at all. Alert on it via
#   kube_cronjob_status_last_successful_time from kube-state-metrics instead.
#
#   Backup silence IS covered — by healthchecks.io, configured in
#   ansible/playbooks/healthchecks.yml, which pings on each successful run and
#   alerts when a check goes quiet past its grace period. That is the real
#   dead-man's switch; treat these rules as aspirational until either the
#   DaemonSet gains the socket mount and root, or they are rewritten.
#
#   Do not add new rules against node_systemd_* metrics without first checking
#   node_scrape_collector_success{collector="systemd"}.
#
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-alerts
  namespace: monitoring
  labels:
    # Picked up by prometheus-operator (ruleNamespaceSelector: {} in prometheusSpec)
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:

    # -----------------------------------------------------------------------
    # External hosts (non-cluster static scrape targets)
    # -----------------------------------------------------------------------
    - name: lab.external-hosts
      rules:
        - alert: LabExternalHostDown
          expr: up{job="node-exporter-external"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "External host {{ $labels.instance }} is down"
            description: >
              node_exporter on {{ $labels.instance }} has been unreachable for
              more than 3 minutes.  Check power, network, and service status.

    # -----------------------------------------------------------------------
    # Backup timers — requires --collector.systemd on the H4 DaemonSet pod
    # -----------------------------------------------------------------------
    - name: lab.backups
      rules:
        - alert: LabBackupNasSilent
          # Fires when backup-nas.timer last ran more than 25 hours ago.
          # NOTE the metric name has no "_time" in it. These rules previously
          # read node_systemd_timer_last_trigger_TIME_seconds, which does not
          # exist, so they could never have fired even once the collector was
          # working. Verify names against the exporter before editing:
          #   curl -s http://192.168.1.160:9100/metrics | grep '^# HELP node_systemd'
          expr: |
            (
              time() - node_systemd_timer_last_trigger_seconds{
                name="backup-nas.timer",
                instance=~"192\\.168\\.1\\.160.*"
              }
            ) > 90000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "backup-nas has not run in >25 hours"
            description: >
              The backup-nas.timer on the H4 last triggered more than 25 hours
              ago.  Check journalctl -u backup-nas.service on the H4.

        - alert: LabBackupEtcdSilent
          expr: |
            (
              time() - node_systemd_timer_last_trigger_seconds{
                name="backup-etcd.timer",
                instance=~"192\\.168\\.1\\.160.*"
              }
            ) > 90000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "backup-etcd has not run in >25 hours"
            description: >
              The backup-etcd.timer on the H4 last triggered more than 25 hours
              ago.  Check journalctl -u backup-etcd.service on the H4.

        - alert: LabBackupVaultSilent
          # rpi5 runs the Debian node_exporter package, whose systemd collector
          # has always worked — this series was available the whole time and
          # simply had no rule against it. Confirmed present 2026-08-02 under
          # job="node-exporter-external", instance="192.168.1.128".
          expr: |
            (
              time() - node_systemd_timer_last_trigger_seconds{
                name="backup-vault.timer",
                instance=~"192\\.168\\.1\\.128.*"
              }
            ) > 90000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "backup-vault has not run in >25 hours"
            description: >
              backup-vault.timer on rpi5 last triggered more than 25 hours ago.
              Check journalctl -u backup-vault.service on 192.168.1.128.

        - alert: LabBackupUnitFailed
          # Generalised 2026-08-07 from LabBackupNasFailed, which named a single
          # unit on a single host.
          #
          # WHY THIS RULE EXISTS SEPARATELY FROM THE *Silent RULES ABOVE
          #
          # The *Silent rules watch node_systemd_timer_last_trigger_seconds —
          # when the TIMER last fired. backup-vault.service failed on 04, 05 and
          # 06 Aug while its timer fired punctually at 02:30 every night, so
          # LabBackupVaultSilent was structurally incapable of noticing: the
          # thing it measures was healthy throughout. Three days of missing Vault
          # raft snapshots went unseen, and were found only while chasing an
          # unrelated problem.
          #
          # "Did it start?" and "did it work?" are different questions. Keep both
          # rules: a timer that stops firing produces no failed state either.
          #
          # A failed oneshot stays in state="failed" until its next successful
          # run, so this stays firing for the whole gap rather than for an
          # instant.
          #
          # Coverage depends on the collector's unit-include regex, widened the
          # same day to backup-.+\.(service|timer) in gitops/apps/monitoring.yaml.
          # Before assuming a unit is covered:
          #   curl -s http://<host>:9100/metrics | grep node_systemd_unit_state
          expr: |
            node_systemd_unit_state{
              name=~"backup-.+\\.service",
              state="failed"
            } == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.name }} failed on {{ $labels.instance }}"
            description: >
              {{ $labels.name }} on {{ $labels.instance }} is in failed state.
              Run: journalctl -u {{ $labels.name }} -n 50
              On 2026-08-04 backup-vault failed this way for three consecutive
              nights while its timer kept firing on schedule, and nothing alerted.

        - alert: LabBackupJobFailed
          # Added 2026-08-07. The built-in KubeJobFailed covers this, but it is
          # severity=warning, and the Alertmanager tree sends warnings to the
          # m5stack display only — so four failed backup Jobs sat firing, with
          # zero silences, for days while nobody saw them. A failed backup
          # deserves the phone.
          #
          # Two deliberate choices:
          #
          # 1. kube_job_failed, NOT kube_job_status_failed. The first is a Job
          #    *condition* (1 when the Job has failed). The second counts failed
          #    *pods*, which is nonzero for a Job that retried and then
          #    succeeded — it would page on healthy backups.
          #
          # 2. The 24h start-time bound. A failed Job persists until
          #    failedJobsHistoryLimit rotates it out (3 here), so without this
          #    the alert fires indefinitely for a failure already dealt with.
          #    That is precisely how the four stale KubeJobFailed alerts
          #    accumulated. Bounding on start time means it pages for the
          #    failure, not for the wreckage.
          #
          # Scoped by name pattern rather than by naming each CronJob, so a new
          # backup job is covered on creation. Compare LabVMUnexpectedShutoff,
          # which named a VM decommissioned three weeks earlier and was
          # therefore dead for three weeks.
          expr: |
            kube_job_failed{condition="true", job_name=~".*backup.*"} == 1
            and on(namespace, job_name)
            (time() - kube_job_status_start_time < 86400)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: >-
              Backup job {{ $labels.namespace }}/{{ $labels.job_name }} failed
            description: >
              A backup Job failed within the last 24h. Check:
              kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}
              The alert clears when the Job ages past 24h or is deleted; delete
              it once handled rather than waiting, so the next failure is
              visible against a clean board.

        - alert: LabCronJobStale
          # Backups that run as Kubernetes CronJobs rather than systemd timers,
          # so no node_systemd_* rule can see them. Verified 2026-08-02:
          #   kube_cronjob_status_last_successful_time  series=2
          #     immich/immich-db-backup   19.6h ago
          #     lldap/lldap-backup        18.6h ago
          #
          # Both are daily, so 26h gives ~1h margin over the 24h period — the
          # same shape as the systemd timer rules above. Deliberately unscoped
          # so new CronJobs are covered automatically. A CronJob scheduled less
          # often than 26h would fire permanently and must be excluded here.
          #
          # Known gap: a CronJob that has NEVER succeeded exposes no
          # last_successful_time series at all, so this rule cannot see it.
          # To cover that case as well:
          #   kube_cronjob_info
          #     unless on(namespace, cronjob)
          #   kube_cronjob_status_last_successful_time
          # (not added here — it also fires for a newly created CronJob until
          # its first run completes.)
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time
            ) > 93600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: >-
              CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not
              succeeded in >26h
            description: >
              Last successful run was more than 26 hours ago. On 2026-08-02
              lldap-backup was found hung on an unreachable NFS mount for 3d15h
              with nothing alerting on it. Check:
              kubectl -n {{ $labels.namespace }} get jobs
              --sort-by=.metadata.creationTimestamp

    # -----------------------------------------------------------------------
    # Time sync
    # -----------------------------------------------------------------------
    - name: lab.time
      rules:
        - alert: LabClockUnsynced
          # Added 2026-08-26, after n150-2 — an etcd VOTER — ran 18 hours with no
          # time sync at all.
          #
          # WHY THIS EXISTS ALONGSIDE THE BUILT-IN NodeClockNotSynchronising
          #
          # It does not, quite: this alerts on the same metric. What changes is
          # `for:` and severity. The built-in is a warning, and warnings route to
          # the m5stack display only — the same routing gap that let four failed
          # backup Jobs sit unseen for days (see LabBackupJobFailed above). An
          # etcd member losing time deserves the phone.
          #
          # What actually happened: unattended-upgrades restarted systemd-networkd,
          # chronyd marked all 17 sources offline on ENETUNREACH, and nothing ever
          # brought them back — the chrony package's come-back-online hooks target
          # ifupdown and dhclient, neither of which is installed. Fixed in
          # ansible/chrony.yml with a networkd-dispatcher routable.d hook.
          #
          # The lesson in the threshold: the CONDITION (no sources online) existed
          # at 06:11:38. The SYMPTOM this metric measures took until roughly
          # 00:30 the next day to be noticed, because the clock barely drifted —
          # final offset was 4.9 MICROSECONDS. Chrony's frequency estimate held
          # the clock accurate long after it stopped being disciplined. So the
          # damage is not drift-so-far, it is that nothing is correcting it, and
          # the next reboot or a warm RTC is where that bites. Alert on the state,
          # not on how bad it has got.
          #
          # 15m rather than minutes: node_timex_sync_status legitimately reads 0
          # during a reboot and for a short window on a cold start.
          expr: |
            node_timex_sync_status == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} is not synchronising time"
            description: >
              The kernel reports the clock as unsynchronised on
              {{ $labels.instance }}. Check `chronyc activity` FIRST — "0 sources
              online" means chrony was parked offline by a network event and is
              not even trying, which reads identically to a firewall problem
              (Reach 0 on every source) while ICMP still works. Recover with
              `chronyc onoffline`, then confirm
              /etc/networkd-dispatcher/routable.d/50-chrony exists.
              On 2026-08-26 this state lasted 18 hours on an etcd voter.

    # -----------------------------------------------------------------------
    # Disk headroom check — ansible/playbooks/disk-check-timer.yml on the H4
    #
    # Complements NodeFilesystemAlmostOutOfSpace (built-in, warns at 85%) rather
    # than duplicating it: this fires at 85% too, but also reports how much
    # unallocated LVM space is available, which is usually the cheap fix. On
    # 2026-07-26 n150-1 filled its 50G root while 24G sat unallocated in the
    # same volume group, and the built-in alert could not have told you that.
    # -----------------------------------------------------------------------
    - name: lab.disk
      rules:
        - alert: LabNodeDiskLow
          # Deliberately NOT based on node_systemd_* — see the lab.backups note.
          # Mirrors the disk_fail_percent threshold in check-disk-space.yml so the
          # weekly playbook and this alert agree. The playbook adds the part
          # Prometheus cannot: how much unallocated LVM space is available.
          expr: |
            (
              1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            ) * 100 > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} root filesystem over 85%"
            description: >
              {{ $labels.instance }} is at {{ $value | printf "%.1f" }}% on /.
              Check `vgs` on that host BEFORE trimming Prometheus retention or
              pruning images — on 2026-07-26 n150-1 filled a 50G root while 24G
              sat unallocated in the same volume group, and lvextend -r was the
              cheap fix. Detail:
              ansible-playbook -i inventory/hosts.yml playbooks/check-disk-space.yml
              -e disk_check_deep=true

    # -----------------------------------------------------------------------
    # KVM / libvirt VMs
    # -----------------------------------------------------------------------
    - name: lab.vms
      rules:
        - alert: LabVMCrashed
          # libvirt state codes: 6=crashed
          expr: libvirt_domain_state_code == 6
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "VM {{ $labels.domain }} has crashed"
            description: >
              The libvirt domain {{ $labels.domain }} on {{ $labels.instance }}
              is in crashed state (code 6).  Inspect with:
              virsh list --all && virsh dominfo {{ $labels.domain }}

        - alert: LabVMUnexpectedShutoff
          # State 5=shut off.  Fires only for VMs that should always be running.
          # Adjust the domain filter to match your always-on VMs.
          #
          # Corrected 2026-07-25: this filtered on `ldap-1`, a VM decommissioned
          # on 2026-07-04 when lldap moved into k3s. The rule had therefore been
          # dead for three weeks — it could never fire, so an actual always-on VM
          # shutting down would have gone unnoticed. gitlab-1 is now the only
          # always-on VM in the lab (see README fleet table).
          expr: |
            libvirt_domain_state_code{domain=~"gitlab-1"} == 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "VM {{ $labels.domain }} is unexpectedly shut off"
            description: >
              {{ $labels.domain }} has been shut off for more than 5 minutes.
              If this was intentional, silence this alert.

    # -----------------------------------------------------------------------
    # ArgoCD sync health
    # -----------------------------------------------------------------------
    - name: lab.argocd
      rules:
        - alert: LabArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is out of sync"
            description: >
              {{ $labels.name }} has been in sync_status={{ $labels.sync_status }}
              for more than 15 minutes.  Check: argocd app get {{ $labels.name }}

        - alert: LabArgoCDAppDegraded
          expr: |
            argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is degraded"
            description: >
              {{ $labels.name }} health is {{ $labels.health_status }}.
              Check: argocd app get {{ $labels.name }}

    - name: lab.images
      rules:
        # Added 2026-08-28 as the "detect" half of a deliberate accept-and-detect
        # decision on image-cache variance (BACKLOG §9).
        #
        # WHY THIS EXISTS
        #
        # registries.yaml mirrors only the lab Zot registry — docker.io and ghcr.io
        # mirroring was removed on 2026-08-09 and deliberately not restored, because
        # routing every pull through a registry that runs inside the cluster it serves
        # is a cold-start dependency. So every public pull goes straight to the
        # internet from whichever node needs it.
        #
        # Combined with imagePullPolicy defaulting to IfNotPresent, an image exists on
        # a node only if that workload has already run there. Measured 2026-08-28
        # across the five nodes: home-assistant:2026.7.2 and its busybox:1.38 init are
        # cached on ONE node of five, immich-machine-learning on one, immich-server on
        # two. All are replicas:1 Deployments with no scheduling constraint, so a
        # reschedule has a good chance of needing a pull to start at all.
        #
        # Nothing has broken. This alert exists so that when it does, it surfaces in
        # minutes rather than being discovered weeks later from three timestamps —
        # which is exactly how §1.12 went.
        #
        # VERIFIED BOTH DIRECTIONS BEFORE MERGING, 2026-08-28.
        #
        # `count(kube_pod_container_status_waiting_reason)` returned nothing, which is
        # the shape this lab has misread three times in a week. It was NOT a missing
        # metric: kube-state-metrics emits this family only for containers currently
        # waiting, so empty is the correct steady state. The control that established
        # that was `count(kube_pod_info)` -> 93, proving KSM is scraped and healthy.
        #
        # Then a deliberate failure — a pod in a scratch namespace pulling
        # ghcr.io/swares/does-not-exist:v0 — reached ImagePullBackOff and the series
        # appeared with the labels these annotations use. So the expression matches
        # something real, rather than being plausible and inert.
        #
        # (That test pod was first rejected by Kyverno's require-resource-limits in
        # Enforce, which is an incidental confirmation that the policy blocks what it
        # claims to — see §3.8, where real blocks are hard to see amid violations
        # against dead ReplicaSets.)
        #
        # If this rule is ever edited, re-run that test. An alert on a metric that
        # only exists during the failure it detects cannot be validated any other way.
        - alert: LabImagePullFailing
          # ErrImagePull is the first failure; ImagePullBackOff is the retry state.
          # Both, because a fast-failing pull that never reaches backoff still means
          # a container that cannot start.
          expr: |
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull {{ $labels.container }}"
            description: >
              Container {{ $labels.container }} has been in {{ $labels.reason }} for
              10 minutes. With no pull-through cache, this usually means the image is
              not cached on this node and the public registry is unreachable or rate
              limiting. Check: kubectl -n {{ $labels.namespace }} describe pod
              {{ $labels.pod }} — and `k3s ctr images ls | grep <image>` on the node.

        # Same expression, longer fuse, critical — because warnings route to the
        # m5stack display only, and a workload that has been unable to start for
        # three quarters of an hour is an outage rather than a notice. This is the
        # same split as LabClockUnsynced against the built-in NodeClockNotSynchronising:
        # the metric is not the question, the routing is.
        - alert: LabImagePullStuck
          expr: |
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} > 0
          for: 45m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} still cannot pull after 45m"
            description: >
              {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has
              been unable to pull its image for 45 minutes and is not going to recover
              on its own. If the node lacks the image and the registry is reachable,
              `k3s ctr images pull <image>` on that node unblocks it (k3s ctr, not
              plain ctr — the opi5pro boxes run a second containerd whose images no
              pod can use).

    # ─────────────────────────────────────────────────────────────────────────
    # BACKLOG §3.11 — Ansible drift detection.
    #
    # Argo CD reconciles the cluster continuously with selfHeal, so a merged
    # manifest reaches the cluster within ~30s whether anyone is watching or not.
    # ANSIBLE RECONCILES NOTHING. A merged host-layer change takes effect only when
    # a human remembers to run the playbook. These rules are the marker at that
    # boundary.
    #
    # Metrics come from ansible-drift-check.sh via node_exporter's textfile
    # collector on the H4, published weekly by ansible-drift-check.timer.
    #
    # WRITTEN ONLY AFTER THE FLOOR REACHED ZERO (2026-08-30, commit 98be83e:
    # 21 playbooks, 0 drift, 0 check failures). That order was deliberate. An alert
    # shipped against a permanently non-zero gauge is an alert that is ignored from
    # day one — which is exactly what LabExternalHostDown did for three weeks against
    # a decommissioned VM. Both floor items turned out to be the SAME BUG, a date
    # rendered into a path or a payload:
    #   shared-storage    — ansible_date_time.iso8601 in file CONTENT, plus the play
    #                       deleted the file it then tried to read back
    #   h4-dns-resolvers  — ansible_date_time.date in a backup FILENAME, so
    #                       `force: false` had nothing to protect and rewrote daily
    # Neither was drift. If a new playbook joins the covered set and pins the gauge
    # at a constant non-zero, look for a timestamp before looking for a drifted host.
    - name: lab.ansible-drift
      rules:
        # The scrape interval is minutes and the metric updates weekly, so `for:`
        # here is about avoiding a partial-file read, not about debouncing. A real
        # drift persists until someone runs the playbook, so this stays firing for up
        # to a week — that is the intent, not a flaw.
        - alert: LabAnsibleDrift
          expr: lab_ansible_drift > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.playbook }} — hosts differ from git"
            description: >
              ansible-playbook --check reported {{ $value }} changed task(s) for
              {{ $labels.playbook }}. The hosts and git have diverged: either the
              playbook was merged and never run, or something changed a host directly.
              DO NOT REFLEXIVELY APPLY IT. On 2026-08-30, three of four non-zero
              readings meant GIT was wrong, not the host — mount-nvme.yml would have
              stripped `nofail` from a headless SBC's fstab to add an option it was
              missing. Run `ansible-playbook -i inventory/hosts.yml
              playbooks/{{ $labels.playbook }}.yml --check --diff` on the H4 and read
              the diff before deciding which side is correct.

        # Distinct from drift, and deliberately NOT folded into it. "Could not look"
        # and "looked, found nothing" are different states and only one is reassuring.
        # The script publishes lab_ansible_drift 0 alongside this, so without a
        # separate rule a broken check is indistinguishable from a clean one.
        - alert: LabAnsibleCheckFailed
          expr: lab_ansible_check_failed > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.playbook }} — --check could not complete"
            description: >
              ansible-playbook --check failed for {{ $labels.playbook }}, so its drift
              is UNKNOWN and is being reported as 0. Every instance of this found on
              2026-08-30 was a playbook that could not run at all, not a host problem:
              an undeclared collection, an undefined vault variable censored by
              no_log, a check-mode cascade, and a play requiring a full system upgrade.
              See `journalctl -u ansible-drift-check` on the H4 for the last 20 lines
              of the failure.

        # THE MOST IMPORTANT RULE HERE. Without it a dead timer freezes every gauge
        # above at its last value and the lab looks permanently calm — the same
        # failure LabBackupEtcdSilent exists to catch on the backup timers.
        # The timer is weekly (Sun 05:00, Persistent=true). 10 days allows one late
        # run plus catch-up; 14 would let a fully missed week pass unremarked.
        - alert: LabAnsibleDriftStale
          expr: (time() - lab_ansible_drift_last_run_seconds) > 864000
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Ansible drift check has not completed in >10 days"
            description: >
              ansible-drift-check.timer is weekly, and the last successful completion
              was more than 10 days ago. Every lab_ansible_drift gauge is therefore
              STALE and its zeros mean nothing. Check
              `systemctl status ansible-drift-check.timer` and
              `journalctl -u ansible-drift-check` on the H4.

        # And the case where the series stops existing at all — node_exporter down,
        # the textfile collector unconfigured, or the .prom file removed. An alert on
        # a gauge cannot fire if the gauge is absent, so absence needs its own rule.
        # This is the §1.12 shape: a truncated view read as a complete one.
        - alert: LabAnsibleDriftMetricMissing
          expr: absent(lab_ansible_drift_last_run_seconds)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Ansible drift metrics have disappeared entirely"
            description: >
              lab_ansible_drift_last_run_seconds is absent, so no drift rule above can
              fire regardless of the hosts' true state. Check that node_exporter on the
              H4 still has --collector.textfile.directory set and that
              /var/lib/node_exporter/textfile_collector/ansible_drift.prom exists and
              is group-writable.

    # BACKLOG §3.16 — failed units outside the backup set.
    #
    # Until 2026-08-30 the systemd collector was scoped to backup-.+, so this rule
    # could not have been written: the series did not exist. nfs-server on n150-1 was
    # dead for 37 days inside that blind spot.
    #
    # NAME-SCOPED ON PURPOSE, and this filter — not the collector regex — is what
    # keeps the rule quiet. The H4 and cluster nodes run the DaemonSet with a named
    # include list, but rpi5 and the other external hosts run the Debian
    # prometheus-node-exporter package with ARGS="", whose systemd collector defaults
    # to unit-include=".+". EVERY unit on those hosts is already exposed. An unscoped
    # `state="failed"` rule would therefore fire on arrival against smartmontools on
    # SD-card boards, nvmf-autoconnect with no NVMe-oF, and openipmi on non-server
    # hardware — eleven permanently-failing units fleet-wide, all of them correct.
    #
    # Every name below was verified active and healthy on 2026-08-30, so this ships
    # green. Keep it that way: before adding a unit, check it is not already failed.
    - name: lab.systemd-units
      rules:
        - alert: LabSystemdUnitFailed
          # backup-.+ excluded — LabBackupUnitFailed already covers those at
          # severity: critical, and two rules on one series is two pages.
          expr: |
            node_systemd_unit_state{
              name=~"(ansible-drift-check|nfs-server|k3s|k3s-agent|containerd|docker|libvirtd|mosquitto|pihole-FTL|vault)\\.service",
              state="failed"
            } == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} failed on {{ $labels.instance }}"
            description: >
              {{ $labels.name }} is in state=failed on {{ $labels.instance }}. Check
              `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }}`
              — and do it promptly: the journal for the 2026-07-24 nfs-server failure
              had already rotated away when it was found 37 days later, leaving three
              timestamps and an exit code as the entire record. A unit with Restart=no
              stays failed until a human intervenes; `enabled` says nothing about
              whether it is running.

    # BACKLOG §3.14 — retention that quietly shrinks.
    #
    # Prometheus enforces whichever of `retention` (time) or `retentionSize` (bytes)
    # binds first. Here size always wins: on 2026-09-02 the counters read
    # size_retentions_total=19, time_retentions_total=0 — time-based retention had
    # never fired once — and the real horizon was 14.33 days against a config that
    # said 30d.
    #
    # That gap is invisible without asking. An empty Prometheus result looks identical
    # to a metric that never existed, so a post-incident query reaching back three
    # weeks returns nothing and reads as "the problem did not occur". This alert is
    # the detector that would have caught it without a control query.
    #
    # Same class as a backup that quietly stops: the config keeps advertising a
    # guarantee the system stopped providing.
    - name: lab.prometheus-retention
      rules:
        - alert: LabPrometheusRetentionShort
          # 12 days: the config claims 15d, and a healthy TSDB sits a little under its
          # nominal window because the oldest block is only deleted once fully aged
          # out. Below 12d means the size cap is biting harder than intended and the
          # window in git is drifting away from the window on disk again.
          expr: |
            (time() - prometheus_tsdb_lowest_timestamp_seconds) < (12 * 24 * 3600)
          # 6h, because a genuinely fresh TSDB (a wiped PV, a rebuilt node) legitimately
          # has a short horizon while it refills, and that must not page.
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Prometheus history is only {{ $value | humanizeDuration }} deep"
            description: >
              The oldest sample in the TSDB is {{ $value | humanizeDuration }} old,
              below the 15d the config claims. Check
              prometheus_tsdb_size_retentions_total against
              prometheus_tsdb_time_retentions_total to confirm the size cap is the
              binding limit, and prometheus_tsdb_storage_blocks_bytes against
              prometheus_tsdb_retention_limit_bytes. Either reclaim disk on n150-1 and
              raise retentionSize, or lower `retention` so git tells the truth —
              but do not leave the two disagreeing. Any analysis reaching back further
              than this window returns empty vectors that look like healthy zeroes.

        # The metric disappearing is not the same as the horizon being short, and a
        # rule on a gauge cannot fire when the gauge is absent. Same reasoning as
        # LabAnsibleDriftMetricMissing.
        - alert: LabPrometheusRetentionMetricMissing
          expr: absent(prometheus_tsdb_lowest_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Prometheus TSDB retention metrics have disappeared"
            description: >
              prometheus_tsdb_lowest_timestamp_seconds is absent, so
              LabPrometheusRetentionShort cannot fire whatever the real horizon is.
              Prometheus may not be scraping itself.
