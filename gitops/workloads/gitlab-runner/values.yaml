# gitlab-runner Helm values — kubernetes executor for the lab k3s cluster.
#
# Deployment notes:
#   - GitLab must be up before this can register. The runnerToken comes from
#     Admin → CI/CD → Runners in the GitLab UI (GitLab 16+ uses runner tokens,
#     not the legacy registration token).
#   - Store the token in Vault at secret/lab/gitlab/runner_token, then create
#     an ExternalSecret that writes it to the Secret named below.
#   - ArgoCD manages this via gitops/apps/gitlab-runner.yaml.
#
# Runner token bootstrap (one-time after GitLab is live):
#   1. Log in to https://gitlab.lab.home.arpa as root.
#   2. Admin → CI/CD → Runners → New instance runner → copy token.
#   3. vault kv put secret/lab/gitlab runner_token=glrt-...
#   4. kubectl -n gitlab-runner create secret generic gitlab-runner-secret \
#        --from-literal=runner-token=$(vault kv get -field=runner_token secret/lab/gitlab)
#   5. ArgoCD will then sync and register the runner automatically.

gitlabUrl: https://gitlab.lab.home.arpa

## Runner configuration
runners:
  # runners.secret mounts the named k8s Secret at /secrets in the pod.
  # The entrypoint reads /secrets/runner-token for glrt- auth tokens.
  # Secret is managed by ESO (see external-secret.yaml).
  secret: gitlab-runner-secret
  config: |
    [[runners]]
      name = "k3s-kubernetes"
      url = "https://gitlab.lab.home.arpa"
      executor = "kubernetes"
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "ubuntu:22.04"
        pull_policy = ["if-not-present"]

        # ---- RESOURCE LIMITS ON JOB PODS — BACKLOG §2.2 ----------------------
        # THESE MUST STAY ABOVE THE FIRST [runners.kubernetes.*] SUB-TABLE.
        # TOML ignores indentation: a key written after [runners.kubernetes.pod_labels]
        # belongs to pod_labels, however it is indented. Placed there on the first
        # attempt at this change and caught before merge — the runner would have
        # started with a nonsense pod_labels map and NO job limits, and job pods would
        # have gone on being rejected exactly as before, with the config looking fixed.
        #
        # These were absent, and `gitlab-runner` is NOT in require-resource-limits'
        # exclude list, so every job pod was REJECTED AT ADMISSION. Proved 2026-09-05
        # with a server-side dry-run of the shape the runner creates:
        #
        #   kubectl -n gitlab-runner run citest --image=ubuntu:22.04 \
        #     --restart=Never --dry-run=server
        #   -> denied: rule require-limits failed at
        #      path /spec/containers/0/resources/limits/
        #
        # So this is a REPAIR, not hardening: no GitLab job could start, which takes
        # the auto-rollback stage with it — the safety net for a bad merge to main
        # lives in the same pipeline as the checks it protects.
        #
        # helper_* is separate and equally required: the helper is another container
        # in the same pod, and the policy validates every one of them. Sized for what
        # these jobs actually do — yq, kubectl, argocd, curl, git.
        cpu_request = "100m"
        cpu_limit = "1"
        memory_request = "128Mi"
        memory_limit = "1Gi"
        helper_cpu_request = "50m"
        helper_cpu_limit = "500m"
        helper_memory_request = "64Mi"
        helper_memory_limit = "256Mi"
        service_cpu_request = "50m"
        service_cpu_limit = "500m"
        service_memory_request = "64Mi"
        service_memory_limit = "256Mi"

        [runners.kubernetes.node_selector]
          "kubernetes.io/hostname" = "n150-1"   # build jobs on the x86 node
        [runners.kubernetes.pod_labels]
          "app" = "gitlab-runner-job"

        # ---- THE DOCKER SOCKET IS GONE — BACKLOG §2.2 ------------------------
        # This block used to mount /var/run/docker.sock into every job pod with
        # read_only = false:
        #
        #   [[runners.kubernetes.volumes.host_path]]
        #     name = "docker-sock"
        #     mount_path = "/var/run/docker.sock"
        #     host_path = "/var/run/docker.sock"
        #     read_only = false
        #
        # Docker is genuinely running on n150-1 (socket present, daemon active,
        # /usr/bin/docker installed — checked 2026-09-05), the job container runs
        # as root by default, and n150-1 is a control-plane node and etcd voter.
        # A writable docker.sock is root on that host for anything that can open a
        # merge request. Not theoretical: dormant would have required Docker to be
        # absent, and it is not.
        #
        # NOTHING USED IT. Both pipelines — .gitlab-ci.yml and
        # ansible/.gitlab-ci.yml — run only yq, kubectl, argocd, curl and git. No
        # job builds an image; the m5stack-adapter image is built by hand on a
        # workstation, per its own README. So there is no replacement to design:
        # no dind, no kaniko, no buildkit. The block is simply deleted.
        #
        # IF A FUTURE JOB NEEDS TO BUILD IMAGES: do not restore this. Use an
        # in-pod builder that needs no daemon and no host mount (kaniko or
        # buildah), or keep building on a workstation as the adapter does.
        # Mounting the host daemon socket into a pod that arbitrary MR authors
        # control hands them the node.

## Resource limits for the runner manager pod itself
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

## Pin to n150-1 (x86)
nodeSelector:
  kubernetes.io/hostname: n150-1

## RBAC — runner needs to create/watch job pods in its namespace
rbac:
  create: true
  clusterWideAccess: false

## Service account
serviceAccount:
  create: true
  name: gitlab-runner

## Trust the lab root CA so the runner can verify GitLab's TLS cert.
# gitlab-tls Secret contains the lab CA cert (CA:TRUE), created imperatively:
#   kubectl -n gitlab-runner get secret gitlab-lab-tls \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/lab-ca.crt
#   kubectl -n gitlab-runner create secret generic gitlab-tls \
#     --from-file=gitlab.lab.home.arpa.crt=/tmp/lab-ca.crt
# GitLab nginx uses a cert signed by lab-ca (see gitlab-cert.yaml).
certsSecretName: gitlab-tls
