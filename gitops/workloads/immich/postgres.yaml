apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: immich-pgdata, namespace: immich }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path                # k3s built-in provisioner
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: immich-postgres, namespace: immich }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: immich-postgres } }
  template:
    metadata: { labels: { app: immich-postgres } }
    spec:
      containers:
        - name: postgres
          # MANDATORY: a Postgres image with the vector extension (VectorChord/pgvecto.rs).
          # PIN the current tag from the Immich docs — the extension version moves.
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          envFrom: [{ configMapRef: { name: immich-env } }]
          env:
            - { name: POSTGRES_USER, value: immich }
            - { name: POSTGRES_DB, value: immich }
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: immich-secrets, key: DB_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec:
              command: [pg_isready, -U, immich, -d, immich]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [pg_isready, -U, immich, -d, immich]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Raised from 256Mi/512Mi on 2026-08-26. After the H4's hard power-cycle this
          # pod OOMKilled (exit 137) seven times in a row: Postgres reached "ready to
          # accept connections", then died partway through WAL replay of an unclean
          # shutdown. 512Mi is enough for steady-state idling and is not enough for
          # recovery — which is exactly when you need the database to come back.
          #
          # This is also a vectorchord image (pgvector/VectorChord), so index memory is
          # well above a plain postgres:14 footprint. The H4 has 64 GB; 2Gi is not a
          # meaningful cost, and an OOM loop on the photo library's database is.
          #
          # The old values were never wrong in normal operation — they were wrong under
          # recovery, which is a state nothing had exercised until a power-cycle.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
      volumes:
        - { name: pgdata, persistentVolumeClaim: { claimName: immich-pgdata } }
---
apiVersion: v1
kind: Service
metadata: { name: immich-postgres, namespace: immich }
spec:
  selector: { app: immich-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
