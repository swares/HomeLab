apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-postgres-pdb
  namespace: immich
spec:
  # See gitops/workloads/lldap/pdb.yaml. immich-postgres runs replicas: 1, so
  # minAvailable: 1 blocks drains permanently rather than protecting anything.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: immich-postgres
