# ExternalSecret: immich-secrets from HashiCorp Vault
#
# ACTIVATION CHECKLIST — uncomment this file's resources only when ALL are true:
#   [ ] Vault is initialised and unsealed on rpi5 (192.168.1.128)
#   [ ] immich DB_PASSWORD written to Vault:
#         vault kv put secret/lab/immich DB_PASSWORD=<value>
#   [ ] external-secrets operator is Healthy in ArgoCD
#   [ ] The hand-created immich-secrets k8s Secret has been deleted:
#         kubectl delete secret immich-secrets -n immich
#
# The hand-created immich-secrets Secret has been deleted; external-secrets now owns it.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://192.168.1.128:8200"
      path: "secret"
      version: "v2"
      auth:
        # KUBERNETES AUTH — no expiry. ESO presents its own ServiceAccount token and Vault
        # validates it via TokenReview, issuing a short-lived token per request.
        #
        # Switched 2026-08-23, step 3 of 3 (BACKLOG.md §5). It replaced:
        #
        #     tokenSecretRef: {name: vault-token, namespace: external-secrets, key: token}
        #
        # a static token minted 2026-08-07 with a 768h TTL, due to expire ~2026-09-08 and
        # to fail SILENTLY: ESO would simply stop syncing, every existing k8s Secret would
        # keep its last value, and nothing would look wrong until something needed a
        # refresh. This removes the deadline rather than extending it.
        #
        # Only switched after ansible/playbooks/vault-eso-k8s-auth.yml performed a REAL
        # LOGIN and said so — "Kubernetes auth WORKS — a login returned a token." The
        # Vault-side configuration and this switch were deliberately separate changes so
        # each could be proven on its own.
        #
        # If this is wrong the failure is quiet, not loud: existing Secrets persist and
        # only refresh stops. Check by content, not by condition —
        #   kubectl get externalsecrets -A -o custom-columns=\
        #     NS:.metadata.namespace,NAME:.metadata.name,REFRESH:.status.refreshTime
        # an advancing refreshTime is proof; a `True` condition is not, because that is
        # the last known state of a CR that nobody may be reconciling.
        # Revert with `git revert` — the static token stays valid until 2026-09-08.
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets

        # NOTE: this ClusterSecretStore is cluster-scoped but lives in immich's directory,
        # so a `kubectl delete -k gitops/workloads/immich` would take every namespace's
        # secrets with it. gitops/workloads/external-secrets/ is now its natural home, but
        # moving a resource between Argo Applications means one prunes it while the other
        # creates it — and on 2026-08-21 an Argo prune in this exact namespace deleted the
        # ESO operator. Worth doing, worth doing on its own, worth doing carefully.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/lab/immich
        property: DB_PASSWORD
