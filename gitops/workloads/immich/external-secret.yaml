# ExternalSecret: immich-secrets from HashiCorp Vault
#
# ACTIVATION CHECKLIST — uncomment this file's resources only when ALL are true:
#   [ ] Vault is initialised and unsealed on rpi5 (192.168.1.128)
#   [ ] immich DB_PASSWORD written to Vault:
#         vault kv put secret/lab/immich DB_PASSWORD=<value>
#   [ ] external-secrets operator is Healthy in ArgoCD
#   [ ] The hand-created immich-secrets k8s Secret has been deleted:
#         kubectl delete secret immich-secrets -n immich
#
# The hand-created immich-secrets Secret has been deleted; external-secrets now owns it.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://192.168.1.128:8200"
      path: "secret"
      version: "v2"
      auth:
        # STATIC TOKEN — EXPIRES ~2026-09-08 AND FAILS SILENTLY.
        # ESO stops syncing, existing k8s Secrets keep their last values, and nothing
        # looks broken until something needs a refresh. BACKLOG.md §5.
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token

        # STEP 3 of the Kubernetes-auth migration. Swap the stanza above for this one
        # ONLY after `vault-eso-k8s-auth.yml` reports that a real login succeeds —
        # that playbook prints it explicitly. Kubernetes auth has no expiry: ESO
        # presents its own ServiceAccount token and Vault issues a short-lived token
        # per request.
        #
        # kubernetes:
        #   mountPath: kubernetes
        #   role: eso
        #   serviceAccountRef:
        #     name: external-secrets
        #
        # Blast radius if it is wrong: every ExternalSecret stops refreshing. Existing
        # Secrets persist, so nothing fails immediately — which makes it quiet rather
        # than safe. Verify with:
        #   kubectl -n external-secrets logs deploy/external-secrets | tail
        #   kubectl get externalsecrets -A     # SecretSynced on every row
        # Revert with `git revert`; the static token stays valid until 2026-09-08 and
        # is the fallback until then.
        #
        # NOTE: this ClusterSecretStore is cluster-scoped but lives in immich's
        # directory, so a `kubectl delete -k gitops/workloads/immich` would take every
        # namespace's secrets with it. Moving it to
        # gitops/workloads/external-secrets/ is worth doing separately.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: immich-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/lab/immich
        property: DB_PASSWORD
