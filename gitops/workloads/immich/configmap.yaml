# Non-secret env shared by the Immich pods. DB_PASSWORD/POSTGRES_PASSWORD live in the
# `immich-secrets` Secret (NOT in git) — create it out-of-band or via External Secrets:
#   kubectl create secret generic immich-secrets --from-literal=DB_PASSWORD="$(openssl rand -base64 32)" -n immich
apiVersion: v1
kind: ConfigMap
metadata: { name: immich-env, namespace: immich }
data:
  DB_HOSTNAME: immich-postgres
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: immich-redis
  IMMICH_MACHINE_LEARNING_URL: http://immich-ml:3003
  # Immich serves no metrics unless telemetry is explicitly enabled, and then on
  # a dedicated port — 8081 for the api server, 8082 for microservices — never on
  # 2283. The ServiceMonitor had pointed at 2283 since it was written, so /metrics
  # returned the web UI as text/html and Prometheus rejected it. That went
  # unnoticed for a month because Prometheus was ignoring the ServiceMonitor
  # entirely (see gitops/apps/monitoring.yaml).
  IMMICH_TELEMETRY_INCLUDE: all
