apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # renovate: datasource=helm registryUrl=https://kyverno.github.io/kyverno/ depName=kyverno
    targetRevision: 3.3.4
    helm:
      valuesObject:
        # Single-node k3s homelab — 1 replica per controller is sufficient.
        # Failure policy is Ignore: Kyverno downtime never blocks workload deploys.
        admissionController:
          replicas: 1
          serviceMonitor:
            enabled: true   # scrape by kube-prometheus-stack
        backgroundController:
          replicas: 1
          serviceMonitor:
            enabled: true
        cleanupController:
          replicas: 1
          serviceMonitor:
            enabled: true
        reportsController:
          replicas: 1
          serviceMonitor:
            enabled: true
        # If Kyverno is unavailable, webhooks fail open (don't block pods).
        # Acceptable trade-off for a homelab; tighten to Fail once stable.
        webhookFailurePolicy: Ignore
        # Bitnami moved docker.io/bitnami/* to docker.io/bitnamilegacy/* on
        # 2025-09-29. Both cleanup hooks below default to repository:
        # bitnami/kubectl, which now 404s:
        #   failed to resolve reference "docker.io/bitnami/kubectl:1.30.2": not found
        # That left the kyverno-clean-reports PostSync hook in ImagePullBackOff, so
        # every full sync hung waiting on it and then failed.
        #
        # bitnamilegacy is explicitly a temporary archive with no updates and may be
        # withdrawn. Mirror these into registry.apps.lab.home.arpa and repoint here.
        #
        # crds.migration uses ghcr.io/kyverno/kyverno-cli and is unaffected.
        webhooksCleanup:
          enabled: true
          image:
            repository: bitnamilegacy/kubectl
        policyReportsCleanup:
          enabled: true
          image:
            repository: bitnamilegacy/kubectl
        # NOTE: as of chart 3.3.4 this section creates nothing — `kubectl -n kyverno
        # get cronjob` returns no rows — so this override has never applied to any
        # resource. The paths that actually matter are webhooksCleanup.image and
        # policyReportsCleanup.image above. Left in place pending confirmation that
        # it can be deleted outright.
        cleanupJobs:
          admissionReports:
            image:
              registry: oci.bitnami.com
          clusterAdmissionReports:
            image:
              registry: oci.bitnami.com
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # required for Kyverno's large CRDs
