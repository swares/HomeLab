apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts depName=kube-prometheus-stack
    targetRevision: 72.6.2
    helm:
      valuesObject:
        # ---- Global ----
        fullnameOverride: kps

        # ---- Grafana ----
        grafana:
          enabled: true
          adminUser: admin
          # Password injected from Vault via ExternalSecret (grafana-admin-secret)
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          initChownData:
            enabled: false
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi
          nodeSelector:
            kubernetes.io/hostname: n150-1
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              cert-manager.io/cluster-issuer: lab-ca
            hosts:
              - grafana.apps.lab.home.arpa
            paths:
              - /
            tls:
              - hosts:
                  - grafana.apps.lab.home.arpa
                secretName: grafana-tls
          sidecar:
            dashboards:
              enabled: true          # auto-import dashboards from ConfigMaps
            datasources:
              enabled: true
          hostAliases:
            - ip: "10.43.10.71"
              hostnames:
                - authelia.apps.lab.home.arpa
          extraVolumes:
            - name: lab-ca
              configMap:
                name: lab-ca-cert
          extraVolumeMounts:
            - name: lab-ca
              mountPath: /etc/grafana/certs/lab-ca.crt
              subPath: lab-ca.crt
          extraSecretMounts:
            - name: grafana-oidc
              secretName: grafana-admin-secret
              mountPath: /etc/grafana/secrets
              readOnly: true
              defaultMode: 0440
          # OIDC role mapping. Here rather than in grafana.ini because the ini parser
          # strips the quotes this expression needs — full reasoning at
          # auth.generic_oauth.allow_sign_up below.
          #
          # "'Admin'" is a JMESPath string literal: it evaluates to Admin for every
          # authenticated user, which is the current (single-operator) intent. When a
          # second account exists this should become group-driven, e.g.
          #   contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'
          # which needs the group to exist in lldap and Authelia to emit it in the
          # `groups` claim that groups_attribute_path already reads. Do that as a
          # separate change — prove the mechanism with the literal first, or you are
          # debugging the claim and the parser at the same time.
          env:
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Admin'"

          grafana.ini:
            server:
              root_url: "https://grafana.apps.lab.home.arpa"
            auth.generic_oauth:
              enabled: "true"
              name: Authelia
              icon: signin
              client_id: grafana
              client_secret: "$__file{/etc/grafana/secrets/oidc-client-secret}"
              scopes: "openid profile email groups"
              empty_scopes: "false"
              auth_url: https://authelia.apps.lab.home.arpa/api/oidc/authorization
              token_url: https://authelia.apps.lab.home.arpa/api/oidc/token
              api_url: https://authelia.apps.lab.home.arpa/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              name_attribute_path: name
              use_pkce: "false"
              auto_login: "false"
              # role_attribute_path is deliberately NOT set here. It lived on this
              # line from 2026-07-20 (ee76f66, #249) until 2026-08-19 and never once
              # worked: every OIDC user landed as Viewer.
              #
              # The value has to reach Grafana as the JMESPath expression 'Admin' —
              # a quoted string literal. Written in grafana.ini it does not: the ini
              # parser strips the surrounding single quotes, so JMESPath receives a
              # bare `Admin` and reads it as a *field lookup* against the OIDC claims.
              # No such claim exists, the expression yields null, no role is resolved,
              # and Grafana falls back to the default org role — Viewer.
              #
              # Nothing about this fails loudly. The rendered grafana.ini reads
              # `role_attribute_path = 'Admin'`, which looks correct on inspection;
              # the login succeeds; the user is simply assigned the wrong role.
              # Confirmed 2026-08-19 against a live account (created 2026-07-21, one
              # day AFTER the mapping landed, isExternallySynced=true, role=Viewer).
              #
              # Set via env var instead — see `env:` below. Environment variables are
              # not ini-parsed, so the quotes survive. Grafana env vars also take
              # precedence over grafana.ini, so leaving a stale copy here would be a
              # second source of truth that silently loses.
              allow_sign_up: "true"
              tls_client_ca: /etc/grafana/certs/lab-ca.crt

        # ---- Prometheus ----
        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.apps.lab.home.arpa
            paths:
              - /
          prometheusSpec:
            # retentionSize was "40GB" on a node whose ROOT filesystem is 49GB.
            # local-path provisions from /var/lib/rancher/k3s/storage on /, so
            # Prometheus alone was permitted ~80% of the disk — before the OS,
            # 7.5GB of container images, Grafana, Alertmanager and the Loki
            # caches. Filling the disk was arithmetic, not bad luck.
            #
            # The consequence was kubelet evicting pods to reclaim ephemeral
            # storage: a mass eviction on 2026-07-23, and on 2026-07-26
            # authelia-postgres — the SSO database — was being evicted and
            # recreated roughly hourly, leaving six dead pods behind.
            #
            # 15GB leaves genuine headroom on a 49GB disk. Prometheus compacts
            # down to the new limit on its own. Whichever of retention/
            # retentionSize is reached first wins, so 30d still applies when
            # volume is low.
            #
            # ---- retention: 30d -> 15d, 2026-09-02. BACKLOG §3.14. ----
            #
            # "so 30d still applies when volume is low" was the reasonable guess above.
            # It has NEVER applied. Prometheus keeps counters for exactly this, and they
            # are unambiguous:
            #
            #     prometheus_tsdb_size_retentions_total   19
            #     prometheus_tsdb_time_retentions_total    0     <- never, in this window
            #
            # THOSE COUNTERS RESET ON RESTART — corrected 2026-09-04, when both read 0
            # because applying this very change restarted the pod. They mean "since the
            # last restart", and this pod restarts on every merge here, so do NOT re-read
            # them to confirm the reasoning below; two zeros are the normal state shortly
            # after any change. The comparison held because both were read in one process
            # lifetime. The durable measure is the horizon, which survives restarts
            # because the blocks do:
            #     (time() - prometheus_tsdb_lowest_timestamp_seconds) / 86400
            # 2026-09-04 it read 16.57d against this 15d config — slightly OVER, which is
            # correct: a block is deleted only once its newest sample ages out, so a
            # healthy TSDB sits a little above its nominal window.
            #
            # Size has evicted 19 times; time has evicted zero. The measured horizon:
            #
            #     lowest_timestamp 1787119200 vs now 1788357374 = 14.33 DAYS
            #
            # So `30d` was a number in git that nothing in the system honoured, and
            # anyone reading it — or docs/LEDGER-DESIGN.md, which is built on it —
            # would trust a fortnight of history that does not exist. An empty
            # Prometheus result is indistinguishable from a metric that never existed,
            # which is how this was found: a control query for `up` came back empty at
            # the same instant as the query being investigated.
            #
            # 15d is now the honest figure. It is NOT a reduction in capability —
            # nothing changes about what is stored. It makes the config describe the
            # system instead of contradicting it.
            #
            # WHY NOT RAISE retentionSize INSTEAD. Measured on n150-1 the same day:
            #     /              65G total, 44G used, 18G avail (71%)
            #     Prometheus PV  13G     Loki PV  12G      <- 25G of the 44G
            #     VG free        7.89G
            # There is no headroom to give without reclaiming space first. The space
            # exists — vm-storage is a 400G LV holding 72G (one 71G qcow2), so ~302G
            # sits idle — but reclaiming it means lvreduce on a mounted ext4: stop
            # gitlab-1, e2fsck, resize2fs, then lvextend the root LV. That is a
            # deliberate maintenance window, not a config change, and §3.14 tracks it.
            #
            # NOTE ON UNITS: Prometheus parses "15GB" as 15 GiB —
            # prometheus_tsdb_retention_limit_bytes reports 16106127360. The suffix
            # here is binary despite reading as decimal.
            retention: 15d
            retentionSize: "15GB"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 50Gi
            nodeSelector:
              kubernetes.io/hostname: n150-1
            # Scrape all namespaces
            podMonitorNamespaceSelector: {}
            serviceMonitorNamespaceSelector: {}
            ruleNamespaceSelector: {}

            # ...AND all ServiceMonitors within them. The *NamespaceSelector
            # fields above only choose which namespaces to look in; the object
            # selectors are separate, and kube-prometheus-stack defaults
            # *SelectorNilUsesHelmValues to true — which silently narrows them to
            # `release: monitoring`.
            #
            # Consequence, measured 2026-07-27: five ServiceMonitors carrying no
            # such label had NEVER been scraped — immich and litellm (31d, ours),
            # monitoring-grafana and alloy (Helm-managed by their own charts,
            # which do not set a `release` label), and argocd-metrics. Each one
            # existed in git, looked correct, and produced nothing.
            #
            # Labelling the objects was rejected as the fix: two are owned by
            # other charts and would revert on upgrade, and it leaves the same
            # trap set for the next ServiceMonitor anyone adds.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            # Static scrape targets — non-cluster hosts running apt node_exporter
            additionalScrapeConfigs:
              - job_name: node-exporter-external
                # n150-1 and n150-2 are now k3s server nodes — their node-exporter
                # runs as a DaemonSet pod and is scraped via ServiceMonitor.
                # Keeping them here caused port 9100 conflicts with the DaemonSet.
                static_configs:
                  - targets:
                      # Corrected 2026-07-25 (H28). Previously this list scraped
                      # ldap-1 (192.168.1.70), decommissioned 2026-07-04 — so
                      # LabExternalHostDown had been firing critical for ~3 weeks,
                      # training the eye to ignore it. Meanwhile Vault, the Pi-hole
                      # secondary, the 4th DNS server and the build agent were not
                      # scraped at all: real outages there were invisible.
                      # opi-zero2w-4 was already listed and was unreachable on
                      # 2026-07-25 (M-new-5) — the target was right, nothing was
                      # routing the alert anywhere.
                      #
                      # CORRECTED 2026-08-26. This previously read "has in fact
                      # been unreachable since at least 2026-07-25", which was
                      # repeated as current fact a month later and is wrong:
                      #   max_over_time(up{job="node-exporter-external"}[14d])
                      # returned 1 for ALL nine targets, including .99 and .184,
                      # so both were up at some point inside the last fortnight.
                      # A comment describing a live outage acquires a tense it
                      # cannot keep. Both boards are down again as of tonight —
                      # duration unestablished, and Prometheus only retains ~14d
                      # in practice (§3.14), so bracket it with 7d/3d/1d before
                      # assuming anything about how long.
                      - 192.168.1.50:9100   # gitlab-1 (GitLab CE VM)
                      - 192.168.1.148:9100  # octopi (DNS primary, Pi-hole)
                      - 192.168.1.116:9100  # rpi4b (DNS secondary, Pi-hole)
                      - 192.168.1.184:9100  # opi-zero2w-1 (DNS tertiary, dnsmasq)
                      - 192.168.1.217:9100  # opi-zero2w-3 (DNS quaternary, dnsmasq)
                      - 192.168.1.188:9100  # opi-zero2w-2 (MQTT primary)
                      - 192.168.1.99:9100   # opi-zero2w-4 (MQTT secondary/HA bridge)
                      - 192.168.1.128:9100  # rpi5 (HashiCorp Vault) — every
                                            # ExternalSecret in the lab depends on it
                      - 192.168.1.64:9100   # xu3-1 (build agent)
                relabel_configs:
                  - source_labels: [__address__]
                    regex: '([^:]+):\d+'
                    target_label: instance
              - job_name: libvirt
                static_configs:
                  - targets:
                      - 192.168.1.42:9177   # n150-1 (KVM host)
                      - 192.168.1.21:9177   # n150-2 (KVM host)

        # ---- Alertmanager ----
        alertmanager:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - alertmanager.apps.lab.home.arpa
            paths:
              - /
          alertmanagerSpec:
            nodeSelector:
              kubernetes.io/hostname: n150-1
            # Mounts the ExternalSecret at /etc/alertmanager/secrets/<name>/<key>
            # so receivers can reference URLs via url_file and keep the ntfy topic
            # (which IS the password) out of git.
            # See gitops/workloads/monitoring/alertmanager-externalsecret.yaml
            secrets:
              - alertmanager-endpoints
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 2Gi
          # ── Alert routing ────────────────────────────────────────────────────
          #
          # Until 2026-07-25 every alert went to exactly one place: a webhook to
          # an M5Stack display on the LAN. If you were asleep, out, or the display
          # was off, the alert was discarded — silently. A crash reporter burned a
          # CPU core on n150-1 for three weeks and nothing said a word.
          #
          # Three destinations now, each for a different failure class:
          #
          #   m5stack   — everything, ambient. Unchanged; still the at-a-glance view.
          #   ntfy      — severity=critical only, to your phone. Low volume so it
          #               stays trustworthy; priority/tags are set in the Vault URL.
          #   watchdog  — the Watchdog alert, which kube-prometheus-stack fires
          #               CONTINUOUSLY by design, forwarded to a healthchecks.io
          #               check. This is the one that watches the watcher: if
          #               Prometheus, Alertmanager, or n150-1 dies, the pings stop
          #               and healthchecks.io alerts from OUTSIDE the lab.
          #               Previously Watchdog was routed to 'null' — discarding
          #               precisely the signal that proves monitoring is alive.
          #
          # Note what this does and does not fix: Alertmanager runs IN the cluster,
          # so a new receiver only helps when the cluster is up. Cluster-down is
          # covered by the Watchdog route above and by healthchecks.io's h4-core
          # heartbeat. See docs/REVIEW-2026-07-24.md H25.
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - alertname = "InfoInhibitor"
                target_matchers:
                  - severity = "info"
            route:
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: 'null'
              routes:
                # Dead-man's switch. Watchdog always fires, so this route always
                # has traffic; repeat_interval drives the ping cadence. 5m repeat
                # against a 15m healthchecks Period leaves room for two missed
                # pings before it alarms — tight enough to notice, loose enough
                # not to flap on a slow reconcile.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: watchdog
                  group_wait: 0s
                  group_interval: 5m
                  repeat_interval: 5m
                  continue: false

                - matchers:
                    - alertname = "InfoInhibitor"
                  receiver: 'null'

                # Critical goes to BOTH the phone and the display. `continue: true`
                # is what makes the m5stack route below still see it — without it,
                # Alertmanager stops at the first matching route and the display
                # would go quiet for exactly the alerts that matter most.
                - matchers:
                    - severity = "critical"
                  receiver: ntfy
                  continue: true

                - receiver: m5stack
            receivers:
              - name: 'null'

              - name: m5stack
                webhook_configs:
                  - url: 'http://m5stack-adapter.monitoring.svc.cluster.local:8080/webhook'
                    send_resolved: true

              # url_file, not url: keeps the ntfy topic out of git. The topic is
              # the only credential ntfy has — anyone who knows it can read every
              # alert and publish fakes.
              - name: ntfy
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/alertmanager-endpoints/ntfy-url
                    send_resolved: true
                    max_alerts: 5

              - name: watchdog
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/alertmanager-endpoints/watchdog-url
                    send_resolved: false

        # ---- Node exporter — runs on all nodes ----
        prometheus-node-exporter:
          tolerations:
            - operator: Exists   # scrape inference nodes too
          extraArgs:
            # Enable systemd collector so backup timer metrics are available
            # (used by LabBackupNasSilent / LabBackupEtcdSilent alert rules).
            - --collector.systemd
            # Widened 2026-08-07 from (backup-nas|backup-etcd). The narrow regex
            # meant backup-cloud, backup-verify and backup-offsite produced no
            # node_systemd_* series at all, so no rule could see them however it
            # was written. backup-vault runs on the rpi5, whose Debian package
            # runs with ARGS="" and therefore includes every unit by default —
            # which is why that one was visible while the H4's were not.
            # WIDENED AGAIN 2026-08-30 to a NAMED SET — BACKLOG §3.16.
            #
            # backup-.+ alone meant node_systemd_unit_state existed for backup units
            # AND NOTHING ELSE, so no rule could be written that would find any other
            # failed unit. That is not a rule that fails to match — the series does
            # not exist, which is worse. It cost 37 days: nfs-server on n150-1 exited
            # 1/FAILURE on 2026-07-24 and stayed down, leaving /srv/libvirt-shared
            # unmounted on n150-2, both libvirt pools degraded, and live migration
            # impossible on the pair running gitlab-1. Nothing alerted; nothing could.
            #
            # WHY NOT `.+`. Measured across the 13 real hosts on 2026-08-30:
            # 3,430 systemd units. node_systemd_unit_state emits 5 series per unit
            # plus node_systemd_unit_start_time_seconds, so `.+` costs ~20,600 new
            # series against a Prometheus already evicting at ~14 days on a nominal
            # 30 (§3.14). It would also expose eleven units that are permanently and
            # correctly failed — smartmontools on SD/eMMC boards, nvmf-autoconnect
            # with no NVMe-oF, openipmi on non-server hardware — which is the
            # LabExternalHostDown failure again: an alert that is noise on day one is
            # an alert that trains the eye past it.
            #
            # This set is built from units MEASURED to exist and to matter. ~30 unit
            # instances across the DaemonSet nodes, ~180 series. All are healthy as of
            # 2026-08-30, so LabSystemdUnitFailed ships green.
            #
            # Adding a unit here is half the change: also add it to
            # LabSystemdUnitFailed's name filter in lab-alerts.yaml, and check it is
            # not currently failing first. Verify coverage with:
            #   curl -s http://<host>:9100/metrics | grep node_systemd_unit_state
            #
            # NOT INCLUDED, deliberately, because they are failing right now and would
            # fire on arrival — each needs its own fix first:
            #   prometheus-node-exporter  (masked+failed on h4-core, not-found on gitlab-1)
            #   dnsmasq                   (failed on BOTH opi5pro nodes)
            #   zswap-config              (failed on opi5pro-2 only — an eighth
            #                              divergence in that supposedly-identical pair)
            #   systemd-remount-fs        (failed on opi-zero2w-1 and -2)
            #
            # smbd/nmbd are absent because they were not measured, not because the NAS
            # should go unwatched. Monitoring is read-only and does not violate
            # CLAUDE.md's "never stop, restart, or reconfigure" — add them once
            # confirmed present.
            - --collector.systemd.unit-include=(backup-.+|ansible-drift-check|nfs-server|k3s|k3s-agent|containerd|docker|libvirtd|mosquitto)\.(service|timer)
            # Textfile collector, added 2026-08-29 for BACKLOG §3.11 — the
            # scheduled `ansible-playbook --check` drift report needs somewhere to
            # publish, and this is the path that already delivers to the phone via
            # node_exporter -> Prometheus -> Alertmanager.
            #
            # ORDERING WAS DELIBERATE AND ONE-WAY. The directory was created on all
            # five nodes by ansible/playbooks/node-exporter.yml (#500) and applied
            # BEFORE this flag was enabled. Pointing the collector at a missing
            # directory makes node_exporter log a read error on every scrape, on
            # every node — the sort of permanent low-grade noise that trains the eye
            # to skip exporter logs, which is how §3.15's 19-day crashloop went
            # unexamined. If this ever lands on a NEW node, run that playbook first.
            #
            # Only the H4 will actually have files here: the drift check runs from
            # the control node against the whole fleet, so it produces one set of
            # per-playbook numbers in one place rather than each node reporting on
            # itself. The other four read an empty directory, which costs nothing and
            # means a future per-node metric has somewhere to land without another
            # gitops change. Enabling it per-node instead would need a second
            # DaemonSet or a node-specific override — more machinery than the
            # benefit justifies.
            - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
          # The 2026-07-26 note claimed this could not work because node_exporter
          # needs /run/systemd/private, which is root-only. That was wrong. The
          # collector connects to the D-Bus SYSTEM bus, and the pod log on
          # 2026-08-02 said so explicitly:
          #   couldn't get dbus connection: dial unix
          #   /var/run/dbus/system_bus_socket: no such file or directory
          # /run/dbus/system_bus_socket is mode srw-rw-rw- and systemd's D-Bus
          # policy allows unprivileged reads of unit state, so UID 65534 and
          # readOnlyRootFilesystem: true are both fine — the socket simply has
          # to be visible inside the pod.
          extraHostVolumeMounts:
            - name: dbus
              hostPath: /run/dbus/system_bus_socket
              mountPath: /var/run/dbus/system_bus_socket
              readOnly: true
            # readOnly is correct and not merely cautious: node_exporter only READS
            # .prom files here. The writers are root-run systemd units on the host,
            # so the pod never needs write access — which also keeps
            # readOnlyRootFilesystem: true intact.
            - name: textfile
              hostPath: /var/lib/node_exporter/textfile_collector
              mountPath: /var/lib/node_exporter/textfile_collector
              readOnly: true
          # Mounting the socket is necessary but not sufficient on the Ubuntu
          # nodes. containerd applies its default AppArmor profile there, and
          # dbus-daemon mediates by peer profile, so the connection is refused
          # at the handshake:
          #   An AppArmor policy prevents this sender from sending this message
          #   to this recipient; ... member="Hello" ... destination=
          #   "org.freedesktop.DBus"
          # The opi5pro nodes (Orange Pi Jammy) have no AppArmor and worked as
          # soon as the socket was mounted — hence the amd64/arm64 split seen on
          # 2026-08-02. This matters specifically because backup-nas.timer and
          # backup-etcd.timer exist only on odroid-nas, which is one of the
          # confined nodes.
          #
          # Trade-off accepted: node_exporter loses AppArmor confinement. It
          # keeps UID 65534, runAsNonRoot, a read-only rootfs and no added
          # capabilities. The stricter alternative is a custom AppArmor profile
          # allowing only the D-Bus Hello and systemd read methods, which would
          # have to be installed on each Ubuntu host outside GitOps.
          containerSecurityContext:
            readOnlyRootFilesystem: true
            appArmorProfile:
              type: Unconfined

        # ---- kube-state-metrics ----
        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: n150-1

        # ---- Admission webhooks — disabled (homelab; TLS secret bootstrap unreliable on k3s) ----
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false

        # ---- k3s doesn't expose kube-controller-manager / scheduler on standard ports ----
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        # ---- etcd — BACKLOG §3.2, half two. Half one is playbooks/k3s-etcd-metrics.yml ----
        #
        # `enabled: true` ALONE DOES NOT WORK HERE, and this block is entirely about why.
        # The chart's defaults describe upstream kubeadm, not k3s:
        #
        #   default                      k3s reality
        #   ----------------------------------------------------------------
        #   port 2379                    metrics are on 2381, not the client port
        #   https + client certs         2381 is plain HTTP, no client auth
        #   selector on kube-system      embedded etcd runs INSIDE the k3s process;
        #     etcd static pods             there is no etcd pod to select
        #
        # So every one of the values below is load-bearing. Left at defaults this
        # produces a ServiceMonitor with no endpoints and a target that never scrapes —
        # which renders on a dashboard as coverage. That is worse than `enabled: false`,
        # because false is at least honest about what it does not watch.
        #
        # PREREQUISITE, and it is not optional: k3s binds the etcd metrics listener to
        # 127.0.0.1 unless `etcd-expose-metrics: true` is set. Measured on h4-core
        # 2026-09-02, both curls run FROM h4-core: 127.0.0.1:2381 -> 200, and its own
        # 192.168.1.160:2381 -> 000. Prometheus is a pod on n150-1 and cannot reach
        # loopback on three separate machines. playbooks/k3s-etcd-metrics.yml applied the
        # flag to all three voters on 2026-09-02 (rolling, one at a time, behind a quorum
        # gate); confirmed still exposed on 2026-09-04, etcd_server_has_leader=1 on all
        # three node IPs. If those return 000 again, fix that before touching this block.
        #
        # `endpoints` IS HARDCODED AND HAS TO BE. There is no Service to discover: the
        # chart builds an Endpoints object from this list. It is therefore a second place
        # the control-plane node IPs are written down — inventory/hosts.yml is the first.
        # Adding or replacing a server node means editing both, and nothing enforces it.
        # The detector for a missed edit is the target count, which is why the
        # verification below counts to 3 rather than checking that "etcd is up".
        kubeEtcd:
          enabled: true
          endpoints:
            - 192.168.1.160   # h4-core
            - 192.168.1.42    # n150-1
            - 192.168.1.21    # n150-2
          service:
            enabled: true
            port: 2381
            targetPort: 2381
          serviceMonitor:
            enabled: true
            # Explicit rather than inherited. The chart's default scheme is "", which
            # resolves to http today — but relying on an empty string to mean the right
            # thing is how a chart upgrade changes behaviour with no diff to review.
            scheme: http
        kubeProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # required for large CRDs
