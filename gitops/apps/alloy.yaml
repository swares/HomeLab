apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts depName=alloy
    targetRevision: 1.10.0
    helm:
      valuesObject:
        # DaemonSet — one pod per node to collect logs and journal.
        #
        # Kubernetes Events are deliberately NOT collected here. This is a
        # DaemonSet and loki.source.kubernetes_events watches the API server
        # rather than the local node, so each of the five pods would ship its own
        # copy of every event. Events are handled by the singleton `alloy-events`
        # release instead — see gitops/apps/alloy-events.yaml for the full
        # reasoning, and docs/LEDGER-DESIGN.md for why they are captured at all.
        controller:
          type: daemonset
          tolerations:
            - operator: Exists    # run on all nodes including inference nodes

          # Host journal, paired with alloy.mounts.extra above. The volume lives
          # under controller.volumes.extra and the mount under alloy.mounts.extra —
          # two different blocks, which is how the previous (invented) key names
          # went unnoticed.
          #
          # type: Directory is deliberate. Without it, Kubernetes CREATES an empty
          # directory when the host path is missing and the mount succeeds silently,
          # which is exactly the failure mode this whole entry is about. With it, a
          # node lacking a persistent journal fails to start its pod and says so.
          volumes:
            extra:
              - name: journal
                hostPath:
                  path: /var/log/journal
                  type: Directory
              - name: machine-id
                hostPath:
                  path: /etc/machine-id
                  type: File

        alloy:
          # Node name for the discovery.kubernetes field selector below. Must come
          # from the downward API — HOSTNAME inside a pod is the pod name.
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          configMap:
            content: |
              // ── Kubernetes pod logs ──────────────────────────────────────
              // NODE-SCOPED, and it must stay that way.
              //
              // Without the field selector below, discovery.kubernetes returns every
              // pod in the CLUSTER, and loki.source.kubernetes tails them through the
              // API rather than off local disk. Every one of the five DaemonSet pods
              // therefore collected every node's logs, and each line reached Loki
              // five times. Confirmed 2026-08-20: alloy-thttf on odroid-nas was
              // opening log streams for pods on n150-1, n150-2, opi5pro-1 and
              // opi5pro-2. See BACKLOG.md §3.9.
              //
              // The previous config set __host__ from the node name, which looks like
              // node filtering but is not — __host__ is a Promtail file-scraping
              // convention and is inert for loki.source.kubernetes. It was removed
              // rather than left to imply a filter that never existed.
              //
              // NODE_NAME comes from alloy.extraEnv below (fieldRef spec.nodeName).
              // Do NOT substitute HOSTNAME: inside a pod that is the pod name, not
              // the node name, and the selector would silently match nothing.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                // There is deliberately NO blanket labelmap here. Until 2026-08-20
                // this block carried:
                //   rule { action = "labelmap"
                //          regex  = "__meta_kubernetes_pod_label_(.+)" }
                // which promoted every Kubernetes pod label into a Loki stream label.
                // kube-prometheus-stack's operator pod carries enough labels to reach
                // 16, over Loki's max_label_names_per_series default of 15, so Loki
                // answered 400 and Alloy logged:
                //   "final error sending batch, no retries left, dropping data"
                // 400 is not retryable, so the entire batch was discarded — including
                // entries from unrelated streams that happened to be pushed alongside
                // it. Raising the Loki limit would have hidden this; the labels were
                // never worth having.
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.gateway.receiver]
              }

              // ── Node systemd journal ─────────────────────────────────────
              // Relabeling extracts unit and hostname from journal metadata so
              // Loki queries can filter by systemd unit or source host — matching
              // the labels Promtail produced before it was removed.
              // The relabel rules must be passed to the journal source via
              // relabel_rules — NOT chained downstream of it.
              //
              // Upstream docs, verbatim: "All messages read from the journal include
              // internal labels following the pattern of __journal_FIELDNAME and Alloy
              // drops them before sending to the list of receivers specified in
              // forward_to. To keep these labels, use the relabel_rules argument."
              //
              // Until 2026-08-21 this was wired source -> loki.relabel -> loki.write,
              // so every __journal_* label was stripped before the relabel component
              // ever saw it. Both rules matched nothing and every journal line from
              // every node landed in one undifferentiated {job="node-journal"} stream
              // with no unit and no hostname. Nothing errored: dropping labels is
              // normal behaviour, and a relabel rule that matches nothing is not a
              // fault.
              //
              // Diagnosis that found it (on the H4's pod, :12345/metrics):
              //   loki_source_journal_target_lines_total 6800   <- reading fine
              //   loki_relabel_entries_processed        6800   <- forwarding fine
              //   loki_relabel_cache_size                  1   <- ONE label set for
              //                                                   6800 entries
              // That cache size is the tell: identical input labels every time.
              //
              // The field names were always correct. Journald fields mostly begin with
              // an underscore, so _SYSTEMD_UNIT becomes __journal__systemd_unit — two
              // underscores between __journal and systemd_unit. Only the wiring was
              // wrong.
              loki.relabel "journal" {
                forward_to = []          // rules are consumed via .rules, not piped

                rule {
                  source_labels = ["__journal__systemd_unit"]
                  target_label  = "unit"
                }
                rule {
                  source_labels = ["__journal__hostname"]
                  target_label  = "hostname"
                }
              }

              loki.source.journal "systemd" {
                max_age       = "12h"
                labels        = { job = "node-journal" }
                relabel_rules = loki.relabel.journal.rules
                forward_to    = [loki.write.gateway.receiver]
              }

              // ── Forward to Loki gateway ──────────────────────────────────
              loki.write "gateway" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }

          # Journal mount for systemd log collection.
          #
          # THE KEY NAMES MATTER. Until 2026-08-21 this was written as
          #   alloy.extraVolumes / alloy.extraVolumeMounts
          # which are NOT keys in this chart. Helm discards unrecognised values
          # without warning, so no volume was ever created and no mount ever
          # existed — on any node. `kubectl exec ... -- ls /var/log/journal`
          # returned "No such file or directory" while loki.source.journal sat
          # there reporting healthy against an empty path, for seven weeks, in an
          # Application that Argo showed as Synced with the correct-looking config
          # visible in git. Nothing anywhere said no.
          #
          # The chart's real keys are alloy.mounts.extra (here) and
          # controller.volumes.extra (further down, a different block).
          mounts:
            extra:
              - name: journal
                mountPath: /var/log/journal
                readOnly: true

              # /etc/machine-id is NOT optional, and its absence is silent.
              #
              # sd-journal locates journals by machine ID: the host's journal lives
              # in /var/log/journal/<machine-id>/. A container gets its own
              # /etc/machine-id, which here was EMPTY — so the reader looked for a
              # journal belonging to no machine, found zero entries, and reported
              # success. Finding nothing is not an error, so the component stayed
              # healthy and the logs stayed clean.
              #
              # Verified 2026-08-21: with the journal mounted and readable (Alloy
              # runs as uid 0, files are root:systemd-journal 0640), and the host
              # directory plainly present as
              # /var/log/journal/e4c52d300a65467db8b36a2ca592b8ad, still nothing
              # shipped until this mount was added.
              - name: machine-id
                mountPath: /etc/machine-id
                readOnly: true

        serviceMonitor:
          enabled: true    # scrape Alloy metrics via existing Prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
