# Vault Kubernetes-auth identity for ESO — the contents of
# gitops/workloads/external-secrets/.
#
# WHY THIS FILE EXISTS RATHER THAN LETTING THE APPSET GENERATE IT
#
# workloads-appset.yaml names generated Applications `{{path.basename}}`, so a directory
# at gitops/workloads/external-secrets/ produces an Application named `external-secrets`
# — colliding with gitops/apps/external-secrets.yaml, which is the Helm chart that
# installs the operator itself.
#
# Two Applications with one name is not a cosmetic problem. The generated one points at a
# directory containing only a ServiceAccount, a ClusterRoleBinding and a token Secret, and
# it carries prune: true. If it won the race, Argo would prune everything the Helm release
# owns — deleting the external-secrets operator and stopping every ExternalSecret in the
# cluster from syncing.
#
# The directory is therefore excluded from the appset (see the comment there) and declared
# here under a distinct name. Same pattern as cert-manager, kyverno and monitoring, which
# are excluded for exactly this reason.
#
# WHAT IT DEPLOYS
#
# Step 1 of the migration off ESO's expiring static Vault token (BACKLOG §5). It is inert:
# it creates an identity Vault *can* use to validate cluster tokens, but ESO keeps using
# the static token until the ClusterSecretStore's auth stanza is switched over (step 3, in
# gitops/workloads/immich/external-secret.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-vault-auth
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:swares/HomeLab.git
    targetRevision: main
    path: gitops/workloads/external-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      # prune: true is safe HERE because this Application owns only the three objects in
      # that directory. It is precisely what would have been unsafe on an Application
      # sharing a name with the Helm release.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
