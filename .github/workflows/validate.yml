# Runs on every PR and push to main.
# Lints YAML, validates schemas, and enforces OPA policies.
#
# CI authority: GitLab CI is the authoritative pipeline (full validate/sync-check/rollback).
# This GitHub Actions workflow runs yaml-lint, schema validation and policy checks — all
# genuinely offline, no cluster access required, on GitHub-hosted runners.
#
# NOTE: everything here must work with NO cluster. A check that needs the API server
# will fail on every input, and if it also cannot report failure it will look green
# forever — which is exactly what happened to the client-side dry-run job removed
# below on 2026-07-25.
#
# No secrets required for these jobs.

name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Lint all YAML under gitops/
        run: |
          set -eu
          # DO NOT put this loop on the right-hand side of a pipe.
          # `find ... | while read` runs the loop body in a SUBSHELL, so any
          # variable set inside it — including the failure flag — is discarded
          # when the loop ends. This job therefore passed unconditionally on
          # every commit until 2026-07-25, including ones with invalid YAML.
          # Redirecting from a file keeps the loop in the current shell.
          # Parenthesised -name group: without it, precedence makes the implicit
          # -print apply inconsistently across the -o branches.
          find gitops/ \( -name '*.yaml' -o -name '*.yml' \) -print > /tmp/yaml-files
          failed=0
          while IFS= read -r f; do
            if ! out=$(yq e 'true' "$f" 2>&1 >/dev/null); then
              echo "FAIL: $f"
              echo "$out" | sed 's/^/    /'
              failed=1
            fi
          done < /tmp/yaml-files
          [ "$failed" -eq 0 ] || { echo "YAML lint failed."; exit 1; }
          echo "All YAML valid ($(wc -l < /tmp/yaml-files) files)."

  kubeconform:
    name: Schema validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate manifests against k8s 1.36 schema
        # --ignore-missing-schemas silently skips CRDs we don't have schemas for
        # (ArgoCD Application, ExternalSecret, Certificate, PrometheusRule, etc.).
        # Native k8s kinds (Deployment, Service, CronJob, NetworkPolicy, …) are checked strictly.
        # Helm values files (values.yaml, kustomization.yaml) are excluded — not k8s manifests.
        run: |
          find gitops/workloads -name '*.yaml' \
            ! -name 'values.yaml' \
            ! -name 'kustomization.yaml' \
            -print0 | \
            xargs -0 kubeconform \
              -kubernetes-version 1.36.0 \
              -ignore-missing-schemas \
              -summary \
              -output text

  appset-collisions:
    name: ApplicationSet name collisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Application name collisions and orphaned directories
        # Offline, milliseconds, no cluster needed — same class as yaml-lint and conftest.
        #
        # Exists because on 2026-08-21 gitops/workloads/external-secrets/ was added without
        # the matching exclusion in workloads-appset.yaml. Two Applications then claimed the
        # name `external-secrets`; the generated one won, and its prune: true deleted the
        # entire external-secrets Helm release. The operator was down ~20 minutes and every
        # status view stayed green throughout, because the ExternalSecret CRs and their
        # target Secrets survived — nothing was reconciling, and nothing said so.
        #
        # None of the existing jobs would have caught it: the YAML was valid, the schema was
        # valid, and no OPA policy covers cross-file naming. It was only visible by knowing
        # how the generator names things.
        run: |
          pip install --quiet pyyaml
          python3 scripts/check-appset-collisions.py .

  policy-check:
    name: OPA policy check (conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conftest
        run: |
          # renovate: datasource=github-releases depName=open-policy-agent/conftest
          VER=0.57.0
          curl -sSfLo /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin conftest

      - name: Run OPA policies against workload manifests
        # Policies: no floating :latest tags, no privileged containers, resource limits required.
        # Exceptions for known deferred items are in ci/data/exceptions.yaml.
        run: |
          find gitops/workloads -name '*.yaml' -print0 | \
            xargs -0 conftest test \
              --policy ci/policies \
              --data ci/data/exceptions.yaml

  # REMOVED 2026-07-25: `kubectl dry-run (client-side)`.
  #
  # The job claimed to "validate manifest structure without a live cluster". It
  # cannot. `kubectl apply --dry-run=client` downloads the OpenAPI schema from the
  # API server to validate against, so on a GitHub-hosted runner with no cluster
  # every single file failed with:
  #
  #   failed to download openapi: Get "http://localhost:8080/openapi/v2":
  #   dial tcp [::1]:8080: connect: connection refused
  #
  # It had therefore failed on every manifest since the day it was written, and
  # nobody knew, because the loop ran in a subshell and the job could not report
  # failure (see C4 in docs/REVIEW-2026-07-24.md). Making the job capable of
  # failing is what finally surfaced it.
  #
  # It is deleted rather than patched with --validate=false, which would skip the
  # OpenAPI check entirely and reduce the job to "is this parseable YAML" — already
  # covered by yaml-lint, and covered far better by kubeconform.
  #
  # Division of responsibility, so nothing is silently uncovered:
  #   yaml-lint    (here)      — parseable YAML
  #   kubeconform  (here)      — offline schema validation, k8s 1.36, CRDs skipped
  #   conftest     (here)      — offline OPA policy (no :latest, no privileged, limits)
  #   dry-run      (GitLab CI) — --dry-run=server against the real cluster, where
  #                              CRDs resolve and Kyverno admission actually runs
  #
  # If a kubectl-shaped check is ever wanted here again, the useful one is the
  # Kyverno CLI (`kyverno apply gitops/workloads/kyverno/ --resource gitops/`),
  # which evaluates the real ClusterPolicies offline. See H17.
