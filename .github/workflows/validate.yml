# Runs on every PR and push to main.
# Lints YAML, validates schemas, and enforces OPA policies.
#
# CI authority: GitLab CI is the authoritative pipeline (full validate/sync-check/rollback).
# This GitHub Actions workflow runs yaml-lint, schema validation, policy checks, and
# client-side manifest dry-runs — no cluster access required; runs on GitHub-hosted runners.
#
# No secrets required for these jobs.

name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Lint all YAML under gitops/
        run: |
          set -eu
          # DO NOT put this loop on the right-hand side of a pipe.
          # `find ... | while read` runs the loop body in a SUBSHELL, so any
          # variable set inside it — including the failure flag — is discarded
          # when the loop ends. This job therefore passed unconditionally on
          # every commit until 2026-07-25, including ones with invalid YAML.
          # Redirecting from a file keeps the loop in the current shell.
          # Parenthesised -name group: without it, precedence makes the implicit
          # -print apply inconsistently across the -o branches.
          find gitops/ \( -name '*.yaml' -o -name '*.yml' \) -print > /tmp/yaml-files
          failed=0
          while IFS= read -r f; do
            if ! out=$(yq e 'true' "$f" 2>&1 >/dev/null); then
              echo "FAIL: $f"
              echo "$out" | sed 's/^/    /'
              failed=1
            fi
          done < /tmp/yaml-files
          [ "$failed" -eq 0 ] || { echo "YAML lint failed."; exit 1; }
          echo "All YAML valid ($(wc -l < /tmp/yaml-files) files)."

  kubeconform:
    name: Schema validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate manifests against k8s 1.36 schema
        # --ignore-missing-schemas silently skips CRDs we don't have schemas for
        # (ArgoCD Application, ExternalSecret, Certificate, PrometheusRule, etc.).
        # Native k8s kinds (Deployment, Service, CronJob, NetworkPolicy, …) are checked strictly.
        # Helm values files (values.yaml, kustomization.yaml) are excluded — not k8s manifests.
        run: |
          find gitops/workloads -name '*.yaml' \
            ! -name 'values.yaml' \
            ! -name 'kustomization.yaml' \
            -print0 | \
            xargs -0 kubeconform \
              -kubernetes-version 1.36.0 \
              -ignore-missing-schemas \
              -summary \
              -output text

  policy-check:
    name: OPA policy check (conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install conftest
        run: |
          # renovate: datasource=github-releases depName=open-policy-agent/conftest
          VER=0.57.0
          curl -sSfLo /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin conftest

      - name: Run OPA policies against workload manifests
        # Policies: no floating :latest tags, no privileged containers, resource limits required.
        # Exceptions for known deferred items are in ci/data/exceptions.yaml.
        run: |
          find gitops/workloads -name '*.yaml' -print0 | \
            xargs -0 conftest test \
              --policy ci/policies \
              --data ci/data/exceptions.yaml

  dry-run-apply:
    name: kubectl dry-run (client-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Client-side dry-run all workload manifests
        # --dry-run=client validates manifest structure without a live cluster.
        # Server-side validation (schema + admission) runs in GitLab CI on a self-hosted runner.
        run: |
          set -eu
          # Two bugs fixed here on 2026-07-25, and they were hiding each other:
          #
          # 1. The loop ran on the right of a pipe, so FAILED=1 was set in a
          #    subshell and discarded — this job could never fail.
          # 2. The find had no exclusions, so it fed Helm values.yaml and
          #    kustomization.yaml to `kubectl apply`, which cannot apply them.
          #    Those failures were real but invisible because of (1). The
          #    kubeconform and GitLab dry-run jobs already excluded them.
          #
          # Fixing only (1) would have turned this job red on the next commit.
          find gitops/workloads -name '*.yaml' \
            ! -name 'values.yaml' \
            ! -name 'kustomization.yaml' \
            -print > /tmp/manifests
          failed=0
          while IFS= read -r f; do
            if ! out=$(kubectl apply --dry-run=client -f "$f" 2>&1); then
              echo "FAIL: $f"
              echo "$out" | sed 's/^/    /'
              failed=1
            fi
          done < /tmp/manifests
          [ "$failed" -eq 0 ] || { echo "Dry-run failed."; exit 1; }
          echo "All $(wc -l < /tmp/manifests) manifests passed client-side dry-run."
